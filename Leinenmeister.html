    shop: { label: 'Shop öffnen', fields: [{ k: 'shop', label: 'Shop', t: 'ref', ref: 'shops' }], run: async a => { await Menus.shop(a.shop); } },
    storage: { label: 'Monsterspeicher öffnen', fields: [], run: async () => { await Menus.storage(); } },
    setRespawn: { label: 'Rückkehrpunkt setzen (Heilzentrum)', fields: [], run: async () => { G.respawn = { map: World.mapId, x: World.p.x, y: World.p.y, dir: World.p.dir }; } },
    giveBadge: { label: 'Arenamedaille vergeben', fields: [{ k: 'gym', label: 'Arena', t: 'ref', ref: 'gyms' }], run: async a => { const g = Data.gym(a.gym); if (g) await Gyms.award(g); } },
    setTile: {
      label: 'Tile auf Karte ändern (Hindernis entfernen)', fields: [{ k: 'map', label: 'Karte (leer = aktuelle)', t: 'ref', ref: 'maps', opt: true }, { k: 'x', label: 'X', t: 'int' }, { k: 'y', label: 'Y', t: 'int' }, { k: 'layer', label: 'Ebene', t: 'layer', def: 'objects' }, { k: 'tile', label: 'Tile (leer = entfernen)', t: 'ref', ref: 'tiles', opt: true }],
      run: async a => { G.tiles[(a.map || World.mapId) + '|' + (a.layer || 'objects') + '|' + (a.x | 0) + '|' + (a.y | 0)] = +a.tile || 0; World.dirtyTiles(); }
    },
    music: { label: 'Musik abspielen', fields: [{ k: 'song', label: 'Musikstück', t: 'ref', ref: 'songs' }], run: async a => { Sound.playSong(a.song); } },
    sfx: { label: 'Soundeffekt abspielen', fields: [{ k: 'sfx', label: 'Effekt', t: 'ref', ref: 'sfx' }], run: async a => { Sound.sfx(a.sfx); } },
    wait: { label: 'Warten', fields: [{ k: 'frames', label: 'Dauer (60 = 1 Sekunde)', t: 'int', def: 30 }], run: async a => { await wait(U.clamp(a.frames | 0, 1, 600)); } },
    fade: { label: 'Bildschirm ab-/aufblenden', fields: [{ k: 'mode', label: 'Modus', t: 'select', opts: [['out', 'abblenden'], ['in', 'aufblenden']], def: 'out' }], run: async a => { if (a.mode === 'in') await UI.fadeIn(); else await UI.fadeOut(); } },
    end: { label: 'Ereignis beenden', fields: [], run: async (a, ctx) => { ctx.stop = true; } }
  }
};

const Script = {
  running: 0,
  // Führt eine Aktionsliste aus. ctx.self = auslösender NPC/Ereignis (Laufzeitobjekt), ctx.stop bricht ab.
  async run(list, ctx) {
    ctx = ctx || {};
    for (const a of list || []) {
      if (ctx.stop) break;
      const d = a && Act.defs[a.k];
      if (!d) { console.warn('Leinenmeister: unbekannte Aktion', a); continue; }
      try { await d.run(a, ctx); } catch (e) { console.error('Leinenmeister: Fehler in Aktion', a, e); }
    }
    return ctx;
  },
  path(s) { const M = { U: 'up', D: 'down', L: 'left', R: 'right' }; return String(s || '').toUpperCase().split('').map(c => M[c]).filter(Boolean); },
  ent(id, ctx) { if (!id) return ctx && ctx.self && ctx.self.kind === 'npc' ? ctx.self : null; return World.ents.find(e => e.kind === 'npc' && e.def.id === id) || null; },
  npcState(a, ctx, hidden) {
    const id = a.npc || (ctx && ctx.self && ctx.self.def.id); if (!id) return;
    G.npcState[(a.map || World.mapId) + '|' + id] = { hidden: hidden }; World.refresh();
  }
};

// ----- Quests ----------------------------------------------------------------
const Quests = {
  async start(id) { const q = Data.quest(id); if (!q || G.quests[id]) return; G.quests[id] = 'active'; Sound.sfx('confirm'); await UI.say('Neue Aufgabe:\n' + q.name); },
  async complete(id) {
    const q = Data.quest(id); if (!q || G.quests[id] === 'done') return; G.quests[id] = 'done';
    const d = Sound.jingle('j_item'); await UI.say('Aufgabe erledigt:\n' + q.name, { auto: Math.max(50, d * 60) });
    await Script.run(q.rewards, {});
  }
};

// ----- Arena-System ----------------------------------------------------------
// Arenen sind reine Daten (DB.gyms). Medaillen = gewonnene Arenen (G.badges enthält Arena-IDs).
const Gyms = {
  byLeader(trainerId) { return DB.gyms.find(g => g.leader === trainerId) || null; },
  byMap(mapId) { return DB.gyms.find(g => g.map === mapId) || null; },
  // Text, falls der Zutritt verweigert wird, sonst null.
  entryDenied(gym) { return Cond.all(gym.entryCond) ? null : (gym.entryDenied || 'Die Arena ist noch verschlossen.'); },
  leaderBlocked(gym) {
    if (!gym.needTrainers) return null;
    return gym.trainers.every(t => !Data.trainer(t) || G.defeated[t]) ? null : (gym.leaderDenied || 'Besiege zuerst alle Trainer dieser Arena!');
  },
  // Vergibt Medaille und einmalige Belohnungen (nie doppelt).
  async award(gym) {
    if (G.badges.includes(gym.id)) return;
    G.badges.push(gym.id);
    const d = Sound.jingle('j_badge'); await UI.say('{PLAYER} erhält die ' + gym.badge.name + '!', { auto: Math.max(60, d * 60) });
    await Script.run(gym.rewards, {});
    if (gym.winText) await UI.say(gym.winText);
    World.refresh();
  }
};

// ----- Trainer ---------------------------------------------------------------
const Trainers = {
  team(tr) { return tr.team.filter(t => Data.hasMon(t.species)).map(t => { const m = Mon.create(t.species, t.level || 5, { moves: (t.moves || []).filter(id => Data.idx.moves[id]) }); m.ot = tr.name; return m; }); },
  canFight(tr) { return (!G.defeated[tr.id] || tr.repeatable) && Cond.all(tr.cond); },
  // Kompletter Trainerkampf inkl. Dialog, Sieg-Verbuchung und Arena-Belohnung. Liefert 'win' | 'lose' | 'blocked'.
  async fight(tr, opts) {
    opts = opts || {};
    const gym = Gyms.byLeader(tr.id);
    if (gym) { const t = Gyms.leaderBlocked(gym); if (t) { await UI.say(t); return 'blocked'; } }
    if (!G.party.some(Mon.alive)) { await UI.say('Du hast kein kampfbereites Monster dabei!'); return 'blocked'; }
    const team = Trainers.team(tr);
    if (tr.intro) await UI.say(tr.intro);
    if (!team.length) return 'blocked';
    const res = await Battle.start({ kind: 'trainer', trainer: tr, enemy: team });
    if (res === 'win') G.defeated[tr.id] = true;
    await World.afterBattle(res, !!opts.canLose);      // blendet wieder ein bzw. bringt den Spieler in Sicherheit
    if (res !== 'win') return 'lose';
    if (gym) await Gyms.award(gym);
    World.refresh();
    return 'win';
  }
};

// ===== [10] WELT =============================================================
// Karten, Kollision, Übergänge, NPCs/Ereignisse, Trainer-Sichtlinien, Begegnungen.
const World = {
  active: false, map: null, mapId: '', ents: [], lock: 0, anim: 0, layerCache: {}, bubble: null, encCooldown: 0, bumpT: 0,
  // Spielerfigur: x/y = Rasterposition; während einer Bewegung läuft mt von 0 bis len (Pixel).
  p: { kind: 'player', x: 0, y: 0, dir: 'down', moving: false, mt: 0, len: 16, dx: 0, dy: 0, speed: 1, step: 0, turn: 0, walked: false, hop: false, scripted: false },

  start() { World.lock = 0; World.dirtyTiles(); UI.bannerT = 0; World.bubble = null; World.active = true; World.enter(G.map, G.x, G.y, G.dir); },

  // --- Kartenzugriff ---------------------------------------------------------
  // Ebenen einer Karte inkl. dauerhafter Änderungen aus dem Spielstand (Aktion "setTile").
  L(map) {
    let c = World.layerCache[map.id];
    if (!c) {
      c = map.layers; const pre = map.id + '|'; let copied = false;
      for (const k in G.tiles) {
        if (k.indexOf(pre) !== 0) continue;
        if (!copied) { c = { ground: c.ground.slice(), deco: c.deco.slice(), objects: c.objects.slice(), collision: c.collision, encounter: c.encounter }; copied = true; }
        const a = k.split('|'), x = +a[2], y = +a[3];
        if (Array.isArray(c[a[1]]) && a[1] !== 'collision' && a[1] !== 'encounter' && x >= 0 && y >= 0 && x < map.w && y < map.h) c[a[1]][y * map.w + x] = G.tiles[k] | 0;
      }
      World.layerCache[map.id] = c;
    }
    return c;
  },
  dirtyTiles() { World.layerCache = {}; },
  // Übersetzt Koordinaten relativ zur aktuellen Karte in {map,x,y}; berücksichtigt nahtlose Nachbarkarten.
  resolve(x, y) {
    const m = World.map; if (x >= 0 && y >= 0 && x < m.w && y < m.h) return { map: m, x: x, y: y };
    const c = m.connections; let n = null, nx = 0, ny = 0;
    if (y < 0 && c.north && (n = Data.map(c.north.map))) { nx = x - (c.north.offset | 0); ny = n.h + y; }
    else if (y >= m.h && c.south && (n = Data.map(c.south.map))) { nx = x - (c.south.offset | 0); ny = y - m.h; }
    else if (x < 0 && c.west && (n = Data.map(c.west.map))) { nx = n.w + x; ny = y - (c.west.offset | 0); }
    else if (x >= m.w && c.east && (n = Data.map(c.east.map))) { nx = x - m.w; ny = y - (c.east.offset | 0); }
    return n && nx >= 0 && ny >= 0 && nx < n.w && ny < n.h ? { map: n, x: nx, y: ny } : null;
  },
  tilesAt(x, y) { const r = World.resolve(x, y); if (!r) return null; const L = World.L(r.map), i = r.y * r.map.w + r.x; return { L: L, i: i, t: [Data.tile(L.objects[i]), Data.tile(L.deco[i]), Data.tile(L.ground[i])] }; },
  kindAt(x, y) { const c = World.tilesAt(x, y); if (!c) return ''; for (const t of c.t) if (t && t.kind) return t.kind; return ''; },
  // Kollision aus Kollisionsebene (1 = frei, 2 = blockiert) bzw. automatisch aus den Tiles.
  cellSolid(x, y) {
    const c = World.tilesAt(x, y); if (!c) return true;
    const col = c.L.collision[c.i]; if (col === 1) return false; if (col === 2) return true;
    if (!c.t[2]) return true;                       // kein Boden = Leere
    for (const t of c.t) if (t && t.solid) return true;
    return false;
  },
  entAt(x, y, solidOnly) {
    for (const e of World.ents) {
      if (e.hidden) continue; if (solidOnly && e.kind === 'event' && !e.def.solid) continue;
      if ((e.x === x && e.y === y) || (e.moving && e.x + e.dx === x && e.y + e.dy === y)) return e;
    }
    return null;
  },
  playerAt(x, y) { const p = World.p; return (p.x === x && p.y === y) || (p.moving && p.x + p.dx * (p.len / 16) === x && p.y + p.dy * (p.len / 16) === y) || (p.moving && p.hop && p.x === x && p.y + 1 === y); },
  blocked(x, y, who) { return World.cellSolid(x, y) || !!World.entAt(x, y, true) || (who && who !== World.p && World.playerAt(x, y)); },
  zoneAt(x, y) { const m = World.map, z = World.L(m).encounter[y * m.w + x] | 0; if (z === 9) return 0; if (z > 0) return z; return World.kindAt(x, y) === 'grass' ? 1 : 0; },
  warpAt(x, y, kind) { return World.map.warps.find(w => w.x === x && w.y === y && (w.kind || 'step') === kind) || null; },

  // --- Kartenwechsel ---------------------------------------------------------
  enter(mapId, x, y, dir, opts) {
    let m = Data.map(mapId);
    if (!m) { m = Data.map(DB.meta.startMap) || DB.maps[0]; if (!m) return false; x = DB.meta.startX; y = DB.meta.startY; }
    const prev = World.map, p = World.p; World.map = m; World.mapId = m.id;
    p.x = U.clamp(x | 0, 0, m.w - 1); p.y = U.clamp(y | 0, 0, m.h - 1); if (dir) p.dir = dir;
    p.moving = false; p.mt = 0; p.hop = false; p.scripted = false;
    World.ents = [];
    for (const d of m.npcs) World.ents.push({ kind: 'npc', def: d, x: d.x | 0, y: d.y | 0, hx: d.x | 0, hy: d.y | 0, dir: d.dir || 'down', moving: false, mt: 0, dx: 0, dy: 0, step: 0, wait: U.randInt(20, 120), hidden: false });
    for (const d of m.events) World.ents.push({ kind: 'event', def: d, x: d.x | 0, y: d.y | 0, hidden: false });
    World.refresh();
    if (m.song) Sound.playSong(m.song);
    if (m.kind === 'outdoor' && (!prev || prev.id !== m.id) && !(opts && opts.quiet)) UI.banner(m.name);
    return true;
  },
  // Sichtbarkeit aller NPCs/Ereignisse neu bestimmen (nach jedem Script und bei Kartenwechsel).
  refresh() {
    for (const e of World.ents) {
      const st = G.npcState[World.mapId + '|' + e.def.id];
      if (e.kind === 'event' && e.def.once && Game.flag(World.onceKey(e))) e.hidden = true;
      else if (st && st.hidden != null) e.hidden = !!st.hidden;
      else e.hidden = !Cond.all(e.def.visibleIf);
    }
  },
  onceKey(e) { return 'once|' + World.mapId + '|' + e.def.id; },
  async warp(mapId, x, y, dir, opts) {
    const fade = !opts || opts.fade !== false;
    if (fade) await UI.fadeOut();
    World.enter(mapId, x, y, dir);
    if (fade) { await wait(6); await UI.fadeIn(); }
    await World.autoEvents();
  },
  warpDenied(w) {
    if (!Cond.all(w.cond)) return w.denied || 'Hier geht es noch nicht weiter.';
    if (!Data.map(w.toMap)) return 'Dieser Übergang führt ins Leere. (Zielkarte fehlt)';
    if (w.toMap !== World.mapId) { const gym = Gyms.byMap(w.toMap); if (gym) { const t = Gyms.entryDenied(gym); if (t) return t; } }
    return null;
  },
  async useWarp(w) {
    const denied = World.warpDenied(w); if (denied) { await UI.say(denied); return; }
    Sound.sfx(World.kindAt(w.x, w.y) === 'stairs' ? 'stairs' : 'door');
    await World.warp(w.toMap, w.toX | 0, w.toY | 0, w.toDir || World.p.dir);
  },
  async autoEvents() { for (const e of World.ents.slice()) if (e.kind === 'event' && e.def.trigger === 'enter' && !e.hidden && World.page(e)) await World.runEnt(e); },

  // --- Scripts ---------------------------------------------------------------
  // Führt einen async-Ablauf aus und sperrt währenddessen die Spielersteuerung.
  async run(fn) {
    World.lock++;
    try { await fn(); } catch (e) { console.error('Leinenmeister: Ablauf-Fehler', e); }
    World.lock = Math.max(0, World.lock - 1); World.refresh(); Input.clear();
  },
  page(e) { return (e.def.pages || []).find(p => Cond.all(p.if)) || null; },
  async runEnt(e, talk) {
    const def = e.def;
    if (e.kind === 'npc') {
      if (talk && !e.moving) e.dir = OPP[World.p.dir];
      const tr = def.trainer ? Data.trainer(def.trainer) : null;
      if (tr && Trainers.canFight(tr)) { await World.engage(e, tr, false); return; }
      const pg = World.page(e);
      if (pg) await Script.run(pg.do, { self: e });
      else if (tr && tr.after) await UI.say(tr.after);
      return;
    }
    const pg = World.page(e); if (!pg) return;
    await Script.run(pg.do, { self: e });
    if (def.once) Game.setFlag(World.onceKey(e), true);
  },
  async exclaim(target) { Sound.sfx('exclaim'); World.bubble = { e: target, t: 40 }; await wait(40); World.bubble = null; },
  // Trainer hat den Spieler entdeckt (bySight) oder wurde angesprochen.
  async engage(e, tr, bySight) {
    const p = World.p;
    if (bySight) {
      await World.exclaim(e);
      for (let i = 0; i < 12; i++) { const d = DIRS[e.dir]; if (e.x + d.x === p.x && e.y + d.y === p.y) break; if (World.cellSolid(e.x + d.x, e.y + d.y) || World.entAt(e.x + d.x, e.y + d.y, true)) break; await World.walkEnt(e, e.dir, true); }
      p.dir = OPP[e.dir];
    }
    await Trainers.fight(tr, {});
  },
  checkSight() {
    if (World.lock || !G.party.some(Mon.alive)) return false; const p = World.p;
    for (const e of World.ents) {
      if (e.kind !== 'npc' || e.hidden || !e.def.trainer || e.moving) continue;
      const tr = Data.trainer(e.def.trainer);
      if (!tr || G.defeated[tr.id] || !Cond.all(tr.cond) || !(tr.sight > 0) || Gyms.byLeader(tr.id)) continue;
      const d = DIRS[e.dir];
      for (let i = 1; i <= tr.sight; i++) {
        const x = e.x + d.x * i, y = e.y + d.y * i;
        if (x === p.x && y === p.y) { World.run(() => World.engage(e, tr, true)); return true; }
        if (World.cellSolid(x, y) || World.entAt(x, y, true)) break;
      }
    }
    return false;
  },
  checkEncounter() {
    if (World.encCooldown > 0) { World.encCooldown--; return false; }
    const p = World.p, m = World.map; if (!G.party.some(Mon.alive)) return false;
    const zone = World.zoneAt(p.x, p.y); if (!zone) return false;
    const tab = m.encounters.find(t => (t.zone | 0) === zone); if (!tab) return false;
    if (Math.random() * 100 >= (tab.rate == null ? 10 : tab.rate)) return false;
    const slots = tab.slots.filter(s => Data.hasMon(s.species) && Cond.all(s.cond)); if (!slots.length) return false;
    const s = U.weighted(slots, q => q.weight == null ? 1 : q.weight), a = s.min | 0 || 1, b = s.max | 0 || a;
    const mon = Mon.create(s.species, U.randInt(Math.min(a, b), Math.max(a, b)));
    World.run(async () => { const res = await Battle.start({ kind: 'wild', enemy: [mon] }); await World.afterBattle(res, false); });
    return true;
  },
  // Nach jedem Kampf aufrufen. Liefert true, wenn der Spieler ohnmächtig wurde (Ablauf abbrechen).
  async afterBattle(res, canLose) {
    if (res === 'lose' && !canLose) { await World.whiteout(); return true; }
    if (res === 'lose') Mon.healParty();
    if (World.map && World.map.song) Sound.playSong(World.map.song);
    await UI.fadeIn(); World.encCooldown = 4; return false;
  },
  async whiteout() {
    const loss = Math.floor(G.money * (+DB.meta.whiteoutLoss || 0)); Game.addMoney(-loss);
    Mon.healParty(); Gfx.fade = 3;
    const r = G.respawn || {}; World.enter(Data.map(r.map) ? r.map : DB.meta.startMap, r.x, r.y, r.dir || 'down', { quiet: true });
    await wait(40); await UI.fadeIn(false, 8);
    await UI.say('{PLAYER} wurde in Sicherheit gebracht. Deine Monster sind wieder bei Kräften.' + (loss > 0 ? '\n\nUnterwegs hast du $' + loss + ' verloren...' : ''));
  },

  // --- Bewegung --------------------------------------------------------------
  async walkEnt(e, dir, force) {
    e.dir = dir; const d = DIRS[dir];
    if (!force && World.blocked(e.x + d.x, e.y + d.y, e)) { await wait(8); return false; }
    e.moving = true; e.dx = d.x; e.dy = d.y; e.mt = 0; e.step++;
    while (e.moving) await frame();
    return true;
  },
  async walkPlayer(dir) {
    const p = World.p, d = DIRS[dir]; p.dir = dir;
    if (World.blocked(p.x + d.x, p.y + d.y)) { await wait(8); return false; }
    p.moving = true; p.scripted = true; p.dx = d.x; p.dy = d.y; p.mt = 0; p.len = 16; p.speed = 1; p.hop = false; p.step++;
    while (p.moving) await frame();
    return true;
  },
  tryMove(dir) {
    const p = World.p, d = DIRS[dir], nx = p.x + d.x, ny = p.y + d.y; p.dir = dir;
    const pw = World.warpAt(p.x, p.y, 'push');
    if (pw && (pw.dir || 'down') === dir) { World.run(() => World.useWarp(pw)); return; }
    if (World.kindAt(nx, ny) === 'ledge') {
      if (dir === 'down' && !World.blocked(nx, ny + 1)) { p.moving = true; p.hop = true; p.dx = 0; p.dy = 1; p.mt = 0; p.len = 32; p.speed = 1; p.step++; Sound.sfx('ledge'); }
      else World.bump();
      return;
    }
    if (World.blocked(nx, ny)) { World.bump(); return; }
    const sw = World.warpAt(nx, ny, 'step');
    if (sw) { const denied = World.warpDenied(sw); if (denied) { World.run(() => UI.say(denied)); return; } }
    p.moving = true; p.hop = false; p.dx = d.x; p.dy = d.y; p.mt = 0; p.len = 16; p.step++;
  },
  bump() { if (World.anim - World.bumpT > 18) { World.bumpT = World.anim; Sound.sfx('bump'); } },
  afterStep() {
    const p = World.p, m = World.map; G.steps++; p.walked = true;
    if (p.x < 0 || p.y < 0 || p.x >= m.w || p.y >= m.h) { // nahtloser Wechsel zur Nachbarkarte
      const r = World.resolve(p.x, p.y);
      if (r) { World.enter(r.map.id, r.x, r.y, p.dir); if (World.ents.some(e => e.kind === 'event' && e.def.trigger === 'enter')) World.run(() => World.autoEvents()); }
      else { p.x = U.clamp(p.x, 0, m.w - 1); p.y = U.clamp(p.y, 0, m.h - 1); }
    }
    if (p.scripted) { p.scripted = false; return; }
    const w = World.warpAt(p.x, p.y, 'step');
    if (w) { World.run(() => World.useWarp(w)); return; }
    const ev = World.ents.find(e => e.kind === 'event' && !e.hidden && e.def.trigger === 'step' && e.x === p.x && e.y === p.y);
    if (ev && World.page(ev)) { World.run(() => World.runEnt(ev)); return; }
    if (World.checkSight()) return;
    if (World.checkEncounter()) return;
    World.control();
  },
  interact() {
    const p = World.p, d = DIRS[p.dir]; let x = p.x + d.x, y = p.y + d.y, e = World.entAt(x, y);
    if (!e && World.kindAt(x, y) === 'counter') e = World.entAt(x + d.x, y + d.y);
    if (e && (e.kind === 'npc' || e.def.trigger === 'interact')) World.run(() => World.runEnt(e, true));
  },
  // Spielereingaben auswerten (nur wenn keine Bewegung/kein Script läuft).
  control() {
    const p = World.p; if (World.lock || p.moving) return;
    if (Input.hit('start')) { World.run(() => Menus.main()); return; }
    if (Input.hit('a')) { World.interact(); return; }
    const dir = Input.dir();
    if (!dir) { p.turn = 0; p.walked = false; return; }
    if (dir !== p.dir && !p.walked) { p.dir = dir; p.turn = 5; return; }   // erst drehen, dann laufen
    if (p.turn > 0) { p.turn--; return; }
    p.speed = Input.held('b') ? 2 : 1;
    World.tryMove(dir);
  },
  updateEnt(e) {
    if (e.kind !== 'npc' || e.hidden) return;
    if (e.moving) { e.mt++; if (e.mt >= 16) { e.x += e.dx; e.y += e.dy; e.moving = false; e.mt = 0; } return; }
    const mv = e.def.move; if (World.lock || !mv || mv === 'none') return;
    if (--e.wait > 0) return; e.wait = U.randInt(50, 170);
    let dir = e.dir;
    if (mv === 'turn') { e.dir = U.pick(DIR_LIST); if (!World.p.moving) World.checkSight(); return; }
    if (mv === 'wander') dir = U.pick(DIR_LIST);
    else if (mv === 'pace_h') { if (dir !== 'left' && dir !== 'right') dir = 'left'; e.wait = 30; }
    else if (mv === 'pace_v') { if (dir !== 'up' && dir !== 'down') dir = 'down'; e.wait = 30; }
    const d = DIRS[dir], nx = e.x + d.x, ny = e.y + d.y, range = e.def.range == null ? 2 : e.def.range | 0, m = World.map;
    const ok = nx >= 0 && ny >= 0 && nx < m.w && ny < m.h && Math.abs(nx - e.hx) <= range && Math.abs(ny - e.hy) <= range && !World.blocked(nx, ny, e) && !World.map.warps.some(w => w.x === nx && w.y === ny);
    e.dir = dir;
    if (ok) { e.moving = true; e.dx = d.x; e.dy = d.y; e.mt = 0; e.step++; }
    else if (mv !== 'wander') e.dir = OPP[dir];
    if (!World.p.moving) World.checkSight();
  },
  update() {
    World.anim++; G.time += 1 / 60;
    for (const e of World.ents) World.updateEnt(e);
    const p = World.p;
    if (p.moving) { p.mt += p.speed; if (p.mt >= p.len) { p.x += p.dx * (p.len / 16); p.y += p.dy * (p.len / 16); p.moving = false; p.hop = false; p.mt = 0; World.afterStep(); } return; }
    World.control();
  },

  // --- Zeichnen --------------------------------------------------------------
  drawTile(id, sx, sy) {
    const t = Data.tile(id); if (!t) return;
    Gfx.spr(t.frames && t.frames.length ? t.frames[Math.floor(World.anim / 28) % t.frames.length] : t.sprite, sx, sy);
  },
  drawChar(csId, dir, walking, alt, sx, sy) {
    const cs = Data.charset(csId); if (!cs) { Gfx.spr('?', sx, sy - 4); return; }
    let key, flip = false;
    if (dir === 'down') { key = (cs.d || [])[walking ? 1 : 0]; flip = walking && alt; }
    else if (dir === 'up') { key = (cs.u || [])[walking ? 1 : 0]; flip = walking && alt; }
    else { key = (cs.s || [])[walking ? 1 : 0]; flip = dir === 'right'; }
    Gfx.spr(key || (cs.d || [])[0] || '?', sx, sy - 4, flip);
  },
  grassKey(x, y) { const c = World.tilesAt(x, y); if (!c) return null; for (const t of c.t) if (t && t.kind === 'grass') return t.sprite; return null; },
  draw() {
    const m = World.map, p = World.p; if (!m) { Gfx.clear(3); return; }
    const ppx = p.x * 16 + (p.moving ? p.dx * p.mt : 0), ppy = p.y * 16 + (p.moving ? p.dy * p.mt : 0);
    const camX = ppx - 64, camY = ppy - 64, tx0 = Math.floor(camX / 16), ty0 = Math.floor(camY / 16), L = World.L(m);
    for (let ty = ty0; ty <= ty0 + 9; ty++) for (let tx = tx0; tx <= tx0 + 10; tx++) {
      let LL = L, i = -1;
      if (tx >= 0 && ty >= 0 && tx < m.w && ty < m.h) i = ty * m.w + tx;
      else { const r = World.resolve(tx, ty); if (r) { LL = World.L(r.map); i = r.y * r.map.w + r.x; } }
      const sx = tx * 16 - camX, sy = ty * 16 - camY;
      if (i < 0) { if (m.border) World.drawTile(m.border, sx, sy); else Gfx.rect(sx, sy, 16, 16, 3); continue; }
      if (LL.ground[i]) World.drawTile(LL.ground[i], sx, sy); else Gfx.rect(sx, sy, 16, 16, 3);
      if (LL.deco[i]) World.drawTile(LL.deco[i], sx, sy);
      if (LL.objects[i]) World.drawTile(LL.objects[i], sx, sy);
    }
    const list = World.ents.filter(e => !e.hidden); list.push(p);
    const py = e => e.y * 16 + (e.moving ? e.dy * e.mt : 0);
    list.sort((a, b) => py(a) - py(b));
    for (const e of list) {
      const ex = e.x * 16 + (e.moving ? e.dx * e.mt : 0), ey = py(e), sx = ex - camX, sy = ey - camY;
      if (sx < -16 || sy < -20 || sx > 160 || sy > 150) continue;
      if (e.kind === 'event') { if (e.def.sprite) Gfx.spr(e.def.sprite, sx, sy); continue; }
      const walking = e.moving && ((e.mt % 16) >= 4 && (e.mt % 16) < 12);
      const hop = e.hop ? -Math.round(Math.sin(Math.PI * e.mt / e.len) * 7) : 0;
      World.drawChar(e.kind === 'player' ? DB.meta.playerCharset : e.def.charset, e.dir, walking, (e.step & 1) === 1, sx, sy + hop);
      if (!e.hop) { // hohes Gras verdeckt die Füsse
        const cy = Math.round(ey / 16), x0 = Math.floor(ex / 16), x1 = Math.floor((ex + 15) / 16);
        for (let gx = x0; gx <= x1; gx++) { const k = World.grassKey(gx, cy); if (k) Gfx.sprClip(k, gx * 16 - camX, cy * 16 - camY + 10, 0, 10, 16, 6); }
      }
    }
    if (World.bubble) { const e = World.bubble.e; Gfx.spr('s_exclaim', e.x * 16 + (e.moving ? e.dx * e.mt : 0) - camX, e.y * 16 + (e.moving ? e.dy * e.mt : 0) - camY - 19); }
    UI.drawBanner();
  }
};

// ===== [11] KAMPFSYSTEM ======================================================
// Rundenbasierter Kampf. Battle.start(cfg) ist eine async-Funktion und liefert
// 'win' | 'lose' | 'flee' | 'caught'. cfg: { kind:'wild'|'trainer', enemy:[Monster], trainer? }
// Nach Battle.start ist der Bildschirm weiss ausgeblendet -> Aufrufer ruft World.afterBattle().
const STRUGGLE = { id: '_struggle', name: 'Verzweifler', type: '', cat: 'phys', power: 40, acc: 100, pp: 1, prio: 0, target: 'enemy', effects: [{ k: 'recoil', pct: 50 }], anim: 'hit', sfx: 'hit' };

const Battle = {
  active: false, cfg: null, foes: [], pi: 0, ei: 0, ps: null, es: null, part: null, fleeTries: 0, levelled: null, v: null,
  P() { return G.party[Battle.pi]; },
  E() { return Battle.foes[Battle.ei]; },
  mon(side) { return side === 'p' ? Battle.P() : Battle.E(); },
  st(side) { return side === 'p' ? Battle.ps : Battle.es; },
  other(side) { return side === 'p' ? 'e' : 'p'; },
  nm(side) { return side === 'p' ? Mon.name(Battle.P()) : (Battle.cfg.kind === 'wild' ? 'Wildes ' : 'Gegn. ') + Mon.name(Battle.E()); },
  newSide() { return { stages: { atk: 0, def: 0, spc: 0, spd: 0, acc: 0, eva: 0 }, confuse: 0, flinch: false, moved: false }; },
  async say(t) { await UI.say(t, { keep: true, auto: 55 }); },      // Kampfmeldung: läuft nach kurzer Zeit von selbst weiter
  async sayWait(t) { await UI.say(t, { keep: true }); },             // Meldung, die bestätigt werden muss

  // ---------------------------------------------------------------------------
  async start(cfg) {
    const B = Battle; B.cfg = cfg; B.foes = cfg.enemy; B.ei = 0; B.pi = Math.max(0, Mon.firstAlive(G.party));
    B.ps = B.newSide(); B.es = B.newSide(); B.part = {}; B.fleeTries = 0; B.levelled = [];
    B.v = { pKind: 'none', eKind: 'none', pX: 0, eX: 0, pHp: B.P().hp, eHp: B.E().hp, pHide: false, eHide: false, pScale: 1, eScale: 1, pSink: 0, eSink: 0, pHud: false, eHud: false, fx: [], shake: 0, leash: null, expShow: Mon.expFrac(B.P()) };
    const tr = cfg.trainer, songs = DB.meta.songs || {};
    Sound.playSong(tr ? (tr.song || (Gyms.byLeader(tr.id) ? songs.leader : songs.trainer)) : songs.wild);
    await B.transition();
    B.active = true; Gfx.fade = -3;
    let result = 'win';
    try { result = await B.main(); }
    catch (e) { console.error('Leinenmeister: Kampf-Fehler', e); result = result || 'win'; }
    UI.tbHide();
    await UI.fadeOut();
    B.active = false; B.v = null;
    return result;
  },
  // Übergang Welt -> Kampf: Blitzen und Jalousie-Wischer.
  async transition() {
    for (let i = 0; i < 3; i++) { Gfx.invert = true; await wait(4); Gfx.invert = false; await wait(4); }
    let t = 0; const l = UI.push({ draw() { for (let r = 0; r < 9; r++) { const w = Math.round(160 * t); Gfx.rect(r & 1 ? 160 - w : 0, r * 16, w, 16, 3); } } });
    for (let i = 1; i <= 20; i++) { t = i / 20; await frame(); }
    await wait(6); UI.pop(l);
  },
  async main() {
    const B = Battle, v = B.v, cfg = B.cfg, tr = cfg.trainer;
    // --- Einmarsch ---
    v.pKind = 'trainer'; v.eKind = tr ? 'trainer' : 'mon'; v.pX = 90; v.eX = -110;
    UI.tbSet('');
    const slide = (async () => { for (let i = 0; i < 30; i++) { v.pX = Math.round(90 * (1 - (i + 1) / 30)); v.eX = Math.round(-110 * (1 - (i + 1) / 30)); await frame(); } })();
    await UI.fadeIn(true); await slide;
    if (tr) {
      await B.sayWait((tr.cls ? tr.cls + ' ' : '') + tr.name + ' möchte kämpfen!');
      for (let i = 0; i < 16; i++) { v.eX = i * 5; await frame(); }
      v.eKind = 'none'; v.eX = 0;
      await UI.say((tr.cls ? tr.cls + ' ' : '') + tr.name + ' setzt ' + Mon.name(B.E()) + ' ein!', { keep: true, wait: false });
      await B.appear('e');
    } else {
      Mon.see(B.E().species); v.eHud = true;
      await B.sayWait('Ein wildes ' + Mon.name(B.E()) + ' erscheint!');
    }
    for (let i = 0; i < 14; i++) { v.pX = -i * 6; await frame(); }
    v.pKind = 'none'; v.pX = 0;
    await UI.say('Los, ' + Mon.name(B.P()) + '!', { keep: true, wait: false });
    await B.appear('p');
    // --- Rundenschleife ---
    for (;;) {
      B.part[B.pi] = true;
      const act = await B.chooseAction();
      const eAct = B.aiAction();
      B.ps.moved = B.es.moved = false; B.ps.flinch = B.es.flinch = false;
      let res = null;
      if (act.type === 'flee') { res = await B.tryFlee(act.sure); if (res) return res; }
      else if (act.type === 'switch') await B.switchTo(act.to);
      else if (act.type === 'item') await B.useItem(act);
      else if (act.type === 'leash') { res = await B.tryCatch(act.item); if (res) return res; }
      if (act.type === 'move') {
        const pm = B.moveOf('p', act.idx), em = eAct.type === 'move' ? B.moveOf('e', eAct.idx) : null;
        let first = 'p';
        if (em) {
          if ((em.prio | 0) !== (pm.prio | 0)) first = (pm.prio | 0) > (em.prio | 0) ? 'p' : 'e';
          else { const ps = B.speed('p'), es = B.speed('e'); first = ps === es ? (Math.random() < 0.5 ? 'p' : 'e') : (ps > es ? 'p' : 'e'); }
        } else { await B.enemyItem(eAct); }
        for (const side of first === 'p' ? ['p', 'e'] : ['e', 'p']) {
          if (!Mon.alive(B.P()) || !Mon.alive(B.E())) break;
          if (side === 'p') await B.doMove('p', act.idx);
          else if (em) await B.doMove('e', eAct.idx);
        }
      } else if (Mon.alive(B.E()) && Mon.alive(B.P())) {
        if (eAct.type === 'move') await B.doMove('e', eAct.idx); else await B.enemyItem(eAct);
      }
      res = await B.resolveFaints(); if (res) return res;
      await B.endOfTurn();
      res = await B.resolveFaints(); if (res) return res;
    }
  },

  // --- Auswahl des Spielers ---------------------------------------------------
  async chooseAction() {
    const B = Battle, P = B.P(); let sel = 0;
    for (;;) {
      UI.tbSet('');
      sel = await UI.menu({ x: 16, y: 96, w: 144, cols: 2, cw: 64, items: ['KAMPF', 'MONSTER', 'BEUTEL', 'FLUCHT'], sel: sel, cancel: false });
      if (sel === 0) {
        if (!P.moves.some(m => m.pp > 0)) { await B.sayWait(Mon.name(P) + ' hat keine AP mehr!'); return { type: 'move', idx: -1 }; }
        let info = 0;
        const box = UI.push({ draw() { const mv = P.moves[info]; if (!mv) return; const d = Data.move(mv.id); Gfx.box(0, 52, 96, 36); Gfx.text(Data.type(d.type).name.toUpperCase().substr(0, 10), 8, 60); Gfx.text('AP ' + U.pad(mv.pp, 2) + '/' + U.pad(d.pp, 2), 8, 72); } });
        const i = await UI.menu({ x: 32, y: 88, w: 128, h: 56, pitch: 10, rows: 4, items: P.moves.map(m => Data.move(m.id).name), sel: B.lastMove | 0, onSel: n => { info = n; } });
        UI.pop(box);
        if (i < 0) continue;
        if (P.moves[i].pp <= 0) { await B.sayWait('Keine AP mehr für diese Attacke!'); continue; }
        B.lastMove = i; return { type: 'move', idx: i };
      }
      if (sel === 1) { const to = await Menus.party({ mode: 'battle', cur: B.pi }); if (to >= 0) return { type: 'switch', to: to }; continue; }
      if (sel === 2) {
        const r = await Menus.bag({ mode: 'battle' }); if (!r) continue;
        if (r.item.cat === 'leash') {
          if (B.cfg.kind !== 'wild') { await B.sayWait('Der Trainer stellt sich schützend davor! Monster anderer Trainer kann man nicht anleinen!'); continue; }
          return { type: 'leash', item: r.item };
        }
        if (r.item.cat === 'escape') { if (B.cfg.kind !== 'wild') { await B.sayWait('Aus einem Trainerkampf kannst du nicht fliehen!'); continue; } Bag.remove(r.item.id, 1); return { type: 'flee', sure: true, item: r.item }; }
        return { type: 'item', item: r.item, target: r.target };
      }
      if (sel === 3) {
        if (B.cfg.kind !== 'wild') { await B.sayWait('Du kannst aus einem Trainerkampf nicht fliehen!'); continue; }
        return { type: 'flee' };
      }
    }
  },
  moveOf(side, idx) { const m = Battle.mon(side); return idx < 0 || !m.moves[idx] ? STRUGGLE : Data.move(m.moves[idx].id); },

  // --- Gegner-KI ---------------------------------------------------------------
  aiAction() {
    const B = Battle, E = B.E(), P = B.P(), tr = B.cfg.trainer;
    if (tr && tr.items && E.hp > 0 && E.hp < Mon.maxHp(E) * 0.3) { // Trainer benutzt Heilgegenstand
      B.trItems = B.trItems || tr.items.map(i => ({ item: i.item, n: i.n | 0 || 1 }));
      const it = B.trItems.find(i => i.n > 0 && Data.item(i.item).heal > 0);
      if (it && Math.random() < 0.7) return { type: 'item', it: it };
    }
    const usable = E.moves.map((m, i) => ({ i: i, d: Data.move(m.id), pp: m.pp })).filter(m => m.pp > 0);
    if (!usable.length) return { type: 'move', idx: -1 };
    if (!tr || tr.ai === 'random' || Math.random() < 0.15) return { type: 'move', idx: U.pick(usable).i };
    let best = usable[0], bestScore = -1;
    for (const m of usable) {
      let s;
      if (m.d.cat !== 'status') s = Math.min(P.hp * 1.2, B.calcDamage('e', m.d, false, 0.92)) * (m.d.acc ? m.d.acc / 100 : 1);
      else {
        const ef = m.d.effects[0] || {}; s = Mon.maxHp(P) * 0.1;
        if (ef.k === 'status') s = P.status ? 0 : Mon.maxHp(P) * 0.3;
        else if (ef.k === 'stat') { const tgt = (ef.target || m.d.target) === 'self' ? B.es : B.ps; s = Math.abs(tgt.stages[ef.stat] || 0) >= 2 ? 0 : Mon.maxHp(P) * 0.18; }
        else if (ef.k === 'confuse') s = B.ps.confuse ? 0 : Mon.maxHp(P) * 0.25;
        else if (ef.k === 'heal') s = E.hp < Mon.maxHp(E) / 2 ? Mon.maxHp(P) * 0.4 : 0;
      }
      s *= 0.85 + Math.random() * 0.3;
      if (s > bestScore) { bestScore = s; best = m; }
    }
    return { type: 'move', idx: best.i };
  },
  async enemyItem(a) {
    const B = Battle, it = Data.item(a.it.item), E = B.E(); a.it.n--;
    await B.say((B.cfg.trainer.cls ? B.cfg.trainer.cls + ' ' : '') + B.cfg.trainer.name + ' setzt ' + it.name + ' ein!');
    Bag.useOnMon(it, E); Sound.sfx('heal_tick'); await B.hpAnim('e');
  },

  // --- Werte & Schaden ---------------------------------------------------------
  stageMult(n) { return n >= 0 ? (2 + n) / 2 : 2 / (2 - n); },
  accMult(n) { return n >= 0 ? (3 + n) / 3 : 3 / (3 - n); },
  speed(side) { const m = Battle.mon(side); return Mon.stat(m, 'spd') * Battle.stageMult(Battle.st(side).stages.spd) * (m.status === 'para' ? 0.5 : 1); },
  // Schadensformel (physisch: Angriff/Verteidigung, speziell: Spezial/Spezial).
  calcDamage(side, move, crit, rand) {
    const B = Battle, A = B.mon(side), D = B.mon(B.other(side)), as = B.st(side), ds = B.st(B.other(side));
    if (!move.power) return 0;
    const phys = move.cat !== 'spec';
    let a = Mon.stat(A, phys ? 'atk' : 'spc') * B.stageMult(as.stages[phys ? 'atk' : 'spc']);
    const d = Math.max(1, Mon.stat(D, phys ? 'def' : 'spc') * B.stageMult(ds.stages[phys ? 'def' : 'spc']));
    if (phys && A.status === 'burn') a *= 0.5;
    let dmg = Math.floor(Math.floor((Math.floor(2 * A.level / 5) + 2) * move.power * a / d) / 50) + 2;
    if (move.type && Mon.sp(A).types.includes(move.type)) dmg *= 1.5;
    dmg *= move.type ? Data.typeFactor(move.type, Mon.sp(D).types) : 1;
    dmg *= rand == null ? 0.85 + Math.random() * 0.15 : rand;
    if (crit) dmg *= 1.5;
    return Math.max(1, Math.floor(dmg));
  },
  async doMove(side, idx) {
    const B = Battle, o = B.other(side), A = B.mon(side), D = B.mon(o), as = B.st(side), nm = B.nm(side), move = B.moveOf(side, idx);
    as.moved = true;
    // -- Statusprüfungen vor dem Zug --
    if (A.status === 'sleep') { A.sleep--; if (A.sleep > 0) { Sound.sfx('sleep'); await B.say(nm + ' schläft tief und fest.'); return; } A.status = ''; await B.say(nm + ' ist aufgewacht!'); }
    if (A.status === 'freeze') { if (Math.random() < 0.2) { A.status = ''; await B.say(nm + ' ist wieder aufgetaut!'); } else { await B.say(nm + ' ist eingefroren!'); return; } }
    if (as.flinch) { await B.say(nm + ' schreckt zurück!'); return; }
    if (A.status === 'para' && Math.random() < 0.25) { await B.say(nm + ' ist paralysiert! Es kann nicht angreifen!'); return; }
    if (as.confuse > 0) {
      as.confuse--;
      if (as.confuse === 0) await B.say(nm + ' ist nicht mehr verwirrt!');
      else {
        await B.say(nm + ' ist verwirrt...');
        if (Math.random() < 0.33) {
          const dmg = Math.max(1, Math.floor((Math.floor(2 * A.level / 5) + 2) * 40 * Mon.stat(A, 'atk') / Math.max(1, Mon.stat(A, 'def')) / 50) + 2);
          Sound.sfx('hit'); await B.blink(side); A.hp = Math.max(0, A.hp - dmg); await B.hpAnim(side);
          await B.say('Es hat sich vor Verwirrung selbst verletzt!'); return;
        }
      }
    }
    if (idx >= 0 && A.moves[idx]) A.moves[idx].pp = Math.max(0, A.moves[idx].pp - 1);
    await UI.say(nm + ' setzt ' + move.name + ' ein!', { keep: true, wait: false }); await wait(14);
    const self = move.target === 'self';
    // -- Treffer? --
    if (!self && move.acc > 0) {
      const chance = move.acc * B.accMult(as.stages.acc - B.st(o).stages.eva);
      if (Math.random() * 100 >= chance) { await wait(10); await B.say('Die Attacke ging daneben!'); return; }
    }
    if (move.cat === 'status') {
      await B.playAnim(move, side);
      for (const ef of move.effects) await B.applyEffect(ef, side, move, 0, true);
      return;
    }
    const f = move.type ? Data.typeFactor(move.type, Mon.sp(D).types) : 1;
    if (f === 0) { await wait(10); await B.say('Es hat keine Wirkung auf ' + B.nm(o) + '...'); return; }
    const crit = Math.random() < (move.effects.some(e => e.k === 'crit') ? 0.25 : 0.0625);
    const dmg = Math.min(D.hp, B.calcDamage(side, move, crit));
    await B.playAnim(move, side);
    Sound.sfx(f > 1 ? 'hit_super' : f < 1 ? 'hit_weak' : 'hit');
    await B.blink(o); D.hp -= dmg; await B.hpAnim(o);
    if (crit) await B.say('Volltreffer!');
    if (f > 1) await B.say('Das ist sehr effektiv!'); else if (f < 1) await B.say('Das ist nicht sehr effektiv...');
    if (D.status === 'freeze' && Data.type(move.type).thaws && D.hp > 0) { D.status = ''; await B.say(B.nm(o) + ' ist aufgetaut!'); }
    for (const ef of move.effects) await B.applyEffect(ef, side, move, dmg, false);
  },
  // Wendet einen Zusatzeffekt an. primary = Effekt einer Statusattacke (Fehlschlag wird gemeldet).
  async applyEffect(ef, side, move, dmg, primary) {
    const B = Battle, tSide = (ef.target || (ef.k === 'heal' ? 'self' : move.target === 'self' ? 'self' : 'enemy')) === 'self' ? side : B.other(side);
    const T = B.mon(tSide), ts = B.st(tSide), U_ = B.mon(side), tn = B.nm(tSide);
    if (ef.chance != null && ef.chance < 100 && Math.random() * 100 >= ef.chance) return;
    if (ef.k === 'status') {
      if (T.hp <= 0) return; const types = Mon.sp(T).types;
      const immune = types.some(t => (Data.type(t).immune || []).includes(ef.status));   // z.B. Feuer-Typen brennen nicht (DB.types[].immune)
      if (T.status || immune || !STATUS[ef.status]) { if (primary) await B.say('Es hat keine Wirkung...'); return; }
      T.status = ef.status; if (ef.status === 'sleep') T.sleep = U.randInt(2, 4);
      Sound.sfx(ef.status === 'poison' ? 'poison' : ef.status === 'burn' ? 'burn' : ef.status === 'sleep' ? 'sleep' : 'stat_down');
      await B.say(tn + ({ poison: ' wurde vergiftet!', burn: ' erleidet Verbrennungen!', para: ' ist paralysiert! Es kann eventuell nicht angreifen!', sleep: ' ist eingeschlafen!', freeze: ' wurde eingefroren!' })[ef.status]);
    } else if (ef.k === 'stat') {
      if (T.hp <= 0) return; const cur = ts.stages[ef.stat]; if (cur == null) return; const n = ef.stages | 0;
      const nv = U.clamp(cur + n, -6, 6);
      if (nv === cur) { if (primary) await B.say(STAT_NAME[ef.stat] + ' von ' + tn + ' kann nicht weiter ' + (n > 0 ? 'steigen!' : 'sinken!')); return; }
      ts.stages[ef.stat] = nv; Sound.sfx(n > 0 ? 'stat_up' : 'stat_down'); await B.runAnim(n > 0 ? 'buff' : 'debuff', tSide);
      await B.say(STAT_NAME[ef.stat] + ' von ' + tn + (n > 0 ? ' steigt' : ' sinkt') + (Math.abs(n) > 1 ? ' stark!' : '!'));
    } else if (ef.k === 'confuse') {
      if (T.hp <= 0) return; if (ts.confuse > 0) { if (primary) await B.say(tn + ' ist bereits verwirrt!'); return; }
      ts.confuse = U.randInt(2, 4); await B.say(tn + ' ist verwirrt!');
    } else if (ef.k === 'flinch') { if (T.hp > 0 && !ts.moved) ts.flinch = true; }
    else if (ef.k === 'heal') {
      const max = Mon.maxHp(U_); if (U_.hp >= max) { if (primary) await B.say('Die LP von ' + B.nm(side) + ' sind bereits voll!'); return; }
      U_.hp = Math.min(max, U_.hp + Math.max(1, Math.floor(max * (ef.pct || 50) / 100))); Sound.sfx('heal_tick'); await B.hpAnim(side); await B.say(B.nm(side) + ' erholt sich!');
    } else if (ef.k === 'drain') {
      if (dmg <= 0 || U_.hp <= 0) return; U_.hp = Math.min(Mon.maxHp(U_), U_.hp + Math.max(1, Math.floor(dmg * (ef.pct || 50) / 100))); await B.hpAnim(side); await B.say(B.nm(side) + ' saugt Energie ab!');
    } else if (ef.k === 'recoil') {
      if (dmg <= 0 || U_.hp <= 0) return; U_.hp = Math.max(0, U_.hp - Math.max(1, Math.floor(dmg * (ef.pct || 25) / 100))); await B.hpAnim(side); await B.say(B.nm(side) + ' wird vom Rückstoss getroffen!');
    }
  },
  async endOfTurn() {
    const B = Battle;
    for (const side of ['p', 'e']) {
      const m = B.mon(side); if (!Mon.alive(m)) continue;
      if (m.status === 'poison' || m.status === 'burn') {
        const d = Math.max(1, Math.floor(Mon.maxHp(m) / (m.status === 'poison' ? 8 : 16)));
        Sound.sfx(m.status === 'poison' ? 'poison' : 'burn'); await B.blink(side); m.hp = Math.max(0, m.hp - d); await B.hpAnim(side);
        await B.say(B.nm(side) + (m.status === 'poison' ? ' leidet unter der Vergiftung!' : ' leidet unter der Verbrennung!'));
      }
    }
  },

  // --- Besiegte Monster, EP, Wechsel -------------------------------------------
  async resolveFaints() {
    const B = Battle, v = B.v, tr = B.cfg.trainer;
    if (!Mon.alive(B.E())) {
      const E = B.E(), enm = B.nm('e');
      await B.faintAnim('e'); await B.sayWait(enm + ' wurde besiegt!');
      const lastFoe = !B.foes.some(Mon.alive);
      if (lastFoe && Mon.alive(B.P())) Sound.playSong((DB.meta.songs || {}).victory);
      await B.giveExp(E);
      if (lastFoe) {
        if (!G.party.some(Mon.alive)) return await B.lose();
        if (tr) {
          v.eKind = 'trainer'; v.eHud = false; v.eHide = false; v.eSink = 0; v.eScale = 1;
          for (let i = 16; i >= 0; i--) { v.eX = i * 5; await frame(); }
          await B.sayWait('{PLAYER} besiegt ' + (tr.cls ? tr.cls + ' ' : '') + tr.name + '!');
          if (tr.defeat) await B.sayWait(tr.defeat);
          const money = tr.reward | 0; if (money > 0) { Game.addMoney(money); Sound.sfx('buy'); await B.sayWait('{PLAYER} gewinnt $' + money + '!'); }
        }
        await B.evolutions();
        return 'win';
      }
      // Nächstes gegnerisches Monster
      B.ei = B.foes.findIndex(Mon.alive); B.es = B.newSide(); B.part = {}; B.part[B.pi] = true;
      const next = B.E();
      if (Mon.alive(B.P()) && G.party.filter(Mon.alive).length > 1) {
        if (await UI.ask((tr.cls ? tr.cls + ' ' : '') + tr.name + ' setzt als Nächstes ' + Mon.name(next) + ' ein. Monster wechseln?', true)) {
          const to = await Menus.party({ mode: 'battle', cur: B.pi }); if (to >= 0) await B.switchTo(to, true);
        }
      }
      v.eHp = next.hp; v.eSink = 0; v.eHide = false;
      await UI.say((tr.cls ? tr.cls + ' ' : '') + tr.name + ' setzt ' + Mon.name(next) + ' ein!', { keep: true, wait: false });
      await B.appear('e');
    }
    if (!Mon.alive(B.P())) {
      await B.faintAnim('p'); await B.sayWait(B.nm('p') + ' wurde besiegt!');
      if (!G.party.some(Mon.alive)) return await B.lose();
      for (;;) {
        if (B.cfg.kind === 'wild' && !(await UI.ask('Nächstes Monster einsetzen?'))) { const r = await B.tryFlee(false, true); if (r) return r; }
        const to = await Menus.party({ mode: 'battle', cur: B.pi, forced: true });
        if (to >= 0) { await B.switchTo(to, true); break; }
      }
    }
    return null;
  },
  async lose() {
    await Battle.sayWait('{PLAYER} hat kein kampffähiges Monster mehr!');
    await Battle.sayWait('{PLAYER} wird schwarz vor Augen...');
    return 'lose';
  },
  async giveExp(E) {
    const B = Battle, sp = Mon.sp(E), ids = Object.keys(B.part).map(Number).filter(i => Mon.alive(G.party[i]));
    if (!ids.length) return;
    const each = Math.max(1, Math.floor(Math.floor(sp.expYield * E.level / 5 * (B.cfg.trainer ? 1.5 : 1)) / ids.length));
    for (const i of ids) {
      const m = G.party[i]; if (m.level >= MAX_LEVEL) continue;
      await B.sayWait(Mon.name(m) + ' erhält ' + each + ' EP!');
      const ups = Mon.addExp(m, each);
      if (i === B.pi) { if (ups.length) { Sound.sfx('exp'); await B.expAnim(1); B.v.expShow = 0; } await B.expAnim(Mon.expFrac(m)); B.v.pHp = m.hp; }
      for (const up of ups) await B.levelUp(m, up);
      if (ups.length && !B.levelled.includes(m)) B.levelled.push(m);
    }
    B.part = {}; B.part[B.pi] = true;
  },
  async expAnim(to) { const v = Battle.v; while (Math.abs(v.expShow - to) > 0.02) { v.expShow += Math.sign(to - v.expShow) * 0.03; await frame(); } v.expShow = to; },
  async levelUp(m, up) {
    const d = Sound.jingle('j_levelup');
    await UI.say(Mon.name(m) + ' erreicht Level ' + up.level + '!', { keep: true, auto: Math.max(50, d * 60) });
    const l = UI.push({ draw() { Gfx.box(72, 16, 88, 80); ['hp', 'atk', 'def', 'spc', 'spd'].forEach((k, i) => { Gfx.text(STAT_LABEL[k], 80, 24 + i * 12); Gfx.textR('+' + (up.after[k] - up.before[k]), 128, 24 + i * 12, 2); Gfx.textR(up.after[k], 152, 24 + i * 12); }); } });
    await UI.waitPress(false); UI.pop(l);
    for (const mv of up.learn) await Menus.learnMove(m, mv);
  },
  async evolutions() {
    for (const m of Battle.levelled) { if (!Mon.alive(m)) continue; const e = Mon.evolution(m, { kind: 'level' }); if (e) await Menus.evolve(m, e.to); }
    Battle.levelled = [];
  },
  async switchTo(to, silent) {
    const B = Battle, v = B.v;
    if (!silent && Mon.alive(B.P())) { await UI.say(Mon.name(B.P()) + ', komm zurück!', { keep: true, wait: false }); for (let i = 0; i < 4; i++) { v.pScale = 1 - (i + 1) / 4; await wait(3); } }
    B.pi = to; B.ps = B.newSide(); B.part[to] = true; v.pHp = B.P().hp; v.pSink = 0; v.pHide = false; v.expShow = Mon.expFrac(B.P()); B.lastMove = 0;
    await UI.say('Los, ' + Mon.name(B.P()) + '!', { keep: true, wait: false });

  async useItem(act) {
    const B = Battle, m = G.party[act.target], r = Bag.useOnMon(act.item, m);
    await B.say('{PLAYER} setzt ' + act.item.name + ' ein!');
    if (r.ok) { Bag.remove(act.item.id, 1); Sound.sfx('heal_tick'); if (act.target === B.pi) await B.hpAnim('p'); }
    await B.say(r.msg);
  },
  async tryFlee(sure, silentFail) {
    const B = Battle, ps = B.speed('p'), es = Math.max(1, B.speed('e')); B.fleeTries++;
    const chance = sure || ps >= es ? 1 : 0.35 * ps / es + 0.25 + 0.15 * B.fleeTries;
    if (Math.random() < chance) { Sound.sfx('flee'); await B.sayWait('Du bist entkommen!'); return 'flee'; }
    await B.sayWait('Die Flucht ist gescheitert!'); return null;
  },

  // --- Hundeleinen-Fangsystem --------------------------------------------------
  // Fangchance P = Fangrate der Art x Leinenstärke x LP-Faktor x Statusbonus / 255.
  catchChance(E, item) {
    const max = Mon.maxHp(E), power = +item.leash || 1;
    if (power >= 255) return 1;
    const hpF = (3 * max - 2 * E.hp) / (3 * max);                       // volle LP: 1/3, fast besiegt: ~1
    const st = E.status === 'sleep' || E.status === 'freeze' ? 2 : E.status ? 1.5 : 1;
    return U.clamp(Mon.sp(E).catchRate * power * hpF * st / 255, 0, 1);
  },
  async tryCatch(item) {
    const B = Battle, v = B.v, E = B.E();
    Bag.remove(item.id, 1);
    await UI.say('{PLAYER} wirft die ' + item.name + ' aus!', { keep: true, wait: false });
    const P = B.catchChance(E, item), step = Math.pow(P, 1 / 3);
    let tugs = 0; while (tugs < 3 && Math.random() < step) tugs++;
    const caught = tugs === 3;
    // 1) Leine fliegt zum Monster
    const L = v.leash = { t: 0, sag: 0, on: false, wig: 0, broken: 0, strong: (+item.leash || 1) > 1 };
    Sound.sfx('throw');
    for (let i = 1; i <= 18; i++) { L.t = i / 18; L.sag = -Math.sin(Math.PI * L.t) * 22; await frame(); }
    // 2) Karabiner rastet am Halsband ein
    L.on = true; L.sag = 8; Sound.sfx('catch_click'); await wait(22);
    // 3) Das Monster zerrt an der Leine
    for (let n = 0; n < (caught ? 3 : tugs + 1); n++) {
      if (!caught && n === tugs) break;
      Sound.sfx('shake');
      for (let i = 0; i < 24; i++) { const k = Math.sin(i / 24 * Math.PI * 4); v.eX = Math.round(k * 4); L.sag = 1 + Math.abs(k) * 2; L.wig = i; await frame(); }
      v.eX = 0; L.sag = 8; L.wig = 0; await wait(26);
    }
    if (!caught) {
      Sound.sfx('snap'); for (let i = 1; i <= 16; i++) { L.broken = i; v.eX = i < 8 ? (i & 1 ? 3 : -3) : 0; await frame(); }
      v.leash = null; v.eX = 0;
      await B.sayWait(['Mist! Das Monster hat die Leine sofort abgeschüttelt!', 'Oh nein! Es hat sich losgerissen!', 'Argh! Fast hätte es geklappt!'][Math.min(2, tugs)]);
      return null;
    }
    L.sag = 0; L.star = 0; Sound.sfx('catch_click');
    const d = Sound.jingle('j_catch');
    for (let i = 0; i < 40; i++) { L.star = i; await frame(); }
    await UI.say('Geschafft! ' + Mon.name(E) + ' wurde angeleint!', { keep: true, auto: Math.max(70, d * 60) });
    const isNew = !G.caught[E.species];
    if (isNew) { Mon.own(E.species); if (!DB.meta.dexFlag || Game.flag(DB.meta.dexFlag)) await B.sayWait('Die Daten von ' + Mon.sp(E).name + ' wurden im Lexikon gespeichert.'); }
    E.ot = G.name;
    await Menus.nickname(E);
    if (Mon.give(E) === 'storage') await B.sayWait(Mon.name(E) + ' wurde in den Monsterspeicher gebracht.');
    else await B.sayWait(Mon.name(E) + ' gehört jetzt zu deinem Team!');
    v.leash = null;
    return 'caught';
  },

  // --- Animationen -------------------------------------------------------------

  // Zeichnet einen Effekt für ticks Ticks; draw(t) mit t = 0..ticks-1.
  async fx(ticks, draw) { const f = { t: 0, draw: draw }; Battle.v.fx.push(f); for (let i = 0; i < ticks; i++) { f.t = i; await frame(); } const k = Battle.v.fx.indexOf(f); if (k >= 0) Battle.v.fx.splice(k, 1); },

    debuff: async p => { await Battle.fx(22, k => { for (let i = 0; i < 4; i++) { const x = p.x - 15 + i * 10, y = p.y - 18 + ((k * 2 + i * 5) % 30); Gfx.rect(x, y, 1, 7, 3); Gfx.line(x - 3, y + 4, x, y + 7, 3); Gfx.line(x + 3, y + 4, x, y + 7, 3); } }); },
    heal: async p => { await Battle.fx(30, k => { for (let i = 0; i < 6; i++) { const x = p.x - 16 + ((i * 13) % 32), y = p.y + 14 - ((k + i * 6) % 30); if ((k + i) & 2) { Gfx.rect(x, y - 2, 1, 5, 3); Gfx.rect(x - 2, y, 5, 1, 3); } else Gfx.rect(x, y, 1, 1, 3); } }); },
    sleep: async p => { await Battle.fx(36, k => { for (let i = 0; i < 3; i++) { if (k < i * 8) continue; Gfx.text(i === 2 ? 'Z' : 'z', p.x + 6 + i * 7, p.y - 8 - i * 8 - ((k - i * 8) >> 3), 3); } }); },
    status: async p => { await Battle.fx(24, k => { for (let i = 0; i < 4; i++) { const y = p.y - 14 + i * 8; for (let x = -16; x < 16; x += 2) Gfx.rect(p.x + x, y + Math.round(Math.sin((x + k * 2) / 4) * 2), 2, 1, 3); } }); }
  },

  // --- Zeichnen ----------------------------------------------------------------
  hpBar(x, y, hp, max) {
    Gfx.text('LP', x, y - 2, 3); const bx = x + 18;
    Gfx.rect(bx - 1, y, 50, 5, 3); Gfx.rect(bx - 2, y + 1, 52, 3, 3); Gfx.rect(bx, y + 1, 48, 3, 0);
    const w = hp <= 0 ? 0 : Math.max(1, Math.round(48 * hp / Math.max(1, max)));
    Gfx.rect(bx, y + 1, w, 3, hp * 5 <= max ? 3 : 2);
  },
  drawMon(side) {
    const v = Battle.v, m = Battle.mon(side), p = side === 'p', kind = p ? v.pKind : v.eKind;
    if (kind === 'none' || (p ? v.pHide : v.eHide)) return;
    let key, base = 1;
    if (kind === 'trainer') { key = p ? 'tr_hero_back' : ((Battle.cfg.trainer && Battle.cfg.trainer.sprite) || ''); if (!p && !DB.sprites[key]) { const cs = Data.charset(Battle.cfg.trainer && Battle.cfg.trainer.charset); key = cs ? cs.d[0] : '?'; base = 3; } if (p && !DB.sprites[key]) { const cs = Data.charset(DB.meta.playerCharset); key = cs ? cs.u[0] : '?'; base = 3; } }
    else { const sp = Mon.sp(m).sprites; key = p ? sp.back : sp.front; if (p && !DB.sprites[key]) key = sp.front; }
    const c = Gfx.get(key); if (p && base === 1 && c.width <= 32) base = 2;      // kleine Rückansichten werden 2x gezeichnet
    const sc = base * (kind === 'mon' ? (p ? v.pScale : v.eScale) : 1), w = c.width * sc, h = c.height * sc;
    const cx = (p ? 36 : 124) + (p ? v.pX : v.eX) + (v.shake ? ((v.shake & 2) ? 2 : -2) : 0), by = p ? 96 : 50, sink = p ? v.pSink : v.eSink;
    if (sink > 0) { const vis = Math.max(0, c.height - sink / base); Gfx.ctx.drawImage(c, 0, 0, c.width, vis, Math.round(cx - w / 2), Math.round(by - vis * sc), w, vis * sc); }
    else Gfx.ctx.drawImage(c, Math.round(cx - w / 2), Math.round(by - h), Math.round(w), Math.round(h));
  },
  drawLeash() {
    const L = Battle.v.leash; if (!L) return; const hx = 2, hy = 86, nx = 124 + Battle.v.eX, ny = 34;
    const ex = hx + (nx - hx) * L.t, ey = hy + (ny - hy) * L.t, mx = (hx + ex) / 2, my = (hy + ey) / 2 + L.sag + (L.wig ? Math.sin(L.wig) * 2 : 0);
    let px = hx, py = hy; const N = 12;
    for (let i = 1; i <= N; i++) {
      const t = i / N, x = (1 - t) * (1 - t) * hx + 2 * (1 - t) * t * mx + t * t * ex, y = (1 - t) * (1 - t) * hy + 2 * (1 - t) * t * my + t * t * ey;
      if (!(L.broken && i > 4 && i < 9)) { Gfx.line(px, py, x, y, 3); if (L.strong) Gfx.line(px, py + 1, x, y + 1, 2); }
      else if (L.broken < 12) Gfx.rect(x + (i - 6) * L.broken * 0.6, y + L.broken * 1.5, 2, 2, 3);
      px = x; py = y;
    }
    Gfx.rect(hx, hy - 3, 5, 7, 3); Gfx.rect(hx + 1, hy - 2, 3, 5, 0);                  // Handschlaufe
    if (L.on && !L.broken) { Gfx.rect(nx - 9, ny - 1, 18, 4, 3); Gfx.rect(nx - 8, ny, 16, 2, 1); Gfx.rect(ex - 2, ey - 2, 5, 5, 3); Gfx.rect(ex - 1, ey - 1, 3, 3, 0); } // Halsband + Karabiner
    else if (!L.broken) { Gfx.rect(ex - 2, ey - 2, 5, 5, 3); Gfx.rect(ex - 1, ey - 1, 3, 3, 0); }
    if (L.star != null) for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2 + L.star * 0.1, r = 14 + L.star * 0.5; if ((L.star + i) & 4) Battle.star(Math.round(nx + Math.cos(a) * r), Math.round(ny + Math.sin(a) * r * 0.7), 3, 3); }
  },
  draw() {
    const B = Battle, v = B.v; if (!v) { Gfx.clear(0); return; }
    Gfx.clear(0); if (v.shake > 0) v.shake--;
    B.drawMon('e'); B.drawMon('p');
    if (v.eHud) {
      const m = B.E(); Gfx.text(Mon.name(m).substr(0, 10), 8, 2);
      Gfx.text(m.status ? STATUS[m.status].tag : 'Lv' + m.level, 40, 11);
      B.hpBar(8, 22, v.eHp, Mon.maxHp(m)); Gfx.rect(4, 12, 1, 19, 3); Gfx.rect(4, 30, 74, 1, 3); Gfx.rect(76, 28, 2, 2, 3);
    }
    if (v.pHud) {
      const m = B.P(); Gfx.text(Mon.name(m).substr(0, 10), 80, 50);
      Gfx.text(m.status ? STATUS[m.status].tag : 'Lv' + m.level, 112, 59);
      B.hpBar(82, 70, v.pHp, Mon.maxHp(m)); Gfx.textR(U.pad(Math.max(0, v.pHp), 3) + '/' + U.pad(Mon.maxHp(m), 3), 152, 77);
      Gfx.rect(88, 88, 64, 2, 1); Gfx.rect(88, 88, Math.round(64 * U.clamp(v.expShow, 0, 1)), 2, 3);
      Gfx.rect(155, 58, 1, 34, 3); Gfx.rect(78, 92, 78, 1, 3); Gfx.rect(78, 90, 2, 2, 3);
    }
    B.drawLeash();
    for (const f of v.fx) f.draw(f.t);
    Gfx.box(0, 96, 160, 48);
  }
};

    const max = Mon.maxHp(m), w = m.hp <= 0 ? 0 : Math.max(1, Math.round(48 * m.hp / max));

  },
  // o.mode: 'menu' (ansehen/umsortieren) | 'battle' (Wechsel wählen) | 'pick' (Monster auswählen). Liefert Index oder -1.
  async party(o) {
    o = o || {}; const st = { sel: U.clamp(o.cur | 0, 0, Math.max(0, G.party.length - 1)), swap: -1, msg: o.msg || 'Wähle ein Monster.' };
    const layer = UI.push({ draw() { Gfx.clear(0); G.party.forEach((m, i) => Menus.drawMonRow(m, 1 + i * 17, i === st.sel, i === st.swap)); Gfx.box(0, 104, 160, 40); UI.wrap(st.swap >= 0 ? 'Mit welchem Monster tauschen?' : st.msg, 18).slice(0, 2).forEach((l, i) => Gfx.text(l, 8, 113 + i * 12)); } });
    try {
      for (;;) {
        await frame(); const n = G.party.length, old = st.sel; if (!n) return -1;
        if (Input.rep('down')) st.sel = (st.sel + 1) % n; if (Input.rep('up')) st.sel = (st.sel + n - 1) % n;
        if (st.sel !== old) Sound.sfx('select');
        if (Input.hit('b')) { Sound.sfx('cancel'); if (st.swap >= 0) st.swap = -1; else if (!o.forced) return -1; }
        if (!Input.hit('a')) continue;
        Sound.sfx('confirm'); const m = G.party[st.sel];
        if (o.mode === 'pick') return st.sel;
        if (st.swap >= 0) { const a = G.party[st.swap]; G.party[st.swap] = m; G.party[st.sel] = a; st.swap = -1; continue; }
        const opts = o.mode === 'battle' ? ['WECHSEL', 'WERTE', 'ZURÜCK'] : ['WERTE', 'TAUSCH', 'ZURÜCK'];
        const r = await UI.menu({ x: 80, y: 48, w: 80, items: opts });
        const c = r < 0 ? 'ZURÜCK' : opts[r];
        if (c === 'WERTE') await Menus.summary(G.party, st.sel);
        else if (c === 'TAUSCH') { if (n > 1) st.swap = st.sel; }
        else if (c === 'WECHSEL') {
          if (m.hp <= 0) await UI.say(Mon.name(m) + ' kann nicht mehr kämpfen!');
          else if (st.sel === o.cur && !o.forced) await UI.say(Mon.name(m) + ' kämpft bereits!');
          else return st.sel;

      }

  // Werteseite (2 Seiten: Werte / Attacken). list = Monsterliste, i = Startindex; oben/unten blättert.
  async summary(list, i) {

        sp.types.filter(Boolean).forEach((t, k) => Gfx.text(Data.type(t).name.toUpperCase(), 64 + k * 48, 44, 2));

          Gfx.text('EP', 8, 96); Gfx.textR(m.exp, 152, 96);
          Gfx.text('BIS LV' + Math.min(MAX_LEVEL, m.level + 1), 8, 108); Gfx.textR(Mon.expToNext(m), 152, 108);
          Gfx.text('TRAINER', 8, 124); Gfx.textR(m.ot || '?', 152, 124);
        } else {
          m.moves.forEach((mv, k) => { const d = Data.move(mv.id), y = 68 + k * 17; Gfx.text(d.name, 8, y); Gfx.textR('AP' + U.pad(mv.pp, 2) + '/' + U.pad(d.pp, 2), 152, y); Gfx.text(Data.type(d.type).name.toUpperCase().substr(0, 8), 16, y + 8, 2); Gfx.textR(d.cat === 'status' ? 'STATUS' : 'STK' + U.pad(d.power, 3), 152, y + 8, 2); });
        }
        Gfx.text(page ? '◀' : '▶', 144, 50, 2);

  // --- Beutel ------------------------------------------------------------------
  // o.mode: 'field' (benutzen/wegwerfen) | 'battle' (liefert {item, target?} oder null) | 'sell' (liefert item oder null)
  async bag(o) {
    o = o || {}; let sel = 0, cur = null;
    const filter = o.mode === 'battle' ? (it => ['leash', 'heal', 'status', 'revive', 'escape'].includes(it.cat)) : o.mode === 'sell' ? (it => it.cat !== 'key' && it.price > 0) : null;
    const desc = UI.push({ draw() { Gfx.clear(0); Gfx.text(o.mode === 'sell' ? 'VERKAUFEN' : 'BEUTEL', 8, 2); Gfx.textR('$' + G.money, 152, 2); Gfx.box(0, 96, 160, 48); if (!cur) return; UI.wrap(cur.desc || '', 16).slice(0, 3).forEach((l, i) => Gfx.text(l, 8, 106 + i * 10)); if (cur.sprite) Gfx.spr(cur.sprite, 138, 112); } });
    try {
      for (;;) {
        const list = Bag.list(filter);
        if (!list.length) { cur = null; await UI.say(o.mode === 'sell' ? 'Du hast nichts zu verkaufen.' : 'Der Beutel ist leer.'); return null; }
        const items = list.map(e => ({ label: e.item.name, right: e.item.cat === 'key' ? '' : '×' + U.pad(e.n, 2) }));
        sel = Math.min(sel, list.length - 1);
        const r = await UI.menu({ x: 0, y: 12, w: 160, rows: 5, items: items, sel: sel, onSel: i => { cur = list[i].item; } });
        if (r < 0) return null;
        sel = r; const it = list[r].item;
        if (o.mode === 'sell') return it;
        if (o.mode === 'battle') {
          if (Bag.targetsMon(it)) { const t = await Menus.party({ mode: 'pick', msg: it.name + ': Für welches Monster?' }); if (t < 0) continue; return { item: it, target: t }; }
          return { item: it };
        }
        const acts = it.cat === 'key' ? ['BENUTZEN', 'ZURÜCK'] : ['BENUTZEN', 'WEGWERFEN', 'ZURÜCK'];
        const a = await UI.menu({ x: 80, y: 48, w: 80, items: acts });
        if (a < 0 || acts[a] === 'ZURÜCK') continue;
        if (acts[a] === 'WEGWERFEN') {
          const n = await UI.number({ x: 72, y: 72, max: Bag.count(it.id) });
          if (n > 0 && await UI.ask(n + '× ' + it.name + ' wirklich wegwerfen?', true)) { Bag.remove(it.id, n); await UI.say(it.name + ' wurde weggeworfen.'); }
          continue;
        }
        await Menus.useItemField(it);
      }
    } finally { UI.pop(desc); }
  },
  async useItemField(it) {
    const evo = G.party.some(m => Mon.evolution(m, { kind: 'item', item: it.id }));
    if (Bag.targetsMon(it) || evo) {
      if (!G.party.length) { await UI.say('Du hast kein Monster dabei.'); return; }
      const t = await Menus.party({ mode: 'pick', msg: it.name + ': Für welches Monster?' }); if (t < 0) return;
      const m = G.party[t], e = Mon.evolution(m, { kind: 'item', item: it.id });
      if (e) { Bag.remove(it.id, 1); await Menus.evolve(m, e.to); return; }
      if (!Bag.targetsMon(it)) { await UI.say('Das hätte keine Wirkung.'); return; }
      const r = Bag.useOnMon(it, m); if (r.ok) { Bag.remove(it.id, 1); Sound.sfx('heal_tick'); }
      await UI.say(r.msg); return;
    }
    if (it.cat === 'leash') await UI.say('Hundeleinen kannst du nur im Kampf gegen wilde Monster auswerfen.');
    else if (it.cat === 'escape') await UI.say('Das hilft dir nur im Kampf gegen wilde Monster.');
    else await UI.say('{PLAYER} betrachtet ' + it.name + '. Hier lässt sich das nicht benutzen.');
  },
