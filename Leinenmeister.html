  async save() {
    if (!(await UI.ask('Möchtest du das Spiel speichern?'))) return;
    if (Save.write()) { Sound.sfx('save'); await UI.say('{PLAYER} hat das Spiel gespeichert!' + (Game.testMode ? '\n\n(Testmodus: eigener Speicherplatz)' : '')); }
    else await UI.say('Speichern fehlgeschlagen! Der Browser erlaubt keinen Zugriff auf den lokalen Speicher. Nutze den Spielstand-Export im Titelmenü.');
  },
  async options() {
    let sel = 0; const pals = Object.keys(Gfx.PALETTES), touch = ['auto', 'on', 'off'], tl = { auto: 'AUTO', on: 'AN', off: 'AUS' };
    for (;;) {
      const items = ['TEXT   ' + ['LANGSAM', 'MITTEL', 'SCHNELL'][Opt.text], 'TON    ' + (Opt.sound ? 'AN' : 'AUS'), 'MUSIK  ' + (Opt.music ? 'AN' : 'AUS'), 'FARBE  ' + Gfx.PALETTES[Opt.pal].name, 'TOUCH  ' + tl[Opt.touch], 'ZURÜCK'];
      const r = await UI.menu({ x: 0, y: 0, w: 160, items: items, sel: sel, title: 'OPTIONEN' }); if (r < 0 || r === 5) return;
      sel = r;
      if (r === 0) Opt.text = (Opt.text + 1) % 3; else if (r === 1) Opt.sound = !Opt.sound;
      else if (r === 2) { Opt.music = !Opt.music; Sound.applyOptions(); }
      else if (r === 3) { Opt.pal = pals[(pals.indexOf(Opt.pal) + 1) % pals.length]; Gfx.setPalette(Opt.pal); }
      else if (r === 4) { Opt.touch = touch[(touch.indexOf(Opt.touch) + 1) % 3]; Shell.applyTouch(); }
      saveOpt();
    }
  },

  // --- Shop --------------------------------------------------------------------
  async shop(id) {
    const shop = Data.shop(id); if (!shop) { await UI.say('Dieser Laden hat leider geschlossen. (Shop fehlt)'); return; }
    const money = UI.push({ draw() { Gfx.box(96, 0, 64, 24); Gfx.textR('$' + G.money, 152, 8); } });
    try {
      let sel = 0;
      for (;;) {
        UI.tbSet('Was darf es sein?');
        sel = await UI.menu({ x: 0, y: 0, w: 96, items: ['KAUFEN', 'VERKAUFEN', 'TSCHÜSS'], sel: sel });
        if (sel < 0 || sel === 2) break;
        if (sel === 0) {
          const stock = shop.stock.filter(s => Data.idx.items[s.item] && Cond.all(s.cond)).map(s => ({ item: Data.item(s.item), price: s.price != null && s.price !== '' ? s.price | 0 : Data.item(s.item).price | 0 }));
          if (!stock.length) { await UI.say('Zurzeit ist leider alles ausverkauft.'); continue; }
          let bs = 0;
          for (;;) {
            const r = await UI.menu({ x: 0, y: 24, w: 160, rows: 4, items: stock.map(s => ({ label: s.item.name, right: '$' + s.price })), sel: bs, onSel: i => UI.tbSet(stock[i].item.desc || '') });
            if (r < 0) break; bs = r; const s = stock[r], max = Math.min(99 - Bag.count(s.item.id), s.price > 0 ? Math.floor(G.money / s.price) : 99);
            if (Bag.count(s.item.id) >= 99) { await UI.say('Davon kannst du nicht mehr tragen.'); continue; }
            if (max < 1) { await UI.say('Dafür reicht dein Geld leider nicht.'); continue; }
            const n = await UI.number({ x: 72, y: 72, max: max, price: s.price }); if (!n) continue;
            if (!(await UI.ask(n + '× ' + s.item.name + ' für $' + (n * s.price) + '?'))) continue;
            Game.addMoney(-n * s.price); Bag.add(s.item.id, n); Sound.sfx('buy'); await UI.say('Bitte sehr! Vielen Dank!');
          }
        } else {
          for (;;) {
            UI.tbHide(); const it = await Menus.bag({ mode: 'sell' }); if (!it) break;
            const price = Math.floor((it.price | 0) / 2), n = await UI.number({ x: 72, y: 72, max: Bag.count(it.id), price: price }); if (!n) continue;
            if (!(await UI.ask(n + '× ' + it.name + ' für $' + (n * price) + ' verkaufen?'))) continue;
            Bag.remove(it.id, n); Game.addMoney(n * price); Sound.sfx('buy'); await UI.say('Verkauft für $' + (n * price) + '.');
          }
        }
      }
      await UI.say('Vielen Dank! Bis bald!');
    } finally { UI.pop(money); UI.tbHide(); }
  },

  // --- Heilzentrum -------------------------------------------------------------
  async healAnim() {
    let lit = 0, flash = false;
    const l = UI.push({
      draw() {
        const n = G.party.length, w = Math.max(48, n * 20 + 16), x = 80 - (w >> 1); Gfx.box(x, 28, w, 40);
        G.party.forEach((m, i) => { const ix = x + 8 + i * 20; Gfx.spr(Mon.sp(m).sprites.icon, ix, 36); if (i < lit) { Gfx.rect(ix + 7, 56, 3, 7, 3); Gfx.rect(ix + 5, 58, 7, 3, 3); if (flash) Battle.star(ix + 8, 34, 3, 3); } else Gfx.rect(ix + 5, 59, 7, 1, 1); });
      }
    });
    await wait(20);
    for (let i = 1; i <= G.party.length; i++) { lit = i; Sound.sfx('heal_tick'); await wait(18); }
    const d = Sound.jingle('j_heal');
    for (let i = 0; i < Math.max(8, Math.round(d * 60 / 12)); i++) { flash = !flash; await wait(12); }
    Mon.healParty(); UI.pop(l);
  },

  // --- Monsterspeicher ---------------------------------------------------------
  async pickStored(title) {
    if (!G.storage.length) { await UI.say('Der Monsterspeicher ist leer.'); return -1; }
    return UI.menu({ x: 0, y: 0, w: 160, rows: 8, title: title, items: G.storage.map(m => ({ label: Mon.name(m), right: 'Lv' + m.level })) });
  },
  async storage() {
    Sound.sfx('confirm'); let sel = 0;
    const bg = UI.push({ draw() { Gfx.clear(0); Gfx.box(0, 96, 160, 48); Gfx.text('TEAM ' + G.party.length + '/' + PARTY_MAX, 8, 108); Gfx.text('SPEICHER ' + G.storage.length, 8, 124); } });
    try {
      for (;;) {
        sel = await UI.menu({ x: 0, y: 0, w: 160, title: 'MONSTERSPEICHER', items: ['MONSTER ABHOLEN', 'MONSTER EINLAGERN', 'MONSTER TAUSCHEN', 'WERTE ANSEHEN', 'FREILASSEN', 'ABMELDEN'], sel: sel });
        if (sel < 0 || sel === 5) return;
        if (sel === 0) {
          if (G.party.length >= PARTY_MAX) { await UI.say('Dein Team ist voll! Lagere zuerst ein Monster ein.'); continue; }
          const i = await Menus.pickStored('ABHOLEN'); if (i < 0) continue;
          const m = G.storage.splice(i, 1)[0]; G.party.push(m); await UI.say(Mon.name(m) + ' ist jetzt im Team.');
        } else if (sel === 1) {
          if (G.party.length <= 1) { await UI.say('Du brauchst mindestens ein Monster im Team!'); continue; }
          const i = await Menus.party({ mode: 'pick', msg: 'Welches Monster einlagern?' }); if (i < 0) continue;
          if (!G.party.some((m, k) => k !== i && Mon.alive(m))) { await UI.say('Du brauchst ein kampffähiges Monster im Team!'); continue; }
          const m = G.party.splice(i, 1)[0]; Mon.heal(m); G.storage.push(m); await UI.say(Mon.name(m) + ' wurde eingelagert.');
        } else if (sel === 2) {
          if (!G.storage.length) { await UI.say('Der Monsterspeicher ist leer.'); continue; }
          const i = await Menus.party({ mode: 'pick', msg: 'Welches Monster abgeben?' }); if (i < 0) continue;
          const j = await Menus.pickStored('TAUSCHEN GEGEN'); if (j < 0) continue;
          if (!Mon.alive(G.storage[j]) && !G.party.some((m, k) => k !== i && Mon.alive(m))) { await UI.say('Du brauchst ein kampffähiges Monster im Team!'); continue; }
          const a = G.party[i], b = G.storage[j]; Mon.heal(a); G.party[i] = b; G.storage[j] = a;
          await UI.say(Mon.name(a) + ' wurde gegen ' + Mon.name(b) + ' getauscht.');
        } else if (sel === 3) { const j = await Menus.pickStored('WERTE'); if (j >= 0) await Menus.summary(G.storage, j); }
        else if (sel === 4) {
          const j = await Menus.pickStored('FREILASSEN'); if (j < 0) continue;
          if (await UI.ask(Mon.name(G.storage[j]) + ' wirklich freilassen?', true)) { const m = G.storage.splice(j, 1)[0]; await UI.say(Mon.name(m) + ' wurde freigelassen. Mach\'s gut!'); }
        }
      }
    } finally { UI.pop(bg); }
  },

  // --- Spitzname, Attacken lernen, Entwicklung ---------------------------------
  async nickname(m) {
    const sp = Mon.sp(m);
    if (!(await UI.ask('Möchtest du ' + sp.name + ' einen Spitznamen geben?', true))) return;
    const n = await UI.nameEntry({ title: 'SPITZNAME?', max: 10, def: '', icon: sp.sprites.icon });
    m.nick = n && n !== sp.name ? n : '';
  },
  async learnMove(m, id) {
    const mv = Data.move(id), nm = Mon.name(m); if (mv.stub || Mon.knows(m, id)) return;
    if (m.moves.length < 4) { m.moves.push({ id: id, pp: mv.pp }); const d = Sound.jingle('j_item'); await UI.say(nm + ' lernt ' + mv.name + '!', { keep: true, auto: Math.max(50, d * 60) }); return; }
    for (;;) {
      if (await UI.ask(nm + ' will ' + mv.name + ' lernen, kennt aber schon vier Attacken. Eine Attacke vergessen?')) {
        const i = await UI.menu({ x: 32, y: 34, w: 128, h: 62, pitch: 11, rows: 4, title: 'VERGESSEN?', items: m.moves.map(x => Data.move(x.id).name) });
        if (i < 0) continue;
        const old = Data.move(m.moves[i].id).name; m.moves[i] = { id: id, pp: mv.pp };
        await UI.say('1, 2 und... schwupp! ' + nm + ' hat ' + old + ' vergessen...', { keep: true });
        const d = Sound.jingle('j_item'); await UI.say('...und ' + mv.name + ' gelernt!', { keep: true, auto: Math.max(50, d * 60) }); return;
      }
      if (await UI.ask(mv.name + ' wirklich nicht lernen?')) { await UI.say(nm + ' hat ' + mv.name + ' nicht gelernt.', { keep: true }); return; }
    }
  },
  // Entwicklungsszene (B bricht ab). Liefert true, wenn sich das Monster entwickelt hat.
  async evolve(m, to) {
    const from = Mon.sp(m), target = Data.mon(to), nm = Mon.name(m); let show = 'a', sil = false;
    const l = UI.push({ draw() { Gfx.clear(0); const c = Gfx.get((show === 'a' ? from : target).sprites.front, false, sil ? 'sil' : ''); Gfx.ctx.drawImage(c, 80 - (c.width >> 1), 76 - c.height); Gfx.box(0, 96, 160, 48); } });
    const prev = Sound.wantId; Sound.playSong((DB.meta.songs || {}).evolution);
    try {
      await UI.say('Nanu? ' + nm + ' entwickelt sich!', { keep: true, auto: 70 });
      sil = true; let cancelled = false;
      for (let n = 0, gap = 20; gap >= 2 && !cancelled; n++, gap = Math.max(1, gap - 1 - (n >> 3))) {
        show = show === 'a' ? 'b' : 'a'; if (!(n & 3)) Sound.sfx('evolve_flash');
        for (let i = 0; i < gap; i++) { await frame(); if (Input.hit('b')) { cancelled = true; break; } }
        if (n > 46) break;
      }
      if (cancelled) { show = 'a'; sil = false; await UI.say('Hm? Die Entwicklung wurde abgebrochen.', { keep: true }); return false; }
      show = 'b'; Gfx.fade = 3; await wait(6); sil = false; await UI.fadeIn();
      Mon.evolve(m, to); Mon.own(to);
      const d = Sound.jingle('j_badge');
      await UI.say('Glückwunsch! ' + nm + ' wurde zu ' + target.name + '!', { keep: true, auto: Math.max(90, d * 60) });
      for (const mv of Mon.learnsAt(target, m.level)) await Menus.learnMove(m, mv);
      return true;
    } finally { UI.pop(l); UI.tbHide(); Sound.playSong(prev); }
  }
};

// ===== [13] HAUPTPROGRAMM ====================================================
const Title = {
  async run() {
    const songs = DB.meta.songs || {}; Sound.playSong(songs.title);
    let phase = 0; const mon = Data.hasMon(DB.meta.titleMonster) ? Data.mon(DB.meta.titleMonster) : DB.monsters[0];
    const bg = UI.push({
      draw() {
        Gfx.clear(0);
        if (DB.sprites.s_logo) Gfx.spr('s_logo', 80 - (DB.sprites.s_logo.w >> 1), 6); else Gfx.textC((DB.meta.title || 'LEINENMEISTER').toUpperCase(), 80, 16);
        if (mon) { const c = Gfx.get(mon.sprites.front); Gfx.ctx.drawImage(c, 80 - (c.width >> 1), 92 - c.height + (((Engine.ticks >> 5) & 1) ? 1 : 0)); }
        Gfx.rect(0, 94, 160, 1, 3); Gfx.rect(0, 96, 160, 1, 1);
        if (phase === 0) { if ((Engine.ticks >> 5) & 1) Gfx.textC('- A DRÜCKEN -', 80, 108); Gfx.textC('v' + LM_VERSION + '  F2:EDITOR', 80, 132, 2); }
        if (Project.source === 'working' && phase === 0) Gfx.textC('(ARBEITSKOPIE)', 80, 120, 2);
      }
    });
    await wait(10);
    for (;;) { await frame(); if (Input.hit('a') || Input.hit('start')) break; }
    Sound.sfx('confirm'); phase = 1; let sel = 0;
    for (;;) {
      const has = Save.exists(), items = (has ? ['FORTSETZEN'] : []).concat(['NEUES SPIEL', 'SPIELSTAND', 'OPTIONEN']);
      const r = await UI.menu({ x: 24, y: 90, w: 112, h: 54, pitch: 10, rows: 4, items: items, sel: Math.min(sel, items.length - 1), cancel: false });
      sel = r; const c = items[r];
      if (c === 'FORTSETZEN') {
        let s = null; try { s = Save.read(); } catch (e) { await UI.say('Der Spielstand ist beschädigt: ' + e.message); continue; }
        if (!s) { await UI.say('Kein Spielstand gefunden.'); continue; }
        await UI.fadeOut(); UI.pop(bg); Engine.startGame(s); await wait(4); await UI.fadeIn(); return;
      }
      if (c === 'NEUES SPIEL') {
        if (has && !(await UI.ask('Es gibt bereits einen Spielstand. Trotzdem ein neues Spiel beginnen?', true))) continue;
        await UI.fadeOut(); UI.pop(bg); await Title.newGame(); return;
      }
      if (c === 'OPTIONEN') { await Menus.options(); continue; }
      const o = ['EXPORTIEREN', 'IMPORTIEREN', 'LÖSCHEN', 'ZURÜCK'], k = await UI.menu({ x: 40, y: 48, w: 112, items: o });
      if (k === 0) { if (!has) await UI.say('Es gibt keinen Spielstand.'); else { try { G = Save.read(); Project.download(Project.fileBase() + '.spielstand.json', JSON.stringify(G), 'application/json'); await UI.say('Der Spielstand wurde als Datei exportiert.'); } catch (e) { await UI.say('Export fehlgeschlagen: ' + e.message); } } }
      else if (k === 1) {
        await UI.say('Wähle im Dateidialog eine Spielstand-Datei aus.', { keep: true, wait: false });
        const f = await Save.pickFile('.json'); UI.tbHide();
        if (f) { try { Save.importText(f.text); Sound.sfx('save'); await UI.say('Der Spielstand wurde importiert.'); } catch (e) { await UI.say('Import fehlgeschlagen: ' + e.message); } }
      } else if (k === 2) { if (has && await UI.ask('Spielstand wirklich unwiderruflich löschen?', true)) { Save.del(); await UI.say('Der Spielstand wurde gelöscht.'); } }
    }
  },
  // Neues Spiel: Begrüssung, Namenseingabe, Start im Schlafzimmer.
  async newGame() {
    G = Game.fresh(); const m = DB.meta;
    const bg = UI.push({ draw() { Gfx.clear(0); if (DB.sprites.tr_prof) Gfx.spr('tr_prof', 60, 28); } });
    await wait(4); await UI.fadeIn();
    if (m.intro) await UI.say(m.intro);
    for (;;) {
      await UI.say('Verrate mir bitte deinen Namen!');
      G.name = await UI.nameEntry({ title: 'DEIN NAME?', max: 8, def: m.defaultName });
      if (await UI.ask('Du heisst also ' + G.name + '?')) break;
    }
    if (m.defaultRival) {
      if (await UI.ask('Dein Rivale heisst ' + m.defaultRival + '. Möchtest du ihm einen anderen Namen geben?', true)) G.rival = await UI.nameEntry({ title: 'NAME DES RIVALEN?', max: 8, def: m.defaultRival });
      else G.rival = m.defaultRival;
    }
    await UI.say(m.outro || '{PLAYER}! Dein grosses Abenteuer beginnt jetzt!');
    await UI.fadeOut(); UI.pop(bg);
    Engine.startGame(G); await wait(8); await UI.fadeIn();
    World.run(() => World.autoEvents());
  }
};

const Engine = {
  ticks: 0, waiters: [], editorOpen: false, manual: false, acc: 0, last: 0, gen: 0,
  boot() {
    Shell.init(); Project.boot(); Gfx.init(Shell.canvas); Input.init();
    if (Project.error) { const d = document.createElement('div'); d.style.cssText = 'position:fixed;left:8px;right:8px;top:8px;background:#7a1f2b;color:#fff;padding:10px;border-radius:6px;font:14px system-ui;z-index:99'; d.textContent = Project.error; document.body.appendChild(d); }
    window.addEventListener('error', e => console.error('Leinenmeister:', e.message));
    requestAnimationFrame(Engine.raf);
    Engine.toTitle();
  },
  raf(ts) {
    requestAnimationFrame(Engine.raf);
    if (Engine.manual || Engine.editorOpen) { Engine.last = ts; return; }
    let dt = ts - (Engine.last || ts); Engine.last = ts; if (dt > 100) dt = 100;
    Engine.acc += dt; if (Engine.acc < 16) return;                 // höchstens 60 Ticks pro Sekunde
    Engine.acc = U.clamp(Engine.acc - 16.667, 0, 16.667);
    Engine.tick();
  },
  // Ein Spieltick: Eingaben einlesen, wartende Abläufe fortsetzen, Welt aktualisieren, zeichnen.
  tick() {
    Engine.ticks++; Input.poll();
    const w = Engine.waiters; Engine.waiters = []; for (const r of w) r();
    try {
      if (World.active && G && !Battle.active) World.update();
      Engine.draw();
    } catch (e) { console.error('Leinenmeister: Fehler im Spieltick', e); }
  },
  draw() {
    if (Battle.active) Battle.draw(); else if (World.active && G) World.draw(); else Gfx.clear(0);
    UI.draw(); Gfx.present();
  },
  // Bricht alle laufenden Abläufe ab (wartende async-Funktionen werden nie fortgesetzt).
  reset() { Engine.waiters = []; Engine.gen++; UI.reset(); UI.tb.lines = ['', '']; World.active = false; World.lock = 0; Battle.active = false; Battle.v = null; Input.clear(); },
  toTitle() { Engine.reset(); Game.testMode = false; G = null; Title.run(); },
  startGame(state) { G = state; World.start(); },
  toggleEditor() { if (typeof Editor === 'undefined') return; if (Engine.editorOpen) Editor.close(); else Editor.open(); },
  // Nach Änderungen im Editor: Caches verwerfen und sauber neu starten.
  reloadData() { Data.reindex(); Gfx.invalidate(); Sound.invalidate(); World.dirtyTiles(); },
  // Testspiel aus dem Editor. o: {map, x, y} (optional; sonst Spielstart). Eigener Speicherplatz, Testteam.
  startTest(o) {
    Engine.reloadData(); Engine.reset(); Game.testMode = true; G = Game.fresh();
    if (o && o.map && Data.map(o.map)) {
      G.map = o.map; G.x = o.x | 0; G.y = o.y | 0;
      if (DB.meta.dexFlag) G.flags[DB.meta.dexFlag] = true;
      const team = (DB.meta.testTeam && DB.meta.testTeam.length ? DB.meta.testTeam : DB.monsters.slice(0, 1).map(s => ({ species: s.id, level: 12 })));
      for (const t of team) if (Data.hasMon(t.species)) Mon.give(Mon.create(t.species, t.level || 10));
      const leash = DB.items.find(i => i.cat === 'leash'), heal = DB.items.find(i => i.cat === 'heal');
      if (leash) Bag.add(leash.id, 10); if (heal) Bag.add(heal.id, 5);
    }
    World.start(); Gfx.fade = 0;
    if (!(o && o.map)) World.run(() => World.autoEvents());
  }
};

// Testschnittstelle für automatisierte Tests (Playwright o.ä.) und zum Debuggen in der Konsole.
const LMDebug = {
  _chan: null, _q: [],
  yield() { // Makrotask-Pause, damit alle Promise-Fortsetzungen laufen
    if (!LMDebug._chan) { LMDebug._chan = new MessageChannel(); LMDebug._chan.port1.onmessage = () => { const r = LMDebug._q.shift(); if (r) r(); }; }
    return new Promise(res => { LMDebug._q.push(res); LMDebug._chan.port2.postMessage(0); });
  },
  // Führt n Ticks so schnell wie möglich aus (Engine.manual sollte true sein).
  async ff(n) { for (let i = 0; i < n; i++) { Engine.tick(); await LMDebug.yield(); } },
  // Drückt eine Taste für einen Tick und spult danach n Ticks vor.
  async press(k, n) { Input.pend[k] = true; await LMDebug.ff(n == null ? 2 : n); },
  // Tickt, bis cond() wahr ist (max. Ticks); drückt dabei optional wiederholt eine Taste.
  async until(cond, max, key) { for (let i = 0; i < (max || 2000); i++) { if (cond()) return true; if (key && i % 4 === 0) Input.pend[key] = true; Engine.tick(); await LMDebug.yield(); } return !!cond(); },
  // Läuft Schritt für Schritt (U/D/L/R); bricht ab, sobald ein Script startet.
  async walk(path) {
    const M = { U: 'up', D: 'down', L: 'left', R: 'right' };
    for (const c of path) {
      const d = M[c]; if (!d) continue; if (World.lock) return false;
      World.p.dir = d; World.p.walked = true; Input.set(d, true); await LMDebug.ff(1); Input.set(d, false);
      await LMDebug.until(() => !World.p.moving, 80);
    }
    return true;
  },
  screenText() { return UI.tb.lines.join(' | '); }
};
