<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Leinenmeister</title>
</head>
<body>
<script id="lm-engine">
/* ============================================================================
   LEINENMEISTER – Retro-Monster-RPG mit integriertem Spieleeditor
   Engine-Version: 1.0.0   |   Datenformat (Projekt): 1   |   Spielstandformat: 1
   ============================================================================

   Diese Datei ist ZUGLEICH Spiel, Engine, Editor und Projektdatei. Sie besteht
   aus genau zwei Script-Elementen:

     1. Script-Element  id="lm-engine"  -> der gesamte Programmcode (dieser Text).
        CSS und HTML-Gerüst werden zur Laufzeit per JavaScript erzeugt.
     2. Script-Element  id="lm-data" type="application/json"
        -> ALLE Spielinhalte als ein versioniertes JSON-Objekt ("Projekt" / DB).

   Der HTML-Export des Editors baut aus (1) unverändert + (2) neu serialisiert
   eine neue, eigenständige HTML-Datei (Funktion LM_buildHTML). Dadurch ist jede
   exportierte Datei wieder voll editier- und exportierbar.

   ----------------------------------------------------------------------------
   1. SOFTWAREARCHITEKTUR (Abschnitte in dieser Reihenfolge im Code)
   ----------------------------------------------------------------------------
   Jeder Abschnitt beginnt mit einer Banner-Zeile  "// ===== [NN] NAME =====".

   [01] KERN          Konstanten, Hilfsfunktionen (U), LM_buildHTML (Export-Vorlage)
   [02] DATENBANK     Data  : lädt/migriert/indiziert das Projekt (globale Variable DB)
                      Project: Arbeitskopie (localStorage), JSON-/HTML-Export, Download
   [03] RENDERING     Gfx   : 160x144-Canvas, 4-Farben-Paletten, Sprite-Cache,
                              Bitmap-Font, Textrahmen, Paletten-Blenden
   [04] SOUND         Sound : WebAudio-Synthesizer (Rechteck/Dreieck/Rauschen),
                              Musik-Sequencer und Soundeffekte aus DB.songs / DB.sfx
   [05] EINGABE       Input : Tastatur + Touch (virtuelles Steuerkreuz), Shell (DOM/CSS)
   [06] SPIELSTAND    Game  : Laufzeitzustand G (Spieler, Team, Beutel, Flags ...)
                      Save  : Speichern/Laden/Export/Import/Migration (localStorage)
   [07] MONSTER       Mon   : Instanzen, Werteformeln, EP/Level, Lernen, Entwicklung
                      Bag   : Inventar und Gegenstandswirkungen
   [08] UI            frame()/wait(), UI: Textbox, Menüs, Ja/Nein, Mengenwahl, Namenseingabe
   [09] EREIGNISSE    Cond  : Bedingungs-Registry     (Cond.defs)
                      Act   : Aktions-Registry        (Act.defs)
                      Script: Interpreter für Aktionslisten
                      Quests, Gyms (Arena-System), Trainers
   [10] WELT          World : Karten, Ebenen, Kollision, Kartenübergänge, NPCs,
                              Ereignisse, Trainer-Sichtlinien, Zufallsbegegnungen
   [11] KAMPF         Battle: rundenbasierter Kampf, Schaden, Status, KI,
                              Fangsystem (Hundeleinen), Animationen, EP, Entwicklung
   [12] MENÜS         Menus : Hauptmenü, Team, Beutel, Lexikon, Trainerpass, Medaillen,
                              Optionen; Shop, Heilzentrum, Monsterspeicher
   [13] HAUPTPROGRAMM Title (Titelbild, Neues Spiel), Engine (Spielschleife, Boot),
                      LMDebug (Testschnittstelle für automatisierte Tests)
   [20] EDITOR        Editor: visueller Spieleeditor (moderne DOM-Oberfläche),
                              Karten-, NPC-, Monster-, Pixel-, Attacken-, Trainer-,
                              Begegnungs-, Gegenstands-, Shop-, Arena-, Ereignis- und
                              Questeditor, Validierung, Projekt-Import/-Export

   ABLAUFMODELL: Die Spielschleife (Engine.tick, 60 Hz) ruft World.update() und
   zeichnet World/Battle + UI.layers. Längere Abläufe (Dialoge, Kämpfe, Menüs,
   Ereignisse) sind async-Funktionen, die mit "await frame()" auf den nächsten
   Tick warten. Dadurch ist Ablauf-Code linear lesbar:
       await UI.say('Hallo!');  if (await UI.ask('Kämpfen?')) await Battle.start(...)
   Während ein Script läuft, ist World.lock > 0 (Spieler nicht steuerbar).

   ----------------------------------------------------------------------------
   2. SPIELDATENSTRUKTUR (Projekt-JSON, globale Variable DB)
   ----------------------------------------------------------------------------
   Alle Inhalte haben stabile String-IDs (Ausnahme: Tiles haben stabile Zahlen-IDs,
   weil Karten sie millionenfach referenzieren). IDs niemals nachträglich ändern.

   DB = {
     format: "leinenmeister-project", version: 1,
     meta: { id, title, author, revision, savedAt,          // Projektidentität
             startMap, startX, startY, startDir, startMoney, // Spielstart
             playerCharset, defaultName, defaultRival,
             dexFlag,            // Flag, ab dem das Lexikon im Menü erscheint ("" = immer)
             whiteoutLoss,       // Geldverlust bei Niederlage (0..1)
             titleMonster, intro, outro, // Titelbild-Monster, Begrüssungstexte
             songs:{title,wild,trainer,leader,victory,evolution}, // Standard-Musikstücke
             testTeam:[{species,level}]  // Team für "Karte testen" im Editor
           },
     types:     [ { id, name, immune:[statusIds]?, thaws? } ],   // immune: z.B. Feuer gegen "burn"
     typeChart: { <angreiferTyp>: { <verteidigerTyp>: faktor } },  // fehlend = 1
     sprites:   { <key>: { w, h, px: [zeilen] } },   // '.'=transparent, '0'..'3' = hell..dunkel
     font:      { glyphs: { <zeichen>: "16 Hex-Ziffern (8 Zeilen à 8 Bit)" } },
     tiles:     [ { id:Zahl, name, sprite, frames:[keys]?, solid, kind } ],
                  // kind: "" | "grass" (Begegnungen) | "water" | "ledge" (Sprungkante)
                  //       | "counter" (Ansprechen über Tresen hinweg)
     prefabs:   [ { id, name, w, h, ground:[], deco:[], objects:[] } ], // Bauvorlagen (0 = unverändert)
     charsets:  [ { id, name, d:[k0,k1], u:[k0,k1], s:[k0,k1] } ],     // s = Blick nach links
     moves:     [ { id, name, type, cat:"phys|spec|status", power, acc, pp, prio,
                    target:"enemy|self", effects:[...], anim, sfx, desc } ],
                  // effects: {k:"status",status,chance,target} {k:"stat",stat,stages,chance,target}
                  //          {k:"confuse",chance} {k:"flinch",chance} {k:"heal",pct}
                  //          {k:"drain",pct} {k:"recoil",pct} {k:"crit"}
     monsters:  [ { id, no, name, kind, types:[t1,t2?], base:{hp,atk,def,spc,spd},
                    catchRate(1-255), expYield, growth:"fast|medium|slow",
                    learnset:[{level,move}], evolutions:[{to,kind:"level|item",level,item}],
                    sprites:{front,back,icon}, desc } ],
     items:     [ { id, name, cat:"leash|heal|status|revive|escape|key|misc", price, desc,
                    sprite, leash (Fangstärke; >=255 = garantiert), heal (LP; 9999 = voll),
                    cures:[statusIds]|"all", revive (Prozent LP), evoItem? } ],
     trainers:  [ { id, name, cls, charset, sprite, team:[{species,level,moves?}],
                    reward, intro, defeat, after, sight, repeatable, cond:[...],
                    ai:"smart|random", song, items:[{item,n}] } ],
     shops:     [ { id, name, stock:[{item, price?, cond?:[...]}] } ],
     gyms:      [ { id, name, map, leader, trainers:[ids], badge:{name,sprite},
                    entryCond:[...], entryDenied, needTrainers, leaderDenied,
                    rewards:[Aktionen], winText } ],
     quests:    [ { id, name, desc, rewards:[Aktionen] } ],
     maps:      [ { id, name, w, h, kind:"outdoor|indoor|cave", song, border,
                    layers:{ ground:[], deco:[], objects:[],      // Tile-IDs, zeilenweise
                             collision:[],   // 0=automatisch (aus Tiles), 1=frei, 2=blockiert
                             encounter:[] }, // 0=automatisch (hohes Gras=Zone 1), 1-8=Zone, 9=keine
                    connections:{ north|south|west|east: {map, offset} }, // nahtlose Ränder
                    npcs:   [ { id, name, x, y, charset, dir, move:"none|turn|wander|pace_h|pace_v",
                                range, trainer, visibleIf:[...], pages:[{if:[...], do:[...]}] } ],
                    events: [ { id, name, x, y, trigger:"interact|step|enter", sprite, solid,
                                once, visibleIf:[...], pages:[{if:[...], do:[...]}] } ],
                    warps:  [ { id, x, y, kind:"step|push", dir, toMap, toX, toY, toDir,
                                cond:[...], denied } ],
                    encounters:[ { zone, name, rate, slots:[{species,min,max,weight,cond?}] } ] } ],
     songs:     [ { id, name, bpm, loop, tracks:[{wave, vol, seq}] } ],
     sfx:       [ { id, name, steps:[{w,f,f2?,d,v}] } ]
   }

   BEDINGUNGEN  { k:<art>, ...felder, not? }   – siehe Cond.defs  (z.B. {k:"hasBadge",gym:"gym1"})
   AKTIONEN     { k:<art>, ...felder }         – siehe Act.defs   (z.B. {k:"say",text:"Hallo"})
   Beide Registries enthalten je Eintrag "label" und "fields"; der Editor erzeugt
   daraus automatisch die Formulare. Es gibt bewusst KEINE frei ausführbaren Codefelder.

   SPIELSTAND G (getrennt vom Projekt, localStorage-Schlüssel leinenmeister.save.<projektId>):
     { format:"leinenmeister-save", version, projectId, name, rival, map, x, y, dir,
       money, time, steps, party:[monster], storage:[monster], bag:{itemId:anzahl},
       seen:{}, caught:{}, flags:{}, vars:{}, defeated:{trainerId:true}, badges:[gymId],
       quests:{id:"active|done"}, respawn:{map,x,y,dir}, npcState:{}, tiles:{} }
     Monster-Instanz: { uid, species, nick, level, exp, hp, status, sleep, iv:{...},
                        moves:[{id,pp}], ot }

   ----------------------------------------------------------------------------
   3. NEUE FUNKTIONEN HINZUFÜGEN
   ----------------------------------------------------------------------------
   - Neue Inhalte (Karten, Monster, Attacken, Trainer, Arenen ...) NUR über Daten
     bzw. den Editor – die Engine referenziert keine konkreten Inhalte per ID.
   - Neue Ereignis-Aktion:   Eintrag in Act.defs  { label, fields, run: async (a, ctx) => {} }
   - Neue Bedingung:         Eintrag in Cond.defs { label, fields, test: (c) => bool }
   - Neuer Attacken-Effekt:  Battle.applyEffect erweitern + EFFECT_KINDS (Editor-Liste)
   - Neue Kampfanimation:    Eintrag in Battle.ANIMS
   - Neuer Tile-Typ (z.B. Surfen): Tile.kind ergänzen (TILE_KINDS) + World.passable/afterStep
   - Neuer Gegenstandstyp:   ITEM_CATS + Bag.useOnMon / Battle.useItem
   - Neue Menüseite:         Funktion in Menus + Eintrag in Menus.main
   - Neues Feld in einer Datentabelle: Standardwert in Data.migrate setzen, Feld im
     passenden Editor-Schema (Editor.SCHEMAS) ergänzen, hier dokumentieren.

   ----------------------------------------------------------------------------
   4. EDITOR ERWEITERN
   ----------------------------------------------------------------------------
   Der Editor ist schema-getrieben: Editor.SCHEMAS beschreibt je Datentabelle die
   Formularfelder  { k, label, t, ... }  mit Feldtypen
     text | area | int | num | bool | select (opts) | ref (Tabelle) | sprite | types |
     list (of: Felder) | conds | actions | lines
   Ein neues Feld = eine Zeile im Schema. Bedingungen/Aktionen kommen automatisch
   aus Cond.defs/Act.defs. Neue Editor-Seite: Eintrag in Editor.PAGES.

   ----------------------------------------------------------------------------
   5. MIGRATION
   ----------------------------------------------------------------------------
   - Projekt: DB.version < DATA_VERSION -> Data.migrate() wendet DATA_MIGRATIONS[v]
     der Reihe nach an (jede Funktion hebt die Daten von Version v auf v+1).
   - Spielstand: Save.migrate() analog über SAVE_MIGRATIONS. Save.sanitize() entfernt
     Verweise auf gelöschte Inhalte (Monsterarten, Karten, Items), damit alte
     Spielstände nach Projektänderungen nicht abstürzen.
   - Bei Formatänderungen: DATA_VERSION/SAVE_VERSION erhöhen, Migration ergänzen,
     Änderungsprotokoll fortschreiben.

   ----------------------------------------------------------------------------
   6. BEKANNTE TECHNISCHE EINSCHRÄNKUNGEN
   ----------------------------------------------------------------------------
   - Ein Speicherplatz pro Projekt (zusätzlich Datei-Export/-Import).
   - localStorage ist auf ca. 5 MB begrenzt (Arbeitskopie + Sicherungen des Editors);
     für dauerhafte Sicherung immer JSON- oder HTML-Export verwenden.
   - Nahtlose Kartenränder zeigen nur die Tiles der Nachbarkarte (keine NPCs).
   - Ton startet erst nach der ersten Eingabe (Browser-Richtlinie).
   - Die Spielschleife ist an requestAnimationFrame gebunden (max. 60 Ticks/s).
   - Im Code dürfen die Zeichenfolgen für schliessende Script-Tags und HTML-Kommentar-
     Anfänge nicht wörtlich vorkommen (sonst bricht die Einbettung) – stets zusammensetzen.

   ----------------------------------------------------------------------------
   7. ÄNDERUNGSPROTOKOLL
   ----------------------------------------------------------------------------
   1.0.0  Erste Version: Engine, Startgebiet (Welpenhain, Route 1, Bellstadt, Arena,
          Route 2), 14 Monster, Hundeleinen-Fangsystem, Editor, HTML-Export.
   ============================================================================ */
'use strict';

// ===== [01] KERN: Export-Vorlage =============================================
// Baut die vollständige HTML-Datei aus Programmcode + Projekt-JSON. Wird vom
// HTML-Export des Editors UND vom ursprünglichen Build identisch verwendet.
function LM_buildHTML(code, json, title) {
  const t = String(title || 'Leinenmeister').replace(/[<>&"]/g, '');
  const safe = String(json).replace(/</g, '\\u003c');   // JSON darf kein "<" enthalten
  const S = 'script';
  return '<!DOCTYPE html>\n<html lang="de">\n<head>\n<meta charset="utf-8">\n' +
    '<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">\n' +
    '<title>' + t + '</title>\n</head>\n<body>\n' +
    '<' + S + ' id="lm-engine">' + code + '</' + S + '>\n' +
    '<' + S + ' id="lm-data" type="application/json">' + safe + '</' + S + '>\n' +
    '</body>\n</html>\n';
}

// ===== [01] KERN: Konstanten & Hilfsfunktionen ===============================
const LM_VERSION = '1.0.0';
const DATA_VERSION = 1;      // Version des Projekt-Datenformats (DB.version)
const SAVE_VERSION = 1;      // Version des Spielstandformats (G.version)
const SCREEN_W = 160, SCREEN_H = 144, TILE = 16;
const DIRS = { down: { x: 0, y: 1 }, up: { x: 0, y: -1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } };
const DIR_LIST = ['down', 'up', 'left', 'right'];
const OPP = { down: 'up', up: 'down', left: 'right', right: 'left' };
const DIR_LABEL = { down: 'unten', up: 'oben', left: 'links', right: 'rechts' };
const LS = 'leinenmeister.';
const TABLES = ['types', 'tiles', 'prefabs', 'charsets', 'moves', 'monsters', 'items', 'trainers', 'shops', 'gyms', 'quests', 'maps', 'songs', 'sfx'];
const STATS = ['hp', 'atk', 'def', 'spc', 'spd'];
const STAT_LABEL = { hp: 'LP', atk: 'ANGR', def: 'VERT', spc: 'SPEZ', spd: 'INIT' };
const STAT_NAME = { atk: 'Angriff', def: 'Verteidigung', spc: 'Spezial', spd: 'Initiative', acc: 'Genauigkeit', eva: 'Fluchtwert' };
const STATUS = {
  poison: { name: 'Gift', tag: 'GIF' }, burn: { name: 'Brand', tag: 'BRT' }, para: { name: 'Paralyse', tag: 'PAR' },
  sleep: { name: 'Schlaf', tag: 'SLF' }, freeze: { name: 'Frost', tag: 'EIS' }
};
const ITEM_CATS = { leash: 'Hundeleine', heal: 'Heilung', status: 'Statusheilung', revive: 'Beleber', escape: 'Fluchtitem', key: 'Schlüsselitem', misc: 'Sonstiges' };
const TILE_KINDS = { '': 'Normal', grass: 'Hohes Gras', water: 'Wasser', ledge: 'Sprungkante', counter: 'Tresen', stairs: 'Treppe' };
const EFFECT_KINDS = { status: 'Status zufügen', stat: 'Wert verändern', confuse: 'Verwirren', flinch: 'Zurückschrecken', heal: 'Selbstheilung (%)', drain: 'LP absaugen (%)', recoil: 'Rückstoss (%)', crit: 'Hohe Volltrefferquote' };
const GROWTH = { fast: 0.8, medium: 1, slow: 1.25 };
const MAX_LEVEL = 100, PARTY_MAX = 6;

const U = {
  clamp(v, a, b) { return v < a ? a : v > b ? b : v; },
  rnd() { return Math.random(); },
  randInt(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); },
  pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; },
  clone(o) { return JSON.parse(JSON.stringify(o)); },
  pad(v, n, ch) { let s = String(v); while (s.length < n) s = (ch || ' ') + s; return s; },
  padR(v, n) { let s = String(v); while (s.length < n) s += ' '; return s; },
  esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); },
  weighted(list, wf) { // gewichtete Zufallsauswahl
    let sum = 0; for (const e of list) sum += Math.max(0, wf(e));
    if (sum <= 0) return list[0] || null;
    let r = Math.random() * sum;
    for (const e of list) { r -= Math.max(0, wf(e)); if (r < 0) return e; }
    return list[list.length - 1];
  },
  lines(t) { return Array.isArray(t) ? t.join('\n\n') : String(t == null ? '' : t); }
};

// localStorage-Zugriff, der niemals Ausnahmen wirft (z.B. privater Modus, Quota).
const Store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* egal */ } },
  getJSON(k) { const s = Store.get(k); if (!s) return null; try { return JSON.parse(s); } catch (e) { return null; } },
  setJSON(k, o) { return Store.set(k, JSON.stringify(o)); }
};

// ===== [02] DATENBANK ========================================================
let DB = null;   // das geladene Projekt (siehe Kopfkommentar, Abschnitt 2)

// Migrationen des Projektformats: DATA_MIGRATIONS[v] hebt Daten von Version v auf v+1.
const DATA_MIGRATIONS = {};

const Data = {
  idx: {},
  init(db) { DB = Data.migrate(db); Data.reindex(); },

  // Ergänzt fehlende Felder mit Standardwerten, damit die Engine nie auf undefined läuft.
  migrate(db) {
    if (!db || typeof db !== 'object') db = {};
    if (!db.version) db.version = 1;
    while (db.version < DATA_VERSION && DATA_MIGRATIONS[db.version]) { DATA_MIGRATIONS[db.version](db); db.version++; }
    db.format = 'leinenmeister-project';
    db.meta = Object.assign({ id: 'projekt', title: 'Leinenmeister', author: '', revision: 0, savedAt: 0, startMap: '', startX: 1, startY: 1, startDir: 'down', startMoney: 3000, playerCharset: 'hero', defaultName: 'LEO', defaultRival: 'RICO', dexFlag: '', whiteoutLoss: 0.25, titleMonster: '', intro: '', outro: '', testTeam: [] }, db.meta || {});
    db.meta.songs = Object.assign({ title: 'title', wild: 'kampf_wild', trainer: 'kampf_trainer', leader: 'kampf_leiter', victory: 'sieg', evolution: 'evolution' }, db.meta.songs || {});
    for (const t of TABLES) if (!Array.isArray(db[t])) db[t] = [];
    db.sprites = db.sprites || {}; db.typeChart = db.typeChart || {};
    db.font = db.font || { glyphs: {} };
    for (const m of db.monsters) {
      m.types = m.types || ['normal']; m.base = Object.assign({ hp: 40, atk: 40, def: 40, spc: 40, spd: 40 }, m.base);
      m.learnset = m.learnset || []; m.evolutions = m.evolutions || []; m.sprites = m.sprites || {};
      if (!m.growth) m.growth = 'medium'; if (!m.catchRate) m.catchRate = 100; if (!m.expYield) m.expYield = 50;
    }
    for (const m of db.moves) { m.effects = m.effects || []; if (!m.cat) m.cat = 'phys'; if (m.acc == null) m.acc = 100; if (!m.pp) m.pp = 20; if (!m.target) m.target = 'enemy'; m.prio = m.prio || 0; m.power = m.power || 0; }
    for (const t of db.trainers) { t.team = t.team || []; t.cond = t.cond || []; if (t.sight == null) t.sight = 3; }
    for (const s of db.shops) s.stock = s.stock || [];
    for (const g of db.gyms) { g.trainers = g.trainers || []; g.entryCond = g.entryCond || []; g.rewards = g.rewards || []; g.badge = g.badge || { name: 'Medaille', sprite: '' }; }
    for (const q of db.quests) q.rewards = q.rewards || [];
    for (const m of db.maps) Data.fixMap(m);
    return db;
  },
  fixMap(m) {
    m.w = Math.max(1, m.w | 0); m.h = Math.max(1, m.h | 0);
    m.layers = m.layers || {};
    for (const l of ['ground', 'deco', 'objects', 'collision', 'encounter']) {
      let a = m.layers[l]; if (!Array.isArray(a)) a = [];
      if (a.length !== m.w * m.h) { const b = new Array(m.w * m.h).fill(0); for (let i = 0; i < Math.min(a.length, b.length); i++) b[i] = a[i] | 0; a = b; }
      m.layers[l] = a;
    }
    m.connections = m.connections || {};
    m.npcs = m.npcs || []; m.events = m.events || []; m.warps = m.warps || []; m.encounters = m.encounters || [];
    for (const n of m.npcs) { n.pages = n.pages || []; n.visibleIf = n.visibleIf || []; n.dir = n.dir || 'down'; n.move = n.move || 'none'; }
    for (const e of m.events) { e.pages = e.pages || []; e.visibleIf = e.visibleIf || []; e.trigger = e.trigger || 'interact'; }
    for (const w of m.warps) { w.kind = w.kind || 'step'; w.cond = w.cond || []; }
    for (const e of m.encounters) e.slots = e.slots || [];
    if (!m.kind) m.kind = 'outdoor';
    return m;
  },
  reindex() {
    Data.idx = {};
    for (const t of TABLES) { const m = Data.idx[t] = {}; for (const e of DB[t]) if (e && e.id != null && !(e.id in m)) m[e.id] = e; }
  },
  // --- Zugriffe mit Ersatzobjekten, damit fehlerhafte Verweise nicht abstürzen ---
  mon(id) { return Data.idx.monsters[id] || Data.stubMon(id); },
  hasMon(id) { return !!Data.idx.monsters[id]; },
  stubMon(id) { return { id: id, no: 0, name: '???', kind: '???', types: [DB.types[0] ? DB.types[0].id : 'normal'], base: { hp: 40, atk: 40, def: 40, spc: 40, spd: 40 }, catchRate: 100, expYield: 30, growth: 'medium', learnset: [], evolutions: [], sprites: {}, desc: '', stub: true }; },
  move(id) { return Data.idx.moves[id] || { id: id, name: '???', type: DB.types[0] ? DB.types[0].id : 'normal', cat: 'phys', power: 30, acc: 100, pp: 20, prio: 0, target: 'enemy', effects: [], anim: 'hit', sfx: 'hit', desc: '', stub: true }; },
  item(id) { return Data.idx.items[id] || { id: id, name: '???', cat: 'misc', price: 0, desc: '', stub: true }; },
  trainer(id) { return Data.idx.trainers[id] || null; },
  shop(id) { return Data.idx.shops[id] || null; },
  gym(id) { return Data.idx.gyms[id] || null; },
  quest(id) { return Data.idx.quests[id] || null; },
  map(id) { return Data.idx.maps[id] || null; },
  tile(id) { return Data.idx.tiles[id] || null; },
  charset(id) { return Data.idx.charsets[id] || null; },
  type(id) { return Data.idx.types[id] || { id: id, name: '???' }; },
  song(id) { return Data.idx.songs[id] || null; },
  sfxDef(id) { return Data.idx.sfx[id] || null; },
  // Typeneffektivität eines Angriffstyps gegen ein Monster (1 oder 2 Typen).
  typeFactor(atk, defTypes) {
    let f = 1; const row = DB.typeChart[atk] || {};
    for (const d of defTypes) if (d && row[d] != null) f *= row[d];
    return f;
  },
  // Erzeugt eine noch unbenutzte ID mit Präfix (für Editor und Laufzeit).
  newId(table, prefix) { let n = DB[table].length + 1, id; do { id = prefix + '_' + n++; } while (Data.idx[table] && Data.idx[table][id]); return id; }
};

// Projektverwaltung: Laden beim Start, Arbeitskopie, Export, Sicherungen.
const Project = {
  embedded: null, source: 'embedded', error: '',
  key() { return LS + 'project.' + DB.meta.id; },
  boot() {
    let emb = null;
    try { emb = JSON.parse(document.getElementById('lm-data').textContent); }
    catch (e) { Project.error = 'Die eingebetteten Spieldaten sind beschädigt: ' + e.message; emb = {}; }
    Project.embedded = emb;
    let use = emb; Project.source = 'embedded';
    // Eine neuere Arbeitskopie des Editors (gleiches Projekt) hat Vorrang vor den eingebetteten Daten.
    const id = emb.meta && emb.meta.id;
    const wc = id ? Store.getJSON(LS + 'project.' + id) : null;
    if (wc && wc.meta && wc.format === 'leinenmeister-project' && (wc.meta.savedAt || 0) > ((emb.meta && emb.meta.savedAt) || 0)) { use = wc; Project.source = 'working'; }
    Data.init(U.clone(use));
  },
  stamp() { DB.meta.revision = (DB.meta.revision | 0) + 1; DB.meta.savedAt = Date.now(); },
  saveWorking() { Project.stamp(); const ok = Store.set(Project.key(), JSON.stringify(DB)); if (ok) Project.source = 'working'; return ok; },
  discardWorking() { Store.del(Project.key()); Data.init(U.clone(Project.embedded)); Project.source = 'embedded'; },
  toJSON() { return JSON.stringify(DB); },
  fileBase() { return (DB.meta.title || 'Leinenmeister').replace(/[^\w\-äöüÄÖÜß]+/g, '_'); },
  exportJSON() { Project.stamp(); Project.download(Project.fileBase() + '.projekt.json', Project.toJSON(), 'application/json'); },
  // Liefert die komplette, eigenständige HTML-Datei (Engine + Editor + aktuelle Daten).
  buildHTML() { Project.stamp(); return LM_buildHTML(document.getElementById('lm-engine').textContent, Project.toJSON(), DB.meta.title); },
  exportHTML() { Project.download(Project.fileBase() + '.html', Project.buildHTML(), 'text/html'); },
  importJSON(text) {
    const o = JSON.parse(text);
    if (!o || o.format !== 'leinenmeister-project') throw new Error('Keine Leinenmeister-Projektdatei.');
    if ((o.version | 0) > DATA_VERSION) throw new Error('Die Projektdatei stammt aus einer neueren Version (' + o.version + ').');
    Data.init(o);
  },
  download(name, text, mime) {
    const blob = new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    Project.lastDownload = { name: name, size: text.length };
  },
  // --- Sicherheitskopien (max. 3, im localStorage) ---
  backupList() { return Store.getJSON(LS + 'backups.' + DB.meta.id) || []; },
  backup(label) {
    let list = Project.backupList(); const t = Date.now(), json = Project.toJSON();
    let ok = Store.set(LS + 'backup.' + DB.meta.id + '.' + t, json);
    while (!ok && list.length) { const old = list.shift(); Store.del(LS + 'backup.' + DB.meta.id + '.' + old.t); ok = Store.set(LS + 'backup.' + DB.meta.id + '.' + t, json); }
    if (!ok) return false;
    list.push({ t: t, label: label || '', size: json.length });
    while (list.length > 3) { const old = list.shift(); Store.del(LS + 'backup.' + DB.meta.id + '.' + old.t); }
    Store.setJSON(LS + 'backups.' + DB.meta.id, list);
    return true;
  },
  restoreBackup(t) { const s = Store.get(LS + 'backup.' + DB.meta.id + '.' + t); if (!s) return false; Project.importJSON(s); return true; },
  deleteBackup(t) { const id = DB.meta.id; Store.del(LS + 'backup.' + id + '.' + t); Store.setJSON(LS + 'backups.' + id, Project.backupList().filter(b => b.t !== t)); }
};

// ===== [03] RENDERING ========================================================
// Geräte-Einstellungen (nicht Teil des Spielstands): Textgeschwindigkeit, Ton, Palette.
const Opt = Object.assign({ text: 1, sound: true, music: true, pal: 'gruen', touch: 'auto' }, Store.getJSON(LS + 'options') || {});
function saveOpt() { Store.setJSON(LS + 'options', Opt); }

const Gfx = {
  PALETTES: {
    gruen: { name: 'KLASSIK', c: ['#e0f8d0', '#88c070', '#346856', '#081820'] },
    dmg: { name: 'ERBSE', c: ['#9bbc0f', '#8bac0f', '#306230', '#0f380f'] },
    pocket: { name: 'GRAU', c: ['#f4f4f4', '#a8a8a8', '#585858', '#101010'] },
    sepia: { name: 'SEPIA', c: ['#f6e8c8', '#c8a878', '#806040', '#281808'] }
  },
  pal: [], css: [], lut: {}, cache: {}, fontAtlas: null, fontMap: {},
  fade: 0,        // Palettenblende: >0 = Richtung hell, <0 = Richtung dunkel (ganzzahlig, -3..3)
  invert: false,  // Bildschirm invertieren (Kampfeffekte)
  cv: null, ctx: null,

  init(canvas) {
    Gfx.cv = canvas; Gfx.ctx = canvas.getContext('2d', { willReadFrequently: true });
    Gfx.ctx.imageSmoothingEnabled = false; Gfx.setPalette(Opt.pal);
  },
  setPalette(id) {
    const p = Gfx.PALETTES[id] || Gfx.PALETTES.gruen;
    Gfx.css = p.c.slice(); Gfx.pal = p.c.map(h => [parseInt(h.substr(1, 2), 16), parseInt(h.substr(3, 2), 16), parseInt(h.substr(5, 2), 16)]);
    Gfx.lut = {}; Gfx.pal.forEach((c, i) => { Gfx.lut[(c[0] << 16) | (c[1] << 8) | c[2]] = i; });
    Gfx.invalidate();
  },
  // Sprite-Cache leeren (nach Palettenwechsel oder wenn der Editor Grafiken geändert hat).
  invalidate() { Gfx.cache = {}; Gfx.fontAtlas = null; },

  // Liefert ein fertig eingefärbtes Canvas für ein Sprite. mode: '' | 'sil' (dunkle Silhouette) | 'white'
  get(key, flip, mode) {
    const ck = key + '|' + (flip ? 1 : 0) + '|' + (mode || '');
    let c = Gfx.cache[ck];
    if (!c) { c = Gfx.cache[ck] = Gfx.render(DB.sprites[key] || Gfx.MISSING, flip, mode); }
    return c;
  },
  MISSING: { w: 16, h: 16, px: ['3333333333333333', '3000000000000003', '3033300000033303', '3030000000000303', '3030033333300303', '3000030000300003', '3000000003300003', '3000000033000003', '3000000330000003', '3000000330000003', '3000000000000003', '3030000330000303', '3030000000000303', '3033300000033303', '3000000000000003', '3333333333333333'] },
  render(s, flip, mode) {
    const w = Math.max(1, s.w | 0), h = Math.max(1, s.h | 0);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d'), img = x.createImageData(w, h), d = img.data, px = s.px || [];
    for (let j = 0; j < h; j++) {
      const row = px[j] || '';
      for (let i = 0; i < w; i++) {
        const ch = row.charCodeAt(flip ? w - 1 - i : i) - 48;   // '0'..'3' -> 0..3
        if (ch < 0 || ch > 3 || ch !== ch) continue;            // '.' und alles andere = transparent
        const col = Gfx.pal[mode === 'sil' ? 3 : mode === 'white' ? 0 : ch], o = (j * w + i) * 4;
        d[o] = col[0]; d[o + 1] = col[1]; d[o + 2] = col[2]; d[o + 3] = 255;
      }
    }
    x.putImageData(img, 0, 0);
    return c;
  },
  spr(key, x, y, flip, mode) { Gfx.ctx.drawImage(Gfx.get(key, flip, mode), x | 0, y | 0); },
  sprS(key, x, y, scale, flip, mode) { const c = Gfx.get(key, flip, mode); Gfx.ctx.drawImage(c, x | 0, y | 0, c.width * scale, c.height * scale); },
  // Teilausschnitt eines Sprites zeichnen (z.B. Gras über Füssen, Besiegt-Animation).
  sprClip(key, x, y, sx, sy, sw, sh, flip, scale) {
    const c = Gfx.get(key, flip); scale = scale || 1;
    sw = Math.min(sw, c.width - sx); sh = Math.min(sh, c.height - sy); if (sw <= 0 || sh <= 0) return;
    Gfx.ctx.drawImage(c, sx, sy, sw, sh, x | 0, y | 0, sw * scale, sh * scale);
  },
  rect(x, y, w, h, shade) { if (w <= 0 || h <= 0) return; Gfx.ctx.fillStyle = Gfx.css[shade]; Gfx.ctx.fillRect(x | 0, y | 0, w | 0, h | 0); },
  clear(shade) { Gfx.rect(0, 0, SCREEN_W, SCREEN_H, shade || 0); },
  line(x0, y0, x1, y1, shade) { // Bresenham, pixelgenau
    x0 |= 0; y0 |= 0; x1 |= 0; y1 |= 0;
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let e = dx + dy; Gfx.ctx.fillStyle = Gfx.css[shade];
    for (let n = 0; n < 400; n++) {
      Gfx.ctx.fillRect(x0, y0, 1, 1); if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; }
    }
  },
  // Klassischer Textrahmen: dreifache Linie mit abgerundeten Ecken, Inhalt ab x+8 / y+8.
  box(x, y, w, h) {
    Gfx.rect(x, y, w, h, 0);
    Gfx.rect(x + 2, y + 1, w - 4, 1, 3); Gfx.rect(x + 2, y + h - 2, w - 4, 1, 3); Gfx.rect(x + 1, y + 2, 1, h - 4, 3); Gfx.rect(x + w - 2, y + 2, 1, h - 4, 3);
    Gfx.rect(x + 2, y + 2, w - 4, 1, 1); Gfx.rect(x + 2, y + h - 3, w - 4, 1, 1); Gfx.rect(x + 2, y + 2, 1, h - 4, 1); Gfx.rect(x + w - 3, y + 2, 1, h - 4, 1);
    Gfx.rect(x + 3, y + 3, w - 6, 1, 3); Gfx.rect(x + 3, y + h - 4, w - 6, 1, 3); Gfx.rect(x + 3, y + 3, 1, h - 6, 3); Gfx.rect(x + w - 4, y + 3, 1, h - 6, 3);
  },
  // --- Bitmap-Font (8x8) aus DB.font.glyphs ---
  buildFont() {
    const glyphs = DB.font.glyphs || {}, chars = Object.keys(glyphs);
    Gfx.fontMap = {}; Gfx.fontAtlas = [];
    for (let shade = 0; shade < 4; shade++) {
      const c = document.createElement('canvas'); c.width = Math.max(8, chars.length * 8); c.height = 8;
      const x = c.getContext('2d'); x.fillStyle = Gfx.css[shade];
      chars.forEach((ch, n) => {
        Gfx.fontMap[ch] = n; const hex = glyphs[ch] || '';
        for (let r = 0; r < 8; r++) { const b = parseInt(hex.substr(r * 2, 2), 16) || 0; for (let k = 0; k < 8; k++) if (b & (0x80 >> k)) x.fillRect(n * 8 + k, r, 1, 1); }
      });
      Gfx.fontAtlas.push(c);
    }
  },
  text(str, x, y, shade) {
    if (!Gfx.fontAtlas) Gfx.buildFont();
    const a = Gfx.fontAtlas[shade == null ? 3 : shade]; str = String(str); x |= 0; y |= 0;
    for (let i = 0; i < str.length; i++) {
      const ch = str[i]; if (ch === ' ') continue;
      let n = Gfx.fontMap[ch]; if (n == null) n = Gfx.fontMap['?']; if (n == null) continue;
      Gfx.ctx.drawImage(a, n * 8, 0, 8, 8, x + i * 8, y, 8, 8);
    }
  },
  textR(str, xRight, y, shade) { str = String(str); Gfx.text(str, xRight - str.length * 8, y, shade); },
  textC(str, cx, y, shade) { str = String(str); Gfx.text(str, cx - str.length * 4, y, shade); },
  // Nachbearbeitung des fertigen Bildes: Palettenblende und Invertierung (wie Game-Boy-Palettenregister).
  present() {
    if (!Gfx.fade && !Gfx.invert) return;
    const img = Gfx.ctx.getImageData(0, 0, SCREEN_W, SCREEN_H), d = img.data, pal = Gfx.pal, lut = Gfx.lut, f = Gfx.fade | 0;
    for (let i = 0; i < d.length; i += 4) {
      let idx = lut[(d[i] << 16) | (d[i + 1] << 8) | d[i + 2]];
      if (idx === undefined) idx = d[i + 1] > 200 ? 0 : d[i + 1] > 140 ? 1 : d[i + 1] > 60 ? 2 : 3;
      if (Gfx.invert) idx = 3 - idx;
      idx -= f; if (idx < 0) idx = 0; else if (idx > 3) idx = 3;
      const c = pal[idx]; d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2];
    }
    Gfx.ctx.putImageData(img, 0, 0);
  }
};

// ===== [04] SOUND ============================================================
// Kleiner Chiptune-Synthesizer: Rechteck (50/25/12.5 %), Dreieck, Rauschen.
// Musikformat siehe Kopfkommentar (DB.songs / DB.sfx).
const Sound = {
  ac: null, music: null, sfxOut: null, waves: {}, noiseBuf: null,
  cur: null,          // laufender Song {id, tracks, pos[], time[]}
  curId: '', wantId: '', timer: 0, parsed: {}, jingleUntil: 0,
  NOTE: { c: 0, 'c#': 1, d: 2, 'd#': 3, e: 4, f: 5, 'f#': 6, g: 7, 'g#': 8, a: 9, 'a#': 10, b: 11 },

  // Muss aus einer Nutzereingabe heraus aufgerufen werden (Browser-Richtlinie).
  unlock() {
    if (Sound.ac) { if (Sound.ac.state === 'suspended') Sound.ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try {
      const ac = Sound.ac = new AC();
      Sound.music = ac.createGain(); Sound.music.gain.value = 0.16; Sound.music.connect(ac.destination);
      Sound.sfxOut = ac.createGain(); Sound.sfxOut.gain.value = 0.22; Sound.sfxOut.connect(ac.destination);
      for (const [id, duty] of [['sq25', 0.25], ['sq12', 0.125]]) {
        const n = 32, re = new Float32Array(n), im = new Float32Array(n);
        for (let k = 1; k < n; k++) re[k] = (2 / (k * Math.PI)) * Math.sin(k * Math.PI * duty);
        Sound.waves[id] = ac.createPeriodicWave(re, im);
      }
      const len = ac.sampleRate, buf = ac.createBuffer(1, len, ac.sampleRate), ch = buf.getChannelData(0);
      for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
      Sound.noiseBuf = buf;
      Sound.timer = setInterval(Sound.pump, 60);
      if (Sound.wantId) { const w = Sound.wantId; Sound.curId = ''; Sound.playSong(w); }
    } catch (e) { Sound.ac = null; }
  },
  invalidate() { Sound.parsed = {}; },
  parse(song) {
    if (Sound.parsed[song.id]) return Sound.parsed[song.id];
    const tracks = (song.tracks || []).map(tr => {
      const ev = [];
      for (const tok of String(tr.seq || '').trim().split(/\s+/)) {
        const m = /^([a-g]#?|r|k|s|h)(\d)?:(\d+)$/.exec(tok); if (!m) continue;
        const len = Math.max(1, +m[3]); let f = 0, drum = '';
        if (m[1] === 'r') f = 0;
        else if (tr.wave === 'noise') drum = m[1];
        else if (m[1] in Sound.NOTE) f = 440 * Math.pow(2, (Sound.NOTE[m[1]] - 9 + ((+m[2] || 4) - 4) * 12) / 12);
        ev.push({ f: f, drum: drum, len: len });
      }
      return { wave: tr.wave || 'sq50', vol: tr.vol == null ? 0.5 : tr.vol, ev: ev };
    }).filter(t => t.ev.length);
    return (Sound.parsed[song.id] = { tracks: tracks, step: 60 / (song.bpm || 120) / 4, loop: song.loop !== false });
  },
  playSong(id) {
    Sound.wantId = id || '';
    if (!Sound.ac || !Opt.music) { Sound.cur = null; Sound.curId = ''; return; }
    if (id === Sound.curId && Sound.cur) return;
    Sound.stopSong(); Sound.wantId = id || '';
    const song = Data.song(id); if (!song) return;
    const p = Sound.parse(song), t0 = Math.max(Sound.ac.currentTime, Sound.jingleUntil) + 0.06;
    Sound.cur = { p: p, pos: p.tracks.map(() => 0), time: p.tracks.map(() => t0), out: Sound.music }; Sound.curId = id;
  },
  stopSong() {
    Sound.cur = null; Sound.curId = '';
    if (Sound.ac && Sound.music) { // laufende Noten hart abschneiden: neuen Ausgang verwenden
      const old = Sound.music, ac = Sound.ac; old.gain.setTargetAtTime(0, ac.currentTime, 0.02); setTimeout(() => { try { old.disconnect(); } catch (e) { /* egal */ } }, 300);
      Sound.music = ac.createGain(); Sound.music.gain.value = 0.16; Sound.music.connect(ac.destination);
    }
  },
  // Kurze Melodie über der Musik (pausiert die Musik währenddessen). Liefert die Dauer in Sekunden.
  jingle(id) {
    const song = Data.song(id); if (!song || !Sound.ac || !Opt.sound) return 0;
    const p = Sound.parse(song), ac = Sound.ac, t0 = ac.currentTime + 0.03; let dur = 0;
    for (const tr of p.tracks) { let t = t0; for (const e of tr.ev) { Sound.note(tr, e, t, p.step, Sound.sfxOut); t += e.len * p.step; } dur = Math.max(dur, t - t0); }
    Sound.jingleUntil = t0 + dur;
    if (Sound.cur) { // Musik stumm schalten und danach fortsetzen
      const id2 = Sound.curId; Sound.stopSong(); Sound.wantId = id2;
      setTimeout(() => { if (Sound.wantId === id2 && !Sound.cur) Sound.playSong(id2); }, dur * 1000 - 40);
    }
    return dur;
  },
  pump() { // plant Noten ca. 0,25 s im Voraus
    const s = Sound.cur, ac = Sound.ac; if (!s || !ac || ac.state !== 'running') return;
    const ahead = ac.currentTime + 0.25;
    s.p.tracks.forEach((tr, i) => {
      let guard = 0;
      while (s.time[i] < ahead && guard++ < 64) {
        if (s.pos[i] >= tr.ev.length) { if (!s.p.loop) return; s.pos[i] = 0; }
        const e = tr.ev[s.pos[i]++]; if (s.time[i] > ac.currentTime - 0.05) Sound.note(tr, e, s.time[i], s.p.step, s.out);
        s.time[i] += e.len * s.p.step;
      }
    });
  },
  note(tr, e, t, step, out) {
    const ac = Sound.ac, dur = e.len * step;
    if (tr.wave === 'noise') {
      if (!e.drum) return;
      const d = e.drum === 'k' ? [140, 0.09, 1.0] : e.drum === 's' ? [2600, 0.09, 0.7] : [8000, 0.03, 0.4];
      Sound.tone('noise', d[0], d[0], t, d[1], tr.vol * d[2], out); return;
    }
    if (!e.f) return;
    Sound.tone(tr.wave, e.f, e.f, t, Math.max(0.03, dur * 0.92), tr.vol, out);
  },
  // Einzelner Ton/Rauschstoss mit kurzer Hüllkurve.
  tone(wave, f, f2, t, dur, vol, out) {
    const ac = Sound.ac, g = ac.createGain(); let src;
    if (wave === 'noise') {
      src = ac.createBufferSource(); src.buffer = Sound.noiseBuf; src.loop = true;
      const fl = ac.createBiquadFilter(); fl.type = f > 3000 ? 'highpass' : 'lowpass'; fl.frequency.setValueAtTime(Math.max(40, f), t);
      if (f2 && f2 !== f) fl.frequency.exponentialRampToValueAtTime(Math.max(40, f2), t + dur);
      src.connect(fl); fl.connect(g);
    } else {
      src = ac.createOscillator();
      if (wave === 'tri') src.type = 'triangle'; else if (Sound.waves[wave]) src.setPeriodicWave(Sound.waves[wave]); else src.type = 'square';
      src.frequency.setValueAtTime(Math.max(20, f), t);
      if (f2 && f2 !== f) src.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
      src.connect(g);
    }
    const v = Math.max(0.0001, vol);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + 0.004);
    g.gain.setValueAtTime(v, t + Math.max(0.005, dur - 0.015)); g.gain.linearRampToValueAtTime(0.0001, t + dur);
    g.connect(out); src.start(t); src.stop(t + dur + 0.02);
  },
  sfx(id) {
    const def = Data.sfxDef(id); if (!def || !Sound.ac || !Opt.sound || Sound.ac.state !== 'running') return;
    let t = Sound.ac.currentTime + 0.005;
    for (const s of def.steps || []) { const d = Math.max(0.005, +s.d || 0.05); if (s.f > 0 && s.v !== 0) Sound.tone(s.w || 'sq50', +s.f, +s.f2 || +s.f, t, d, s.v == null ? 0.5 : +s.v, Sound.sfxOut); t += d; }
  },
  applyOptions() { if (!Opt.music) Sound.stopSong(); else if (Sound.wantId) { const w = Sound.wantId; Sound.curId = ''; Sound.playSong(w); } }
};

const Shell = {
  root: null, canvas: null,
  init() {
    const st = document.createElement('style'); st.textContent = LM_CSS; document.head.appendChild(st);
    const root = Shell.root = document.createElement('div'); root.id = 'lm-root';
    root.innerHTML = '<div id="lm-bezel"><canvas id="lm-screen" width="' + SCREEN_W + '" height="' + SCREEN_H + '"></canvas></div>' +
      '<div id="lm-touch"><div id="lm-dpad"><i class="h"></i><i class="v"></i><b class="u"></b><b class="d"></b><b class="l"></b><b class="r"></b></div>' +
      '<div id="lm-btns"><div class="lm-tb" id="lm-ta" data-k="a">A</div><div class="lm-tb" id="lm-tb" data-k="b">B</div><div class="lm-tb" id="lm-tm" data-k="start">MENÜ</div></div></div>' +
      '<div id="lm-hint"><span id="lm-keys">Pfeile/WASD: Bewegen · Z/Enter: A · X/Esc: B · M: Menü · F2: Editor</span>' +
      '<button id="lm-btn-touch" type="button">Touch-Tasten</button><button id="lm-btn-editor" type="button">Editor (F2)</button></div>';
    document.body.appendChild(root);
    Shell.canvas = root.querySelector('#lm-screen');
    root.querySelector('#lm-btn-touch').addEventListener('click', () => { Opt.touch = root.classList.contains('touch') ? 'off' : 'on'; saveOpt(); Shell.applyTouch(); });
    root.querySelector('#lm-btn-editor').addEventListener('click', () => Engine.toggleEditor());
    window.addEventListener('resize', Shell.layout);
    Shell.applyTouch();
  },
  applyTouch() {
    const coarse = window.matchMedia && window.matchMedia('(pointer:coarse)').matches;
    Shell.root.classList.toggle('touch', Opt.touch === 'on' || (Opt.touch === 'auto' && coarse));
    Shell.layout();
  },
  // Skaliert den Bildschirm ganzzahlig (pixelgenau) in den verfügbaren Platz.
  layout() {
    const touch = Shell.root.classList.contains('touch'), W = window.innerWidth, H = window.innerHeight, land = W > H;
    let aw = W - 28, ah = H - 70;
    if (touch) { if (land) { aw -= 330; ah = H - 44; } else ah -= 170; }
    let s = Math.min(aw / SCREEN_W, ah / SCREEN_H);
    s = s >= 1 ? Math.floor(s) : Math.max(0.5, s);
    Shell.canvas.style.width = Math.round(SCREEN_W * s) + 'px'; Shell.canvas.style.height = Math.round(SCREEN_H * s) + 'px';
  }
};

const Input = {
  down: {}, hits: {}, pend: {}, hold: {}, dirStack: [],
  KEYS: {
    ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
    KeyZ: 'a', KeyY: 'a', Enter: 'a', Space: 'a', KeyX: 'b', Escape: 'b', Backspace: 'b', KeyM: 'start'
  },
  init() {
    window.addEventListener('keydown', e => {
      Sound.unlock();
      if (e.code === 'F2') { e.preventDefault(); Engine.toggleEditor(); return; }
      if (Engine.editorOpen || Input.typing(e)) return;
      const k = Input.KEYS[e.code]; if (!k) return;
      e.preventDefault(); if (!e.repeat) Input.set(k, true);
    });
    window.addEventListener('keyup', e => { const k = Input.KEYS[e.code]; if (k) Input.set(k, false); });
    window.addEventListener('blur', () => Input.releaseAll());
    // --- Touch: Steuerkreuz als eine Fläche (Richtung aus dem Winkel), Tasten einzeln ---
    const dpad = document.getElementById('lm-dpad');
    let cur = null;
    const dp = e => {
      e.preventDefault(); Sound.unlock();
      const r = dpad.getBoundingClientRect(), x = e.clientX - (r.left + r.width / 2), y = e.clientY - (r.top + r.height / 2);
      let d = null;
      if (Math.hypot(x, y) > 12) d = Math.abs(x) > Math.abs(y) ? (x < 0 ? 'left' : 'right') : (y < 0 ? 'up' : 'down');
      if (d !== cur) { if (cur) Input.set(cur, false); cur = d; if (d) Input.set(d, true); }
    };
    const du = e => { e.preventDefault(); if (cur) Input.set(cur, false); cur = null; };
    dpad.addEventListener('pointerdown', e => { try { dpad.setPointerCapture(e.pointerId); } catch (x) { /* egal */ } dp(e); });
    dpad.addEventListener('pointermove', e => { if (e.buttons || e.pointerType === 'touch') dp(e); });
    dpad.addEventListener('pointerup', du); dpad.addEventListener('pointercancel', du);
    document.querySelectorAll('.lm-tb').forEach(b => {
      const k = b.getAttribute('data-k');
      b.addEventListener('pointerdown', e => { e.preventDefault(); Sound.unlock(); Input.set(k, true); b.classList.add('on'); });
      const up = e => { e.preventDefault(); Input.set(k, false); b.classList.remove('on'); };
      b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('pointerleave', up);
    });
    document.addEventListener('pointerdown', () => Sound.unlock(), { passive: true });
    document.addEventListener('contextmenu', e => { if (!Engine.editorOpen) e.preventDefault(); });
  },
  typing(e) { const t = e.target && e.target.tagName; return t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT'; },
  set(k, on) {
    if (on && !Input.down[k]) Input.pend[k] = true;
    Input.down[k] = on;
    if (DIRS[k]) { Input.dirStack = Input.dirStack.filter(d => d !== k); if (on) Input.dirStack.push(k); }
  },
  releaseAll() { Input.down = {}; Input.dirStack = []; },
  // Einmal pro Tick: wandelt gesammelte Tastendrücke in "hits" (Flanken) um.
  poll() {
    Input.hits = Input.pend; Input.pend = {};
    for (const k of ['up', 'down', 'left', 'right', 'a', 'b', 'start']) Input.hold[k] = Input.down[k] ? (Input.hold[k] || 0) + 1 : 0;
  },
  hit(k) { return !!Input.hits[k]; },
  held(k) { return !!Input.down[k]; },
  rep(k) { return !!Input.hits[k] || (Input.hold[k] > 16 && Input.hold[k] % 5 === 0); }, // Tastenwiederholung für Menüs
  dir() { // zuletzt gedrückte Richtung (auch kurze Antipper zählen)
    if (Input.dirStack.length) return Input.dirStack[Input.dirStack.length - 1];
    for (const d of DIR_LIST) if (Input.hits[d]) return d;
    return null;
  },
  clear() { Input.hits = {}; Input.pend = {}; }
};

// ===== [06] SPIELSTAND =======================================================
let G = null;   // aktueller Spielzustand (wird gespeichert) – Aufbau siehe Kopfkommentar

// Migrationen des Spielstandformats: SAVE_MIGRATIONS[v] hebt einen Stand von v auf v+1.
const SAVE_MIGRATIONS = {};

const Game = {
  testMode: false,   // true, wenn aus dem Editor heraus getestet wird (eigener Speicherplatz)
  fresh() {
    const m = DB.meta;
    return {
      format: 'leinenmeister-save', version: SAVE_VERSION, projectId: m.id, name: m.defaultName, rival: m.defaultRival,
      map: m.startMap, x: m.startX, y: m.startY, dir: m.startDir || 'down', money: m.startMoney | 0, time: 0, steps: 0,
      party: [], storage: [], bag: {}, seen: {}, caught: {}, flags: {}, vars: {}, defeated: {}, badges: [], quests: {},
      respawn: { map: m.startMap, x: m.startX, y: m.startY, dir: m.startDir || 'down' }, npcState: {}, tiles: {}, uid: 1
    };
  },
  flag(k) { return !!G.flags[k]; },
  setFlag(k, v) { if (v === false) delete G.flags[k]; else G.flags[k] = true; },
  getVar(k) { return +G.vars[k] || 0; },
  setVar(k, v) { G.vars[k] = +v || 0; },
  addMoney(n) { G.money = U.clamp(G.money + (n | 0), 0, 999999); },
  timeStr() { const s = Math.floor(G.time), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60; return U.pad(h, 2, '0') + ':' + U.pad(m, 2, '0'); },
  seenCount() { return Object.keys(G.seen).filter(id => Data.hasMon(id)).length; },
  caughtCount() { return Object.keys(G.caught).filter(id => Data.hasMon(id)).length; }
};

const Save = {
  key() { return LS + 'save.' + DB.meta.id + (Game.testMode ? '.test' : ''); },
  exists() { return !!Store.get(Save.key()); },
  write() { if (World.map) { G.map = World.mapId; G.x = World.p.x; G.y = World.p.y; G.dir = World.p.dir; } return Store.set(Save.key(), JSON.stringify(G)); },
  read() { const s = Store.getJSON(Save.key()); return s ? Save.prepare(s) : null; },
  del() { Store.del(Save.key()); },
  prepare(s) {
    if (!s || s.format !== 'leinenmeister-save') throw new Error('Kein Leinenmeister-Spielstand.');
    if ((s.version | 0) > SAVE_VERSION) throw new Error('Der Spielstand stammt aus einer neueren Version.');
    return Save.sanitize(Save.migrate(s));
  },
  migrate(s) { if (!s.version) s.version = 1; while (s.version < SAVE_VERSION && SAVE_MIGRATIONS[s.version]) { SAVE_MIGRATIONS[s.version](s); s.version++; } return s; },
  // Macht einen Spielstand robust gegen inzwischen geänderte Projektdaten.
  sanitize(s) {
    const f = Game.fresh();
    for (const k in f) if (s[k] == null || typeof s[k] !== typeof f[k]) s[k] = f[k];
    const okMon = m => m && Data.hasMon(m.species) && Array.isArray(m.moves);
    s.party = s.party.filter(okMon).slice(0, PARTY_MAX); s.storage = s.storage.filter(okMon);
    for (const m of s.party.concat(s.storage)) { m.moves = m.moves.filter(mv => mv && Data.idx.moves[mv.id]).slice(0, 4); m.iv = m.iv || { hp: 8, atk: 8, def: 8, spc: 8, spd: 8 }; m.level = U.clamp(m.level | 0, 1, MAX_LEVEL); }
    for (const id of Object.keys(s.bag)) if (!Data.idx.items[id] || !(s.bag[id] > 0)) delete s.bag[id];
    s.badges = s.badges.filter(id => Data.gym(id));
    const map = Data.map(s.map);
    if (!map || s.x < 0 || s.y < 0 || s.x >= map.w || s.y >= map.h) { s.map = f.map; s.x = f.x; s.y = f.y; s.dir = f.dir; }
    if (!Data.map(s.respawn.map)) s.respawn = f.respawn;
    return s;
  },
  exportFile() { Save.write(); Project.download(Project.fileBase() + '.spielstand.json', JSON.stringify(G), 'application/json'); },
  importText(text) { const s = Save.prepare(JSON.parse(text)); Store.set(Save.key(), JSON.stringify(s)); return s; },
  // Öffnet einen Dateidialog und liefert den Dateitext (oder null bei Abbruch).
  pickFile(accept) {
    return new Promise(res => {
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = accept || '.json'; inp.style.display = 'none';
      let done = false; const fin = v => { if (!done) { done = true; inp.remove(); res(v); } };
      inp.addEventListener('change', () => { const f = inp.files && inp.files[0]; if (!f) return fin(null); const r = new FileReader(); r.onload = () => fin({ name: f.name, text: String(r.result), file: f }); r.onerror = () => fin(null); r.readAsText(f); });
      inp.addEventListener('cancel', () => fin(null));
      document.body.appendChild(inp); inp.click();
      Save._pickCancel = () => fin(null);
    });
  }
};

// ===== [07] MONSTER & INVENTAR ===============================================
const Mon = {
  // Erzeugt eine Monster-Instanz der Art speciesId auf dem angegebenen Level.
  create(speciesId, level, opts) {
    opts = opts || {}; const sp = Data.mon(speciesId); level = U.clamp(level | 0, 1, MAX_LEVEL);
    const m = {
      uid: (G ? G.uid++ : 0), species: speciesId, nick: '', level: level, exp: Mon.expFor(sp, level), hp: 1, status: '', sleep: 0,
      iv: { hp: U.randInt(0, 15), atk: U.randInt(0, 15), def: U.randInt(0, 15), spc: U.randInt(0, 15), spd: U.randInt(0, 15) }, moves: [], ot: G ? G.name : ''
    };
    let ids = opts.moves && opts.moves.length ? opts.moves.slice(0, 4) : Mon.defaultMoves(sp, level);
    m.moves = ids.map(id => ({ id: id, pp: Data.move(id).pp }));
    m.hp = Mon.maxHp(m);
    return m;
  },
  // Die (bis zu) vier zuletzt erlernbaren Attacken bis zum Level.
  defaultMoves(sp, level) {
    const ids = [];
    for (const l of sp.learnset.slice().sort((a, b) => a.level - b.level)) if (l.level <= level && Data.idx.moves[l.move] && !ids.includes(l.move)) ids.push(l.move);
    const out = ids.slice(-4);
    if (!out.length && DB.moves[0]) out.push(DB.moves[0].id);
    return out;
  },
  sp(m) { return Data.mon(m.species); },
  name(m) { return m.nick || Mon.sp(m).name; },
  stat(m, k) {
    const sp = Mon.sp(m), b = sp.base[k] | 0, iv = (m.iv && m.iv[k]) | 0, core = Math.floor((b * 2 + iv) * m.level / 100);
    return k === 'hp' ? core + m.level + 10 : core + 5;
  },
  maxHp(m) { return Mon.stat(m, 'hp'); },
  stats(m) { const o = {}; for (const k of STATS) o[k] = Mon.stat(m, k); return o; },
  expFor(sp, level) { return level <= 1 ? 0 : Math.floor((GROWTH[sp.growth] || 1) * level * level * level); },
  expToNext(m) { return m.level >= MAX_LEVEL ? 0 : Math.max(0, Mon.expFor(Mon.sp(m), m.level + 1) - m.exp); },
  expFrac(m) { if (m.level >= MAX_LEVEL) return 0; const sp = Mon.sp(m), a = Mon.expFor(sp, m.level), b = Mon.expFor(sp, m.level + 1); return U.clamp((m.exp - a) / Math.max(1, b - a), 0, 1); },
  alive(m) { return m && m.hp > 0; },
  firstAlive(party) { return party.findIndex(Mon.alive); },
  heal(m) { m.hp = Mon.maxHp(m); m.status = ''; m.sleep = 0; for (const mv of m.moves) mv.pp = Data.move(mv.id).pp; },
  healParty() { for (const m of G.party) Mon.heal(m); },
  // Fügt EP hinzu; liefert eine Liste der erreichten Level: [{level, before:{stats}, after:{stats}, learn:[moveIds]}]
  addExp(m, amount) {
    const ups = []; if (m.level >= MAX_LEVEL) return ups;
    m.exp += Math.max(0, amount | 0); const sp = Mon.sp(m);
    while (m.level < MAX_LEVEL && m.exp >= Mon.expFor(sp, m.level + 1)) {
      const before = Mon.stats(m); m.level++; const after = Mon.stats(m);
      m.hp = Math.min(after.hp, m.hp + (after.hp - before.hp));
      ups.push({ level: m.level, before: before, after: after, learn: Mon.learnsAt(sp, m.level) });
    }
    return ups;
  },
  learnsAt(sp, level) { return sp.learnset.filter(l => l.level === level && Data.idx.moves[l.move]).map(l => l.move); },
  knows(m, moveId) { return m.moves.some(mv => mv.id === moveId); },
  // Prüft, ob eine Entwicklung möglich ist. trig: {kind:'level'} oder {kind:'item', item}
  evolution(m, trig) {
    for (const e of Mon.sp(m).evolutions) {
      if (!Data.hasMon(e.to)) continue;
      if (trig.kind === 'level' && (e.kind || 'level') === 'level' && m.level >= (e.level | 0)) return e;
      if (trig.kind === 'item' && e.kind === 'item' && e.item === trig.item) return e;
    }
    return null;
  },
  evolve(m, to) { const ratio = m.hp / Mon.maxHp(m); m.species = to; m.hp = Math.max(m.hp > 0 ? 1 : 0, Math.round(Mon.maxHp(m) * ratio)); },
  // Registriert ein Monster im Lexikon.
  see(id) { if (Data.hasMon(id)) G.seen[id] = true; },
  own(id) { if (Data.hasMon(id)) { G.seen[id] = true; G.caught[id] = true; } },
  // Fügt ein Monster dem Team hinzu oder lagert es ein. Liefert 'party' oder 'storage'.
  give(m) { Mon.own(m.species); if (G.party.length < PARTY_MAX) { G.party.push(m); return 'party'; } G.storage.push(m); return 'storage'; }
};

const Bag = {
  count(id) { return G.bag[id] | 0; },
  has(id, n) { return Bag.count(id) >= (n || 1); },
  add(id, n) { if (!Data.idx.items[id]) return false; G.bag[id] = Math.min(99, Bag.count(id) + (n || 1)); return true; },
  remove(id, n) { n = n || 1; if (Bag.count(id) < n) return false; G.bag[id] -= n; if (G.bag[id] <= 0) delete G.bag[id]; return true; },
  // Liste der Gegenstände im Beutel, sortiert nach Reihenfolge in der Datenbank. filter: optionale Funktion(item)
  list(filter) { return DB.items.filter(it => Bag.count(it.id) > 0 && (!filter || filter(it))).map(it => ({ item: it, n: Bag.count(it.id) })); },
  // Kann der Gegenstand (prinzipiell) auf Monster angewendet werden?
  targetsMon(it) { return it.cat === 'heal' || it.cat === 'status' || it.cat === 'revive'; },
  // Wendet einen Heil-/Status-/Belebungsgegenstand an. Liefert {ok, msg}. Verbraucht den Gegenstand NICHT.
  useOnMon(it, m) {
    const name = Mon.name(m), max = Mon.maxHp(m);
    if (it.cat === 'revive') {
      if (m.hp > 0) return { ok: false, msg: 'Das hätte keine Wirkung.' };
      m.hp = Math.max(1, Math.floor(max * (it.revive || 50) / 100)); m.status = ''; m.sleep = 0;
      return { ok: true, msg: name + ' ist wieder bei Kräften!' };
    }
    if (m.hp <= 0) return { ok: false, msg: 'Das hätte keine Wirkung.' };
    let did = false, msg = '';
    if (it.heal > 0 && m.hp < max) { const old = m.hp; m.hp = Math.min(max, m.hp + it.heal); msg = name + ' erhält ' + (m.hp - old) + ' LP zurück.'; did = true; }
    const cures = it.cures === 'all' ? Object.keys(STATUS) : (it.cures || []);
    if (m.status && cures.includes(m.status)) { msg = (msg ? msg + ' ' : '') + name + ' ist von ' + STATUS[m.status].name + ' geheilt.'; m.status = ''; m.sleep = 0; did = true; }
    return did ? { ok: true, msg: msg } : { ok: false, msg: 'Das hätte keine Wirkung.' };
  }
};

// ===== [08] UI ===============================================================
// frame(): wartet bis zum nächsten Engine-Tick (Grundlage aller async-Abläufe).
function frame() { return new Promise(res => Engine.waiters.push(res)); }
async function wait(n) { for (let i = 0; i < n; i++) await frame(); }

const UI = {
  layers: [],   // Zeichenstapel: Objekte mit draw(); später eingefügte liegen oben
  COLS: 18,     // Zeichen pro Textzeile
  push(l) { UI.layers.push(l); return l; },
  pop(l) { const i = UI.layers.indexOf(l); if (i >= 0) UI.layers.splice(i, 1); },
  draw() { for (const l of UI.layers) l.draw(); },
  reset() { UI.layers = []; Gfx.fade = 0; Gfx.invert = false; },

  // --- Textbox (unten, 2 Zeilen) ---
  tb: {
    lines: ['', ''], more: false, t: 0,
    draw() {
      Gfx.box(0, 96, 160, 48); Gfx.text(this.lines[0], 8, 108); Gfx.text(this.lines[1], 8, 124);
      if (this.more && (Engine.ticks >> 4) & 1) Gfx.text('▼', 144, 132);
    }
  },
  tbShow() { UI.pop(UI.tb); UI.push(UI.tb); },
  tbHide() { UI.pop(UI.tb); UI.tb.lines = ['', '']; UI.tb.more = false; },
  tbSet(text) { const p = UI.format(text)[0] || []; UI.tb.lines = [p[0] || '', p[1] || '']; UI.tb.more = false; UI.tbShow(); },

  // Ersetzt Platzhalter und bricht Text um. Ergebnis: Seiten -> Zeilen.
  subst(text) {
    return U.lines(text).replace(/\{(\w+)(?::([\w.]+))?\}/g, (m, k, arg) => {
      if (!G) return m;
      if (k === 'PLAYER') return G.name; if (k === 'RIVAL') return G.rival; if (k === 'MONEY') return String(G.money);
      if (k === 'VAR') return String(Game.getVar(arg)); return m;
    });
  },
  wrap(text, cols) {
    const out = [];
    for (const hard of String(text).split('\n')) {
      let line = '';
      for (let w of hard.split(' ')) {
        while (w.length > cols) { if (line) { out.push(line); line = ''; } out.push(w.substr(0, cols)); w = w.substr(cols); }
        if (!line) line = w; else if (line.length + 1 + w.length <= cols) line += ' ' + w; else { out.push(line); line = w; }
      }
      out.push(line);
    }
    return out;
  },
  format(text) { return UI.subst(text).split(/\n\s*\n|\f/).map(p => UI.wrap(p.trim(), UI.COLS)).filter(p => p.length && (p.length > 1 || p[0] !== '')); },

  async waitPress(arrow) {
    UI.tb.more = !!arrow;
    for (;;) { await frame(); if (Input.hit('a') || Input.hit('b')) break; }
    UI.tb.more = false; if (arrow) Sound.sfx('text');
  },
  // Zeigt Text in der Textbox. opts: wait (auf Taste warten, Standard true), keep (Box stehen lassen),
  // auto (Ticks, nach denen ohne Taste fortgesetzt wird)
  async say(text, opts) {
    opts = opts || {}; const pages = UI.format(text), tb = UI.tb;
    if (!pages.length) return;
    UI.tbShow();
    for (let pi = 0; pi < pages.length; pi++) {
      const lines = pages[pi]; tb.lines = ['', ''];
      for (let li = 0; li < lines.length; li++) {
        if (li >= 2) { await UI.waitPress(true); tb.lines[0] = tb.lines[1]; tb.lines[1] = ''; await wait(2); }
        const row = Math.min(li, 1), full = lines[li]; let n = 0, acc = 0;
        while (n < full.length) {
          await frame();
          let spd = Opt.text === 0 ? 0.34 : Opt.text === 1 ? 1 : 3;
          if (Input.held('a') || Input.held('b')) spd = Math.max(4, spd * 4);
          acc += spd; while (acc >= 1 && n < full.length) { n++; acc -= 1; }
          tb.lines[row] = full.substr(0, n);
        }
      }
      const last = pi === pages.length - 1;
      if (!last || opts.wait !== false) {
        if (opts.auto) { for (let i = 0; i < opts.auto; i++) { await frame(); if (Input.hit('a') || Input.hit('b')) break; } }
        else await UI.waitPress(true);
      }
    }
    if (!opts.keep) UI.tbHide();
  },

  // --- Menüs ---
  // o: {x, y, w, items:[string | {label, right}], sel, rows (sichtbare Zeilen), pitch (8|16), cols, cw,
  //     cancel (B erlaubt, Standard true), onSel(index), onKey(key, index) -> true beendet mit {key,index}}
  openMenu(o) {
    const m = {
      o: o, sel: U.clamp(o.sel | 0, 0, Math.max(0, o.items.length - 1)), top: 0, active: true,
      get rows() { return Math.min(o.rows || Math.ceil(o.items.length / (o.cols || 1)), Math.ceil(o.items.length / (o.cols || 1))) || 1; },
      get pitch() { return o.pitch || 16; },
      get off() { return o.title ? 4 : 0; },      // Menüs mit Titel: Einträge etwas tiefer
      get h() { return o.h || (this.pitch === 16 ? this.rows * 16 + 8 : this.rows * this.pitch + 14) + this.off; },
      draw() {
        const cols = o.cols || 1, cw = o.cw || 0, p = this.pitch, items = o.items;
        Gfx.box(o.x, o.y, o.w, this.h);
        if (o.title) { Gfx.rect(o.x + 8, o.y, o.title.length * 8, 8, 0); Gfx.text(o.title, o.x + 8, o.y); }
        for (let r = 0; r < this.rows; r++) for (let c = 0; c < cols; c++) {
          const i = (this.top + r) * cols + c; if (i >= items.length) continue;
          const it = items[i], label = typeof it === 'string' ? it : it.label, ty = o.y + 8 + this.off + r * p, tx = o.x + 16 + c * cw;
          Gfx.text(label, tx, ty);
          if (it.right != null) Gfx.textR(it.right, o.x + o.w - 8, ty);
          if (i === this.sel) Gfx.text('▶', tx - 8, ty, this.active ? 3 : 1);
        }
        if (cols === 1 && items.length > this.rows) {
          if (this.top > 0) Gfx.text('▲', o.x + o.w - 16, o.y);
          if (this.top + this.rows < items.length) Gfx.text('▼', o.x + o.w - 16, o.y + this.h - 8);
        }
      },
      fix() { const cols = o.cols || 1, row = Math.floor(this.sel / cols); if (row < this.top) this.top = row; if (row >= this.top + this.rows) this.top = row - this.rows + 1; },
      async choose() {
        const cols = o.cols || 1, n = o.items.length; this.active = true; this.fix();
        if (o.onSel) o.onSel(this.sel);
        for (;;) {
          await frame(); const old = this.sel;
          if (n > 0) {
            if (Input.rep('down')) this.sel = this.sel + cols < n ? this.sel + cols : (cols === 1 ? 0 : this.sel);
            if (Input.rep('up')) this.sel = this.sel - cols >= 0 ? this.sel - cols : (cols === 1 ? n - 1 : this.sel);
            if (cols > 1) { if (Input.rep('right') && this.sel % cols < cols - 1 && this.sel + 1 < n) this.sel++; if (Input.rep('left') && this.sel % cols > 0) this.sel--; }
          }
          if (this.sel !== old) { Sound.sfx('select'); this.fix(); if (o.onSel) o.onSel(this.sel); }
          if (o.onKey) { for (const k of ['left', 'right', 'start']) if (Input.hit(k) && o.onKey(k, this.sel)) { this.active = false; return { key: k, index: this.sel }; } }
          if (Input.hit('a') && n > 0) { Sound.sfx('confirm'); this.active = false; return this.sel; }
          if (Input.hit('b') && o.cancel !== false) { Sound.sfx('cancel'); this.active = false; return -1; }
        }
      },
      close() { UI.pop(m); }
    };
    UI.push(m); return m;
  },
  async menu(o) { const m = UI.openMenu(o); const r = await m.choose(); m.close(); return r; },
  // Ja/Nein-Frage über der Textbox.
  async ask(text, defNo) {
    await UI.say(text, { wait: false, keep: true });
    const r = await UI.menu({ x: 104, y: 56, w: 56, items: ['JA', 'NEIN'], sel: defNo ? 1 : 0 });
    UI.tbHide(); return r === 0;
  },
  // Text + Auswahlliste; liefert Index oder -1.
  async choice(text, options, cancel) {
    await UI.say(text, { wait: false, keep: true });
    const w = Math.min(160, Math.max(...options.map(s => s.length)) * 8 + 24), rows = Math.min(options.length, 5);
    const r = await UI.menu({ x: 160 - w, y: 96 - (rows * 16 + 8), w: w, items: options, rows: rows, cancel: cancel !== false });
    UI.tbHide(); return r;
  },
  // Mengenwahl (Shop, Wegwerfen): liefert Anzahl oder 0 bei Abbruch.
  async number(o) {
    let n = 1; const max = Math.max(1, o.max | 0);
    const l = UI.push({ draw() { Gfx.box(o.x, o.y, 88, 24); Gfx.text('×' + U.pad(n, 2, '0'), o.x + 8, o.y + 8); if (o.price != null) Gfx.textR('$' + (n * o.price), o.x + 80, o.y + 8); } });
    try {
      for (;;) {
        await frame(); const old = n;
        if (Input.rep('up')) n = n < max ? n + 1 : 1; if (Input.rep('down')) n = n > 1 ? n - 1 : max;
        if (Input.rep('right')) n = Math.min(max, n + 10); if (Input.rep('left')) n = Math.max(1, n - 10);
        if (n !== old) Sound.sfx('select');
        if (Input.hit('a')) { Sound.sfx('confirm'); return n; }
        if (Input.hit('b')) { Sound.sfx('cancel'); return 0; }
      }
    } finally { UI.pop(l); }
  },

  // --- Namenseingabe (Zeichenraster) ---
  NAME_PAGES: [
    ['ABCDEFGHI', 'JKLMNOPQR', 'STUVWXYZÄ', 'ÖÜ-.!?012', "3456789' "],
    ['abcdefghi', 'jklmnopqr', 'stuvwxyzä', 'öüß.!?012', "3456789' "]
  ],
  async nameEntry(o) {
    let name = '', page = 0, cx = 0, cy = 0; const max = o.max || 8;
    const l = UI.push({
      draw() {
        Gfx.clear(0); Gfx.text(o.title || 'NAME?', 8, 4);
        if (o.icon) Gfx.spr(o.icon, 136, 0);
        for (let i = 0; i < max; i++) { if (i < name.length) Gfx.text(name[i], 40 + i * 8, 18); Gfx.rect(40 + i * 8, 27, 7, 1, i === name.length ? 3 : 1); }
        Gfx.box(0, 32, 160, 92);
        const rows = UI.NAME_PAGES[page];
        for (let r = 0; r < 5; r++) for (let c = 0; c < 9; c++) { const ch = rows[r][c]; Gfx.text(ch === ' ' ? '_' : ch, 16 + c * 16, 40 + r * 16, ch === ' ' ? 1 : 3); if (cy === r && cx === c) Gfx.text('▶', 8 + c * 16, 40 + r * 16); }
        const opts = [page ? 'ABC' : 'abc', 'LÖSCH', 'ENDE'];
        opts.forEach((s, i) => { Gfx.text(s, 16 + i * 48, 130); if (cy === 5 && cx === i) Gfx.text('▶', 8 + i * 48, 130); });
      }
    });
    try {
      for (;;) {
        await frame(); const ox = cx, oy = cy;
        const wmax = cy === 5 ? 2 : 8;
        if (Input.rep('right')) cx = cx < wmax ? cx + 1 : 0; if (Input.rep('left')) cx = cx > 0 ? cx - 1 : wmax;
        if (Input.rep('down')) { if (cy === 4) { cy = 5; cx = Math.min(2, Math.floor(cx / 3)); } else if (cy === 5) { cy = 0; cx = cx * 3; } else cy++; }
        if (Input.rep('up')) { if (cy === 0) { cy = 5; cx = Math.min(2, Math.floor(cx / 3)); } else if (cy === 5) { cy = 4; cx = cx * 3; } else cy--; }
        if (cx !== ox || cy !== oy) Sound.sfx('select');
        if (Input.hit('start')) { cy = 5; cx = 2; }
        if (Input.hit('b')) { if (name.length) { name = name.slice(0, -1); Sound.sfx('cancel'); } }
        if (Input.hit('a')) {
          Sound.sfx('confirm');
          if (cy < 5) { if (name.length < max) name += UI.NAME_PAGES[page][cy][cx]; if (name.length >= max) { cy = 5; cx = 2; } }
          else if (cx === 0) page = 1 - page;
          else if (cx === 1) name = name.slice(0, -1);
          else { name = name.trim(); return name || o.def || ''; }
        }
      }
    } finally { UI.pop(l); }
  },

  // --- Blenden (stufenweise wie auf dem Game Boy) ---
  async fadeOut(dark, step) { const s = dark ? -1 : 1; for (let i = 1; i <= 3; i++) { Gfx.fade = s * i; await wait(step || 4); } },
  async fadeIn(dark, step) { const s = dark ? -1 : 1; for (let i = 2; i >= 0; i--) { Gfx.fade = s * i; await wait(step || 4); } },
  // Kleines Hinweisfenster oben (z.B. Ortsname); verschwindet von selbst.
  banner(text, ticks) { UI.bannerText = String(text || '').substr(0, 18); UI.bannerT = ticks || 110; },
  drawBanner() {
    if (!(UI.bannerT > 0)) return; UI.bannerT--;
    const w = UI.bannerText.length * 8 + 16, y = UI.bannerT > 100 ? -(UI.bannerT - 100) * 2 : UI.bannerT < 10 ? -(10 - UI.bannerT) * 2 : 0;
    Gfx.box(0, y, w, 24); Gfx.text(UI.bannerText, 8, y + 8);
  }
};

// ===== [09] EREIGNISSYSTEM ===================================================
// Bedingungen und Aktionen sind reine Daten. Jede Art ist hier registriert, zusammen mit
// einer Feldbeschreibung ("fields"), aus der der Editor automatisch Formulare erzeugt.
// Feldtypen: text, area, int, bool, select(opts), ref(Tabelle), op, flag, var, npc, dir,
//            layer, path, conds, actions
const OPS = { '>=': (a, b) => a >= b, '<=': (a, b) => a <= b, '==': (a, b) => a === b, '!=': (a, b) => a !== b, '>': (a, b) => a > b, '<': (a, b) => a < b };
function cmp(a, op, b) { return (OPS[op] || OPS['>='])(+a || 0, +b || 0); }
const F_OP = { k: 'op', label: 'Vergleich', t: 'op', def: '>=' };

const Cond = {
  defs: {
    flag: { label: 'Ereignis-Flag ist gesetzt', fields: [{ k: 'flag', label: 'Flag', t: 'flag' }], test: c => Game.flag(c.flag) },
    var: { label: 'Variable hat Wert', fields: [{ k: 'name', label: 'Variable', t: 'var' }, F_OP, { k: 'value', label: 'Wert', t: 'int', def: 0 }], test: c => cmp(Game.getVar(c.name), c.op, c.value) },
    hasItem: { label: 'Spieler besitzt Gegenstand', fields: [{ k: 'item', label: 'Gegenstand', t: 'ref', ref: 'items' }, { k: 'n', label: 'Anzahl', t: 'int', def: 1 }], test: c => Bag.has(c.item, c.n || 1) },
    hasBadge: { label: 'Spieler besitzt Arenamedaille', fields: [{ k: 'gym', label: 'Arena', t: 'ref', ref: 'gyms' }], test: c => G.badges.includes(c.gym) },
    badges: { label: 'Anzahl Arenamedaillen', fields: [F_OP, { k: 'n', label: 'Anzahl', t: 'int', def: 1 }], test: c => cmp(G.badges.length, c.op, c.n) },
    trainerDefeated: { label: 'Trainer wurde besiegt', fields: [{ k: 'trainer', label: 'Trainer', t: 'ref', ref: 'trainers' }], test: c => !!G.defeated[c.trainer] },
    questActive: { label: 'Quest läuft', fields: [{ k: 'quest', label: 'Quest', t: 'ref', ref: 'quests' }], test: c => G.quests[c.quest] === 'active' },
    questDone: { label: 'Quest abgeschlossen', fields: [{ k: 'quest', label: 'Quest', t: 'ref', ref: 'quests' }], test: c => G.quests[c.quest] === 'done' },
    caught: { label: 'Monsterart wurde gefangen', fields: [{ k: 'species', label: 'Monster', t: 'ref', ref: 'monsters' }], test: c => !!G.caught[c.species] },
    seen: { label: 'Monsterart wurde gesehen', fields: [{ k: 'species', label: 'Monster', t: 'ref', ref: 'monsters' }], test: c => !!G.seen[c.species] },
    dexCaught: { label: 'Anzahl gefangener Arten', fields: [F_OP, { k: 'n', label: 'Anzahl', t: 'int', def: 1 }], test: c => cmp(Game.caughtCount(), c.op, c.n) },
    money: { label: 'Spieler besitzt Geldbetrag', fields: [F_OP, { k: 'n', label: 'Betrag', t: 'int', def: 100 }], test: c => cmp(G.money, c.op, c.n) },
    hasParty: { label: 'Spieler hat ein Monster dabei', fields: [], test: () => G.party.length > 0 },
    inParty: { label: 'Monsterart ist im Team', fields: [{ k: 'species', label: 'Monster', t: 'ref', ref: 'monsters' }], test: c => G.party.some(m => m.species === c.species) },
    partyLevel: { label: 'Höchstes Level im Team', fields: [F_OP, { k: 'n', label: 'Level', t: 'int', def: 10 }], test: c => cmp(Math.max(0, ...G.party.map(m => m.level)), c.op, c.n) },
    chance: { label: 'Zufall (Prozent)', fields: [{ k: 'pct', label: 'Wahrscheinlichkeit %', t: 'int', def: 50 }], test: c => Math.random() * 100 < (+c.pct || 0) }
  },
  test(c) { const d = c && Cond.defs[c.k]; if (!d) return true; let r = false; try { r = !!d.test(c); } catch (e) { r = false; } return c.not ? !r : r; },
  all(list) { if (!list) return true; for (const c of list) if (!Cond.test(c)) return false; return true; }
};
