// ----- kleine DOM-Helfer -------------------------------------------------------
function edEl(tag, props, kids) {
  const e = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k]; if (v == null) continue;
    if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v; else if (k === 'html') e.innerHTML = v;
    else if (k === 'style') e.style.cssText = v; else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), v);
    else if (k in e && k !== 'list') e[k] = v; else e.setAttribute(k, v);
  }
  if (kids != null) for (const c of [].concat(kids)) if (c != null) e.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c)));
  return e;
}
function edBtn(label, fn, cls, title) { return edEl('button', { class: 'ed-btn' + (cls ? ' ' + cls : ''), type: 'button', text: label, title: title, onclick: fn }); }
function edGet(o, path) { for (const k of String(path).split('.')) { if (o == null) return undefined; o = o[k]; } return o; }
function edSet(o, path, v) {
  const p = String(path).split('.');
  for (let i = 0; i < p.length - 1; i++) { if (o[p[i]] == null || typeof o[p[i]] !== 'object') o[p[i]] = /^\d+$/.test(p[i + 1]) ? [] : {}; o = o[p[i]]; }
  if (v === undefined) delete o[p[p.length - 1]]; else o[p[p.length - 1]] = v;
}

const Editor = {
  root: null, main: null, page: 'maps', sel: {}, cache: {},
  changed: false,   // Projekt wurde geändert, seit die Engine zuletzt synchronisiert wurde
  dirty: false,     // ungespeicherte Änderungen (gegenüber Arbeitskopie/Export)
  undoStack: [], redoStack: [], snap: '', resumeSong: '',
  // Seiten des Editors: [id, Titel]; '-' = Trennlinie. Renderer liegen in Editor.pages[id].render(main).
  PAGES: [['maps', 'Karten'], ['tiles', 'Tiles'], ['charsets', 'Figuren'], ['pixel', 'Pixel-Editor'], ['-'],
    ['monsters', 'Monster'], ['moves', 'Attacken'], ['types', 'Typen'], ['items', 'Gegenstände'], ['trainers', 'Trainer'], ['shops', 'Shops'], ['gyms', 'Arenen'], ['quests', 'Quests'], ['-'],
    ['songs', 'Musik'], ['sfx', 'Soundeffekte'], ['-'], ['meta', 'Einstellungen'], ['project', 'Projekt'], ['validate', 'Validierung']],
  pages: {},

  // ---------------------------------------------------------------------------
  build() {
    document.head.appendChild(edEl('style', { text: ED_CSS }));
    const root = Editor.root = edEl('div', { id: 'ed-root' });
    // Schaltfläche mit Symbol + Beschriftung; auf schmalen Bildschirmen bleibt nur das Symbol (CSS .ed-lbl).
    const ib = (icon, label, fn, cls, title) => { const b = edBtn(icon, fn, cls, title || label.trim()); b.appendChild(edEl('span', { class: 'ed-lbl', text: label })); return b; };
    Editor.btnUndo = ib('↶', ' Rückgängig', () => Editor.undo(), '', 'Rückgängig (Strg+Z)');
    Editor.btnRedo = ib('↷', ' Wiederholen', () => Editor.redo(), '', 'Wiederholen (Strg+Y)');
    Editor.statusEl = edEl('span', { class: 'ed-status' });
    root.appendChild(edEl('div', { class: 'ed-top' }, [
      edEl('span', { class: 'ed-title', text: 'Leinenmeister-Editor' }),
      (Editor.btnSave = edBtn('Speichern', () => Editor.save(), 'pri', 'Arbeitskopie im Browser speichern (Strg+S)')),
      Editor.btnUndo, Editor.btnRedo,
      ib('✓', ' Validieren', () => Editor.go({ page: 'validate' }), '', 'Projekt prüfen (Validieren)'),
      ib('▶', ' Spiel testen', () => Editor.test(), 'on', 'Neues Testspiel ab Spielstart'),
      ib('⬇', ' HTML exportieren', () => Editor.exportHTML(), '', 'Vollständiges Spiel als eigenständige HTML-Datei (HTML exportieren)'),
      edEl('span', { class: 'ed-spacer' }), Editor.statusEl,
      ib('✕', ' Schliessen (F2)', () => Editor.close(), '', 'Editor schliessen (F2)')
    ]));
    Editor.nav = edEl('div', { class: 'ed-nav' });
    for (const p of Editor.PAGES) {
      if (p[0] === '-') Editor.nav.appendChild(edEl('div', { class: 'ed-navsep' }));
      else Editor.nav.appendChild(edEl('button', { type: 'button', text: p[1], 'data-page': p[0], onclick: () => Editor.go({ page: p[0] }) }));
    }
    Editor.main = edEl('div', { class: 'ed-main' });
    root.appendChild(edEl('div', { class: 'ed-body' }, [Editor.nav, Editor.main]));
    document.body.appendChild(root);
    Editor.hintScroll(root.querySelector('.ed-top')); Editor.hintScroll(Editor.nav);
    window.addEventListener('resize', () => { if (Engine.editorOpen) Editor.updHints(); });
    window.addEventListener('keydown', Editor.onKey);
    window.addEventListener('beforeunload', e => { if (Editor.dirty) { e.preventDefault(); e.returnValue = ''; } });
  },
  open() {
    if (!Editor.root) Editor.build();
    Engine.editorOpen = true; Input.releaseAll();
    Editor.resumeSong = Sound.wantId || ''; Sound.stopSong(); Sound.wantId = '';     // im Editor läuft keine Musik (nur Vorschau auf der Musik-Seite)
    // Grundlage für Rückgängig; hat sich DB ausserhalb des Editors geändert, wird der Verlauf verworfen.
    const now = JSON.stringify(DB);
    if (now !== Editor.snap) { Editor.snap = now; if (Editor.undoStack.length || Editor.redoStack.length) { Editor.undoStack = []; Editor.redoStack = []; } }
    Editor.root.classList.add('open'); Editor.render();
  },
  // Wischbare Leisten (schmale Bildschirme): zeigt rechts einen Pfeil, solange dort noch Inhalt folgt.
  hintScroll(el) {
    if (!el) return el;
    if (!el.classList.contains('ed-hs')) { el.classList.add('ed-hs'); el.addEventListener('scroll', () => Editor.updHint(el), { passive: true }); }
    requestAnimationFrame(() => Editor.updHint(el)); return el;
  },
  updHint(el) { el.classList.toggle('ed-more', el.scrollWidth - el.clientWidth - el.scrollLeft > 6); },
  updHints() { if (Editor.root) requestAnimationFrame(() => Editor.root.querySelectorAll('.ed-hs').forEach(Editor.updHint)); },
  // Übernimmt eine noch nicht bestätigte Eingabe (Feld verliert den Fokus -> change-Ereignis).
  flush() { const a = document.activeElement; if (a && Editor.root && Editor.root.contains(a) && a.blur) a.blur(); },
  close() {
    if (!Editor.root) return;
    Editor.flush(); Editor.root.classList.remove('open'); Engine.editorOpen = false; Sound.stopSong();
    if (Editor.pages.pixel && Editor.pages.pixel.stopAnim) Editor.pages.pixel.stopAnim();
    if (Editor.changed) { Editor.changed = false; Engine.reloadData(); Engine.toTitle(); }
    else if (Editor.resumeSong) Sound.playSong(Editor.resumeSong);
  },
  // Testspiel starten (o = {map,x,y} oder leer für Spielstart). F2 führt zurück in den Editor.
  test(o) {
    Editor.flush(); Editor.root.classList.remove('open'); Engine.editorOpen = false; Editor.changed = false; Sound.stopSong();
    if (Editor.toastEl) { Editor.toastEl.remove(); Editor.toastEl = null; }
    if (Editor.pages.pixel && Editor.pages.pixel.stopAnim) Editor.pages.pixel.stopAnim();
    try { Engine.startTest(o); } catch (e) { console.error(e); Editor.open(); Editor.alert('Das Testspiel konnte nicht gestartet werden:\n' + e.message); }
  },
  // Wechselt Seite/Eintrag. t: {page, id?, map?, kind?, ent?, sprite?}
  go(t) {
    if (t.page) Editor.page = t.page;
    if (t.id != null) Editor.sel[t.page] = t.id;
    const pg = Editor.pages[Editor.page]; if (pg && pg.goto) pg.goto(t);
    Editor.render();
  },
  render() {
    if (!Editor.root) return;
    Editor.cache = {};
    Editor.nav.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.getAttribute('data-page') === Editor.page));
    const pg = Editor.pages[Editor.page]; Editor.main.innerHTML = ''; Editor.main.className = 'ed-main';
    try { if (pg) pg.render(Editor.main); else Editor.main.appendChild(edEl('div', { class: 'ed-form', text: 'Seite fehlt: ' + Editor.page })); }
    catch (e) { console.error('Leinenmeister-Editor:', e); Editor.main.appendChild(edEl('div', { class: 'ed-form ed-err', text: 'Fehler beim Anzeigen dieser Seite: ' + e.message })); }
    Editor.updateStatus();
  },
  updateStatus() {
    if (!Editor.statusEl) return;
    Editor.statusEl.textContent = Editor.dirty ? '● Ungespeicherte Änderungen' : 'Gespeichert' + (Project.source === 'working' ? ' (Arbeitskopie)' : '');
    Editor.statusEl.classList.toggle('dirty', Editor.dirty); if (Editor.btnSave) Editor.btnSave.classList.toggle('unsaved', Editor.dirty);   // auf Handys ist der Statustext ausgeblendet
    Editor.updHints();
    Editor.btnUndo.disabled = !Editor.undoStack.length; Editor.btnRedo.disabled = !Editor.redoStack.length;
  },

  // --- Rückgängig / Wiederholen (Schnappschüsse des gesamten Projekts) --------
  // Nach JEDER Änderung an DB aufrufen. Liefert true, wenn sich etwas geändert hat.
  commit() {
    const now = JSON.stringify(DB); Editor.cache = {};
    if (now === Editor.snap) return false;
    Editor.undoStack.push(Editor.snap); if (Editor.undoStack.length > 40) Editor.undoStack.shift();
    Editor.redoStack = []; Editor.snap = now; Editor.changed = true; Editor.dirty = true; Editor.updateStatus();
    return true;
  },
  restore(snap) {
    Data.init(JSON.parse(snap)); Editor.snap = JSON.stringify(DB);
    Gfx.invalidate(); Sound.invalidate(); Editor.changed = true; Editor.dirty = true;
    for (const k in Editor.pages) if (Editor.pages[k].onRestore) Editor.pages[k].onRestore();   // flüchtigen Seitenzustand verwerfen
    Editor.render();
  },
  undo() { if (!Editor.undoStack.length) return; Editor.redoStack.push(Editor.snap); Editor.restore(Editor.undoStack.pop()); },
  redo() { if (!Editor.redoStack.length) return; Editor.undoStack.push(Editor.snap); Editor.restore(Editor.redoStack.pop()); },
  // Ersetzt das gesamte Projekt (Import, Sicherung, Verwerfen) – als ein Rückgängig-Schritt.
  replaceProject(fn) {
    const before = Editor.snap; fn();
    Editor.snap = JSON.stringify(DB);
    if (Editor.snap !== before) { Editor.undoStack.push(before); Editor.redoStack = []; Editor.changed = true; }
    Gfx.invalidate(); Sound.invalidate();
    for (const k in Editor.pages) if (Editor.pages[k].onRestore) Editor.pages[k].onRestore();

  },
  save() {
    Editor.flush();
    if (Project.saveWorking()) { Editor.snap = JSON.stringify(DB); Editor.dirty = false; Editor.toast('Projekt gespeichert (Arbeitskopie im Browser). Für eine dauerhafte Datei: HTML oder JSON exportieren.'); }
    else Editor.alert('Speichern fehlgeschlagen: Der Browser-Speicher ist voll oder gesperrt.\nBitte das Projekt als JSON oder HTML exportieren.');

  async exportHTML() {

    try { Project.exportHTML(); Editor.snap = JSON.stringify(DB); Editor.toast('HTML-Datei exportiert: ' + Project.fileBase() + '.html'); }
    catch (e) { Editor.alert('Export fehlgeschlagen: ' + e.message); }

  },
  onKey(e) {
    if (!Engine.editorOpen || !Editor.root || !Editor.root.classList.contains('open')) return;
    const typing = Input.typing(e), k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;

  },

  // --- Dialoge -----------------------------------------------------------------
  toast(msg, bad) {
    if (Editor.toastEl) Editor.toastEl.remove();
    const t = Editor.toastEl = edEl('div', { class: 'ed-toast' + (bad ? ' bad' : ''), text: msg }); document.body.appendChild(t);
    setTimeout(() => { if (Editor.toastEl === t) { t.remove(); Editor.toastEl = null; } }, bad ? 5000 : 3200);
  },
  // Modaler Dialog. o: {title, text?, fields?, values?, ok?, cancel? (false = kein Abbrechen)} -> Promise(values | null)
  dialog(o) {
    return new Promise(res => {
      const vals = Object.assign({}, o.values || {});
      const box = edEl('div', { class: 'ed-modal' }, [edEl('h3', { text: o.title || '' })]);
      if (o.text) box.appendChild(edEl('p', { text: o.text }));
      if (o.fields) box.appendChild(Editor.fields(vals, o.fields, () => { }, {}));
      const bg = edEl('div', { class: 'ed-modalbg' }, box);
      const done = v => { bg.remove(); Editor.modal = null; res(v); };
      const m = Editor.modal = { ok: () => { const a = document.activeElement; if (a && bg.contains(a) && a.blur) a.blur(); done(vals); }, cancel: () => done(null) };
      const btns = edEl('div', { class: 'ed-modalbtns' });
      if (o.cancel !== false) btns.appendChild(edBtn('Abbrechen', m.cancel, 'ed-cancel'));
      btns.appendChild(edBtn(o.ok || 'OK', m.ok, 'pri ed-ok'));

  async confirm(text, okLabel) { return !!(await Editor.dialog({ title: 'Bitte bestätigen', text: text, ok: okLabel || 'Ja' })); },
  alert(text) { return Editor.dialog({ title: 'Hinweis', text: text, cancel: false }); },

  // --- Hilfen ------------------------------------------------------------------
  // Eigenständiges Canvas mit einem Sprite (für Listen, Vorschauen, Paletten).
  spriteCanvas(key, scale) {
    scale = scale || 1; const ok = !!DB.sprites[key], src = ok ? Gfx.get(key) : null, w = ok ? src.width : 16, h = ok ? src.height : 16;
    const c = edEl('canvas', { width: w * scale, height: h * scale, class: 'ed-prev' }), x = c.getContext('2d'); x.imageSmoothingEnabled = false;
    if (ok) x.drawImage(src, 0, 0, w * scale, h * scale);
    else { x.fillStyle = '#5a2630'; x.fillRect(0, 0, c.width, c.height); x.fillStyle = '#ffb0b0'; x.font = (8 * scale) + 'px sans-serif'; x.fillText('?', 5 * scale, 11 * scale); }
    return c;
  },
  // Besucht alle Bedingungen und Aktionen des Projekts: cb('cond'|'act', objekt, ort)
  walkScripts(cb) {
    const conds = (list, w) => { for (const c of Array.isArray(list) ? list : []) if (c) cb('cond', c, w); };
    const acts = (list, w) => {
      for (const a of Array.isArray(list) ? list : []) {
        if (!a) continue; cb('act', a, w); const d = Act.defs[a.k]; if (!d) continue;
        for (const f of d.fields) { if (f.t === 'actions') acts(a[f.k], w); else if (f.t === 'conds') conds(a[f.k], w); }
      }
    };
    const rows = l => (l || []).filter(e => e && typeof e === 'object');   // beschädigte (leere) Einträge überspringen
    for (const t of rows(DB.trainers)) conds(t.cond, { page: 'trainers', id: t.id, label: 'Trainer "' + t.id + '"' });
    for (const s of rows(DB.shops)) for (const e of rows(s.stock)) conds(e.cond, { page: 'shops', id: s.id, label: 'Shop "' + s.id + '"' });
    for (const g of rows(DB.gyms)) { const w = { page: 'gyms', id: g.id, label: 'Arena "' + g.id + '"' }; conds(g.entryCond, w); acts(g.rewards, w); }
    for (const q of rows(DB.quests)) acts(q.rewards, { page: 'quests', id: q.id, label: 'Quest "' + q.id + '"' });
    for (const m of rows(DB.maps)) {

// Typentabelle als anklickbare Matrix (DB.typeChart; fehlender Eintrag = Faktor 1).
Editor.typeMatrix = function () {
  const wrap = edEl('div', { style: 'overflow:auto' }), tb = edEl('table', { class: 'ed-matrix' }), types = DB.types;
  const head = edEl('tr', {}, [edEl('th', { text: 'Angriff ↓ / Vert. →' })]); for (const d of types) head.appendChild(edEl('th', { class: 'v', text: d.name })); tb.appendChild(head);
  const show = (td, f) => { td.textContent = f === 1 ? '' : f === 0.5 ? '½' : String(f); td.className = f === 2 ? 'f2' : f === 0.5 ? 'f05' : f === 0 ? 'f0' : ''; };
  for (const a of types) {
    const tr = edEl('tr', {}, [edEl('th', { text: a.name, style: 'text-align:right' })]);
    for (const d of types) {
      const get = () => { const r = DB.typeChart[a.id]; return r && r[d.id] != null ? r[d.id] : 1; };
      const td = edEl('td', { title: a.name + ' gegen ' + d.name, onclick: () => { const next = { 1: 2, 2: 0.5, 0.5: 0, 0: 1 }[get()]; const row = DB.typeChart[a.id] = DB.typeChart[a.id] || {}; if (next === 1) delete row[d.id]; else row[d.id] = next; show(td, next); Editor.commit(); } });
      show(td, get()); tr.appendChild(td);
    }
    tb.appendChild(tr);
  }
  wrap.appendChild(tb); return wrap;
};

// Erzeugt eine Listen-/Formularseite für eine Datentabelle gemäss Editor.SCHEMAS[key].
Editor.dbPage = function (key) {
  const S = Editor.SCHEMAS[key];
  const pg = {
    filter: '',
    render(main) {
      const table = DB[S.table];
      const cur = () => table.find(e => e && String(e.id) === String(Editor.sel[key])) || null;
      if (!cur() && table.some(Boolean)) Editor.sel[key] = table.find(Boolean).id;
      const items = edEl('div', { class: 'ed-items' }), form = edEl('div', { class: 'ed-form' });
      const drawList = () => {
        items.innerHTML = ''; const q = pg.filter.trim().toLowerCase();
        for (const e of table) {
          if (!e || typeof e !== 'object') continue;
          const label = S.label(e); if (q && (label + ' ' + e.id).toLowerCase().indexOf(q) < 0) continue;
          const row = edEl('div', { class: 'ed-item' + (String(e.id) === String(Editor.sel[key]) ? ' on' : ''), 'data-id': e.id, onclick: () => { Editor.sel[key] = e.id; drawList(); drawForm(); } });
          if (S.icon) row.appendChild(Editor.spriteCanvas(S.icon(e), S.iconScale || 1));
          row.appendChild(edEl('span', { text: label })); row.appendChild(edEl('small', { text: S.numeric ? '#' + e.id : e.id }));
          items.appendChild(row);
        }
        if (!table.length) items.appendChild(edEl('div', { class: 'ed-hint', style: 'padding:10px', text: 'Noch keine Einträge. Mit "Neu" anlegen.' }));
      };
      const onChange = () => { Data.reindex(); if (key === 'songs') Sound.invalidate(); Editor.commit(); const e = cur(), row = e && items.querySelector('.ed-item.on span'); if (row) row.textContent = S.label(e); };
      const drawForm = () => {
        const top = form.scrollTop; form.innerHTML = ''; const e = cur();
        if (!e) { form.appendChild(edEl('div', { class: 'ed-hint', text: 'Kein Eintrag ausgewählt.' })); return; }
        form.appendChild(edEl('h2', {}, [S.title + ': ' + S.label(e), edEl('small', { text: 'ID: ' + e.id }), ...(S.buttons ? S.buttons(e) : [])]));
        form.appendChild(Editor.fields(e, S.fields, onChange, { rerender: drawForm }));
        if (S.extra) S.extra(form, e);
        form.scrollTop = top;
      };
      const add = async () => {

  for (const s of rows('shops')) if (!usedShop[s.id]) warn('Shop "' + s.name + '" wird von keinem NPC geöffnet.', { page: 'shops', id: s.id });
  for (const q of rows('quests')) if (!usedQuest[q.id]) warn('Quest "' + q.name + '" wird nirgends gestartet.', { page: 'quests', id: q.id });
  // --- Textlängen: Die Engine schneidet zu lange Texte ab, damit nichts über Rahmen hinausläuft. Hier wird davor gewarnt. ---
  const lines = (t, n) => UI.wrap(String(t || ''), n).length;
  for (const m of rows('monsters')) { const go = { page: 'monsters', id: m.id }; if ((m.kind || '').length > 10) warn('Monster "' + m.name + '": Monsterart länger als 10 Zeichen (wird im Lexikon abgeschnitten).', go); if (lines(m.desc, 18) > 7) warn('Monster "' + m.name + '": Lexikontext länger als 7 Zeilen à 18 Zeichen (wird abgeschnitten).', go); }
  for (const i of rows('items')) { const go = { page: 'items', id: i.id }; if ((i.name || '').length > 12) warn('Gegenstand "' + i.name + '": Name länger als 12 Zeichen (wird in Listen abgeschnitten).', go); if (lines(i.desc, 18) > 3) warn('Gegenstand "' + i.name + '": Beschreibung länger als 3 Zeilen à 18 Zeichen (wird abgeschnitten).', go); }
  for (const m of rows('maps')) if ((m.name || '').length > 18) warn('Karte "' + m.id + '": Name länger als 18 Zeichen (Ortsanzeige wird abgeschnitten).', { page: 'maps', map: m.id });
  for (const g of rows('gyms')) if (g.badge && (g.badge.name || '').length > 15) warn('Arena "' + g.name + '": Medaillenname länger als 15 Zeichen (wird abgeschnitten).', { page: 'gyms', id: g.id });
  for (const q of rows('quests')) if ((q.name || '').length > 17) warn('Quest "' + q.name + '": Name länger als 17 Zeichen (wird im Trainerpass abgeschnitten).', { page: 'quests', id: q.id });
  out.sort((a, b) => (a.level === b.level ? 0 : a.level === 'error' ? -1 : 1));
  return out;
};
